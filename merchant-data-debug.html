<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Data Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 Merchant Data Debug Tool</h1>
    
    <div id="status"></div>
    
    <button onclick="checkAuthentication()">Check Authentication</button>
    <button onclick="testAWSConnection()">Test AWS Connection</button>
    <button onclick="loadRealMerchants()">Load Real Merchants</button>
    <button onclick="showSampleData()">Show Sample Data</button>
    
    <div id="results"></div>

    <!-- Scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="config.js"></script>
    
    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            document.getElementById('status').appendChild(div);
        }
        
        function showResults(data) {
            document.getElementById('results').innerHTML = `
                <h3>Results:</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }
        
        function checkAuthentication() {
            log('Checking authentication status...', 'info');
            
            const idToken = sessionStorage.getItem('idToken');
            const accessToken = sessionStorage.getItem('accessToken');
            const userEmail = sessionStorage.getItem('userEmail');
            
            const authStatus = {
                hasIdToken: !!idToken,
                hasAccessToken: !!accessToken,
                hasUserEmail: !!userEmail,
                idTokenPreview: idToken ? idToken.substring(0, 50) + '...' : 'None',
                accessTokenPreview: accessToken ? accessToken.substring(0, 50) + '...' : 'None',
                userEmail: userEmail || 'None'
            };
            
            if (idToken && accessToken) {
                log('✅ Authentication tokens found!', 'success');
            } else {
                log('❌ Missing authentication tokens. You may need to log in first.', 'warning');
            }
            
            showResults(authStatus);
        }
        
        async function testAWSConnection() {
            log('Testing AWS connection...', 'info');
            
            try {
                // Load config
                const resp = await fetch('amplify_outputs.json');
                const config = await resp.json();
                
                log('✅ Config loaded successfully', 'success');
                
                // Configure AWS
                const region = config.data.aws_region || 'us-east-1';
                const identityPoolId = config.auth.identity_pool_id;
                
                AWS.config.update({ region });
                
                const idToken = sessionStorage.getItem('idToken');
                if (idToken) {
                    const userPoolId = config.auth.user_pool_id;
                    const provider = `cognito-idp.${region}.amazonaws.com/${userPoolId}`;
                    AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                        IdentityPoolId: identityPoolId,
                        Logins: { [provider]: idToken }
                    });
                } else {
                    // Try unauthenticated access
                    AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                        IdentityPoolId: identityPoolId
                    });
                }
                
                await AWS.config.credentials.refreshPromise();
                log('✅ AWS credentials obtained', 'success');
                
                showResults({
                    region: region,
                    identityId: AWS.config.credentials.identityId,
                    authenticated: !!idToken,
                    identityPoolId: identityPoolId
                });
                
            } catch (error) {
                log(`❌ AWS connection failed: ${error.message}`, 'error');
                showResults({ error: error.message, stack: error.stack });
            }
        }
        
        async function loadRealMerchants() {
            log('Attempting to load real merchants from DynamoDB...', 'info');
            
            try {
                // First test AWS connection
                await testAWSConnection();
                
                // Initialize DynamoDB
                const dynamoDB = new AWS.DynamoDB.DocumentClient();
                
                // Scan the businesses table
                const params = {
                    TableName: 'order-receiver-businesses-dev',
                    Limit: 10 // Limit for testing
                };
                
                log('Scanning DynamoDB table...', 'info');
                const result = await dynamoDB.scan(params).promise();
                
                if (result.Items && result.Items.length > 0) {
                    log(`✅ Found ${result.Items.length} merchants in database!`, 'success');
                    
                    const merchants = result.Items.map(item => ({
                        id: item.id || item.businessId,
                        name: item.name || item.businessName,
                        email: item.email,
                        phone: item.phone || item.phoneNumber,
                        status: item.status,
                        isActive: item.isActive,
                        address: item.address,
                        owner: item.owner || item.ownerName
                    }));
                    
                    showResults({
                        count: merchants.length,
                        merchants: merchants
                    });
                } else {
                    log('⚠️ Database table exists but is empty', 'warning');
                    showResults({ message: 'Table is empty', rawResult: result });
                }
                
            } catch (error) {
                log(`❌ Failed to load real merchants: ${error.message}`, 'error');
                showResults({ error: error.message, code: error.code, stack: error.stack });
            }
        }
        
        function showSampleData() {
            log('Showing sample data structure...', 'info');
            
            const sampleMerchants = [
                {
                    id: 'biz-001',
                    name: 'Pizza Palace Downtown',
                    email: 'contact@pizzapalace.com',
                    phone: '+1-555-0123',
                    status: 'approved',
                    address: '123 Main St, Downtown',
                    owner: 'John Smith'
                },
                {
                    id: 'biz-002',
                    name: 'Fresh Market Express',
                    email: 'info@freshmarket.com',
                    phone: '+1-555-0124',
                    status: 'pending',
                    address: '456 Oak Avenue',
                    owner: 'Sarah Johnson'
                }
            ];
            
            showResults({
                count: sampleMerchants.length,
                sampleMerchants: sampleMerchants
            });
        }
        
        // Auto-run authentication check on load
        window.addEventListener('load', () => {
            setTimeout(checkAuthentication, 1000);
        });
    </script>
</body>
</html>
