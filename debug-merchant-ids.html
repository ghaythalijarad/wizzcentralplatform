<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Merchant IDs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 1200px; }
        .section { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .warning { background: #fff3e0; border-left: 4px solid #ff9800; }
        .info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f1f1f1; padding: 10px; border-radius: 4px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <h1>🔍 Merchant IDs Lookup</h1>
    
    <div class="section info">
        <p>This tool will scan your DynamoDB table to find actual merchant IDs that you can use for testing.</p>
        <button onclick="loadMerchantIds()">📋 Load Merchant IDs</button>
        <button onclick="testWithRealId()">🧪 Test with First Available ID</button>
    </div>

    <div class="section">
        <h3>Available Merchant IDs</h3>
        <div id="merchantIds"></div>
    </div>

    <div class="section">
        <h3>Test Results</h3>
        <div id="results"></div>
    </div>

    <script src="config.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script>
        let merchants = [];
        let dynamoDB = null;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const resultDiv = document.getElementById('results');
            resultDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function initializeAWS() {
            try {
                log('🔧 Initializing AWS connection...', 'info');
                
                const resp = await fetch('/amplify_outputs.json');
                const outputs = await resp.json();
                
                const region = outputs.data?.aws_region || 'us-east-1';
                const identityPoolId = outputs.auth?.identity_pool_id;

                AWS.config.update({ region });
                AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                    IdentityPoolId: identityPoolId
                });

                await AWS.config.credentials.refreshPromise();
                
                dynamoDB = new AWS.DynamoDB.DocumentClient({
                    convertEmptyValues: true,
                    removeUndefinedValues: true,
                    region: region
                });
                
                log('✅ AWS connection initialized', 'success');
                return true;
            } catch (error) {
                log(`❌ AWS initialization failed: ${error.message}`, 'error');
                return false;
            }
        }

        async function loadMerchantIds() {
            log('📋 Loading merchant IDs from DynamoDB...', 'info');
            
            const initialized = await initializeAWS();
            if (!initialized) return;

            try {
                const params = {
                    TableName: 'order-receiver-businesses-dev',
                    ProjectionExpression: 'businessId, businessName, #status',
                    ExpressionAttributeNames: {
                        '#status': 'status'
                    }
                };

                const result = await dynamoDB.scan(params).promise();
                
                if (result.Items && result.Items.length > 0) {
                    merchants = result.Items;
                    log(`✅ Found ${merchants.length} merchants`, 'success');
                    
                    let tableHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Business ID</th>
                                    <th>Business Name</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    merchants.forEach(merchant => {
                        tableHTML += `
                            <tr>
                                <td><code>${merchant.businessId}</code></td>
                                <td>${merchant.businessName || 'Unknown'}</td>
                                <td>${merchant.status || 'N/A'}</td>
                                <td><button onclick="testStatusUpdateWithId('${merchant.businessId}')">🧪 Test</button></td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += '</tbody></table>';
                    document.getElementById('merchantIds').innerHTML = tableHTML;
                    
                } else {
                    log('⚠️ No merchants found in database', 'warning');
                    document.getElementById('merchantIds').innerHTML = '<p>No merchants found in the database.</p>';
                }
                
            } catch (error) {
                log(`❌ Failed to load merchants: ${error.message}`, 'error');
                document.getElementById('merchantIds').innerHTML = `<p class="error">Error: ${error.message}</p>';
            }
        }

        async function testWithRealId() {
            if (merchants.length === 0) {
                log('❌ No merchants loaded. Please load merchant IDs first.', 'error');
                return;
            }

            const firstMerchant = merchants[0];
            await testStatusUpdateWithId(firstMerchant.businessId);
        }

        async function testStatusUpdateWithId(merchantId) {
            log(`🧪 Testing status update with ID: ${merchantId}`, 'info');
            
            // Check if we have auth tokens
            const accessToken = sessionStorage.getItem('accessToken') || sessionStorage.getItem('idToken');
            
            if (!accessToken) {
                log('❌ No authentication tokens found. Please log in first.', 'error');
                log('👉 Go to index.html and log in, then come back to this page.', 'info');
                return;
            }

            log('✅ Authentication token found', 'success');

            try {
                const API_BASE_URL = window.WIZZCENTRAL_CONFIG.API_BASE_URL;
                
                const requestBody = {
                    action: 'reject',
                    reason: 'Testing status update from debug tool',
                    sendEmail: false // Don't send emails during testing
                };

                log('📤 Sending status update request...', 'info');
                log(`🔗 URL: ${API_BASE_URL}/merchants/${merchantId}/status`, 'info');

                const response = await fetch(`${API_BASE_URL}/merchants/${merchantId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const responseText = await response.text();
                
                log(`📥 Response: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    log('✅ Status update successful!', 'success');
                    try {
                        const data = JSON.parse(responseText);
                        log(`📊 Response data: ${JSON.stringify(data, null, 2)}`, 'info');
                    } catch (e) {
                        log(`📊 Response text: ${responseText}`, 'info');
                    }
                } else {
                    log(`❌ Status update failed: ${responseText}`, 'error');
                    
                    // This is where we'll see the actual backend error
                    if (response.status === 500) {
                        log('🚨 500 Server Error - This is the backend issue we need to fix!', 'error');
                    }
                }

            } catch (error) {
                log(`❌ Request failed: ${error.message}`, 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Merchant IDs debugger initialized', 'info');
        });
    </script>
</body>
</html>
