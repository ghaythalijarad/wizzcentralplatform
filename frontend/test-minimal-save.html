<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Campaign Save Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #005a87; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Minimal Campaign Save Test</h1>
    
    <button onclick="testStep1()">Step 1: Test Data Service</button>
    <button onclick="testStep2()">Step 2: Test Campaign Manager</button>
    <button onclick="testStep3()">Step 3: Test Full Save</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <!-- Include required scripts -->
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js?v=6"></script>
    <script src="data-service.js"></script>
    <script src="aligned-data-service.js"></script>
    <script src="simplified-campaign-manager.js"></script>

    <script>
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testStep1() {
            addResult('🔍 Step 1: Testing data service availability...', 'info');
            
            try {
                // Check if data service is available
                if (!window.dataService) {
                    throw new Error('Data service not available globally');
                }
                
                addResult('✅ Data service found globally', 'success');
                
                // Try to initialize
                if (typeof window.dataService.initialize === 'function') {
                    await window.dataService.initialize();
                    addResult('✅ Data service initialized', 'success');
                } else {
                    addResult('⚠️ Data service initialize method not found', 'info');
                }
                
                // Check createCampaign function
                if (typeof window.dataService.createCampaign === 'function') {
                    addResult('✅ createCampaign function available', 'success');
                } else {
                    throw new Error('createCampaign function not available');
                }
                
                addResult('🎉 Step 1 completed successfully', 'success');
                
            } catch (error) {
                addResult(`❌ Step 1 failed: ${error.message}`, 'error');
            }
        }

        async function testStep2() {
            addResult('🚀 Step 2: Testing campaign manager...', 'info');
            
            try {
                // Check if SimplifiedCampaignManager class exists
                if (typeof SimplifiedCampaignManager === 'undefined') {
                    throw new Error('SimplifiedCampaignManager class not available');
                }
                
                addResult('✅ SimplifiedCampaignManager class found', 'success');
                
                // Create instance
                const manager = new SimplifiedCampaignManager();
                window.testCampaignManager = manager;
                
                addResult('✅ Campaign manager instance created', 'success');
                
                // Test debug functions
                if (typeof manager.debugFormData === 'function') {
                    const formData = manager.debugFormData();
                    addResult(`✅ Debug form data works: ${Object.keys(formData || {}).length} fields`, 'success');
                } else {
                    addResult('⚠️ debugFormData method not found', 'info');
                }
                
                if (typeof manager.fillTestData === 'function') {
                    addResult('✅ fillTestData method available', 'success');
                } else {
                    addResult('⚠️ fillTestData method not found', 'info');
                }
                
                addResult('🎉 Step 2 completed successfully', 'success');
                
            } catch (error) {
                addResult(`❌ Step 2 failed: ${error.message}`, 'error');
            }
        }

        async function testStep3() {
            addResult('💾 Step 3: Testing full campaign save...', 'info');
            
            try {
                // Ensure we have everything from previous steps
                if (!window.testCampaignManager) {
                    await testStep2();
                }
                
                if (!window.dataService) {
                    await testStep1();
                }
                
                const manager = window.testCampaignManager;
                
                // Create test campaign data
                const testData = {
                    title: `Test Save Campaign ${Date.now()}`,
                    code: `SAVE${Date.now().toString().slice(-6)}`,
                    type: 'marketing',
                    description: 'Testing campaign save functionality',
                    discountType: 'percentage',
                    discountValue: 20,
                    minOrderValue: 25,
                    usageLimit: 50,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0]
                };
                
                addResult(`Creating campaign: ${testData.title}`, 'info');
                
                // Convert to FormData
                const formData = new FormData();
                Object.entries(testData).forEach(([key, value]) => {
                    formData.append(key, value);
                });
                
                addResult('📝 FormData created with test data', 'info');
                
                // Test the actual save
                const startTime = Date.now();
                const result = await manager.createCampaign(formData);
                const duration = Date.now() - startTime;
                
                if (result && result.success !== false) {
                    addResult(`✅ Campaign created successfully in ${duration}ms!`, 'success');
                    addResult(`Campaign ID: ${result.campaignId || result.discountId}`, 'success');
                    
                    // Display result details
                    const resultDiv = document.createElement('pre');
                    resultDiv.textContent = JSON.stringify(result, null, 2);
                    document.getElementById('results').appendChild(resultDiv);
                    
                    // Test if we can retrieve the campaign
                    if (window.dataService && typeof window.dataService.getCampaigns === 'function') {
                        try {
                            const campaigns = await window.dataService.getCampaigns();
                            addResult(`✅ Verified: Found ${campaigns.length} campaigns in database`, 'success');
                        } catch (verifyError) {
                            addResult(`⚠️ Could not verify campaign in database: ${verifyError.message}`, 'info');
                        }
                    }
                    
                    addResult('🎉 Step 3 completed successfully - Campaign was saved!', 'success');
                    
                } else {
                    throw new Error(result?.error || 'Campaign creation returned unsuccessful result');
                }
                
            } catch (error) {
                addResult(`❌ Step 3 failed: ${error.message}`, 'error');
                addResult(`Stack trace: ${error.stack}`, 'error');
            }
        }

        // Auto-start test when page loads
        window.addEventListener('DOMContentLoaded', function() {
            addResult('🧪 Minimal campaign save test loaded', 'info');
            addResult('Click the buttons above to run each test step', 'info');
        });
    </script>
</body>
</html>
