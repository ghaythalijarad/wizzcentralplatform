<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral - Color Theme Test</title>
    <link rel="stylesheet" href="styles/material-3-design-system.css">
    <link rel="stylesheet" href="styles/platform-theme.css">
    <script src="styles/wizz-theme-config.js"></script>
    <style>
        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 2rem;
            background: var(--color-surfaceAlt);
        }
        
        .color-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .color-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }
        
        .color-sample {
            width: 100%;
            height: 80px;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .primary-sample { background: var(--color-primary); }
        .primary-hover-sample { background: var(--color-primaryHover); }
        .primary-muted-sample { 
            background: var(--color-primaryMuted); 
            color: var(--color-text);
        }
        
        .secondary-sample { background: var(--color-secondary); }
        .secondary-hover-sample { background: var(--color-secondaryHover); }
        .secondary-muted-sample { 
            background: var(--color-secondaryMuted); 
            color: var(--color-text);
        }
        
        .btn-showcase {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        
        .material-3-sample {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        
        .material-3-secondary-sample {
            background: var(--md-sys-color-secondary);
            color: var(--md-sys-color-on-secondary);
        }
    </style>
</head>
<body>
    <h1 style="color: var(--color-text); margin-bottom: 2rem;">WizzCentral Platform - Color Theme Test</h1>
    
    <div class="color-showcase">
        <div class="color-card">
            <h3>Primary Colors</h3>
            <div class="color-sample primary-sample">Primary (#FDC500)</div>
            <div class="color-sample primary-hover-sample">Primary Hover (#E6B100)</div>
            <div class="color-sample primary-muted-sample">Primary Muted (#FFF8E6)</div>
        </div>
        
        <div class="color-card">
            <h3>Secondary Colors</h3>
            <div class="color-sample secondary-sample">Secondary (#00296B)</div>
            <div class="color-sample secondary-hover-sample">Secondary Hover (#001f52)</div>
            <div class="color-sample secondary-muted-sample">Secondary Muted (#f0f7ff)</div>
        </div>
        
        <div class="color-card">
            <h3>Material 3 Colors</h3>
            <div class="color-sample material-3-sample">Material 3 Primary</div>
            <div class="color-sample material-3-secondary-sample">Material 3 Secondary</div>
        </div>
    </div>
    
    <div class="btn-showcase">
        <button class="btn-primary">Primary Button</button>
        <button class="btn-secondary">Secondary Button</button>
    </div>
    
    <script>
        // Apply theme configuration
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof applyWizzTheme === 'function') {
                applyWizzTheme();
                console.log('✅ Wizz theme applied successfully');
            } else {
                console.warn('⚠️ applyWizzTheme function not found');
            }
        });
    </script>
</body>
</html>
