<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - WizzCentral</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #009de0;
            margin-bottom: 10px;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #009de0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: #0088c7;
        }
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .timestamp {
            color: #666;
            font-size: 11px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 WizzCentral API Diagnostics</h1>
        <p style="color: #666; margin-bottom: 30px;">
            This page tests the Lambda API connection and helps diagnose any issues.
        </p>

        <div style="margin-bottom: 20px;">
            <button onclick="testApi()">🧪 Test API</button>
            <button onclick="testWithAuth()">🔐 Test with Auth</button>
            <button onclick="runDiagnostics()">🔎 Deep Diagnostics</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>

        <div id="status" class="status info">
            Click "Test API" to check the connection...
        </div>

        <div style="margin-top: 30px;">
            <h3>📋 Test Logs</h3>
            <div id="logs" style="background: #f8f9fa; padding: 15px; border-radius: 6px; min-height: 200px; max-height: 400px; overflow-y: auto;">
                <div class="log-entry">
                    <span class="timestamp">Ready</span>
                    Diagnostic tool loaded. Click "Test API" to begin.
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <h3>📦 Response Data</h3>
            <pre id="responseData">No data yet...</pre>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // URL override via query param (?url=...)
        function getParam(name) {
            try { return new URLSearchParams(window.location.search).get(name); } catch { return null; }
        }
        const paramUrl = getParam('url');
        const cfgUrl = (window.WIZZCENTRAL_CONFIG && window.WIZZCENTRAL_CONFIG.API_BASE_URL);
        // Prefer query param > config > hardcoded
        const LAMBDA_URL = paramUrl || cfgUrl || 'https://c4obrzqwijwrj6ewm5elkw5byy0ltmkv.lambda-url.us-east-1.on.aws';

        // Global error hooks
        window.addEventListener('error', (e) => {
            try { log(`🌋 Window error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`,'error'); } catch {}
        });
        window.addEventListener('unhandledrejection', (e) => {
            try { log(`🤯 Unhandled rejection: ${e.reason && e.reason.message ? e.reason.message : e.reason}`,'error'); } catch {}
        });

        function log(message, level = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="timestamp">${timestamp}</span><span style="color: ${level === 'error' ? '#d9534f' : level === 'success' ? '#5cb85c' : '#333'}">${message}</span>`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function setStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '<div class="log-entry"><span class="timestamp">Cleared</span>Logs cleared.</div>';
            document.getElementById('responseData').textContent = 'No data yet...';
            setStatus('Logs cleared. Ready for new test.', 'info');
        }

        async function testApi() {
            try {
                log('🚀 Starting API test...', 'info');
                log(`📍 Lambda URL: ${LAMBDA_URL}`, 'info');
                log(`🌍 Current hostname: ${window.location.hostname}`, 'info');
                
                // Check if config is loaded
                if (window.WIZZCENTRAL_CONFIG) {
                    log(`✅ Config loaded: API_BASE_URL = ${window.WIZZCENTRAL_CONFIG.API_BASE_URL}`, 'success');
                } else {
                    log('⚠️ window.WIZZCENTRAL_CONFIG not found', 'error');
                }

                setStatus('🔄 Fetching regions from Lambda...', 'info');
                
                const startTime = Date.now();
                log(`⏱️ Sending request at ${new Date().toISOString()}`, 'info');
                
                const response = await fetch(LAMBDA_URL, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const elapsed = Date.now() - startTime;
                log(`⏱️ Response received in ${elapsed}ms`, 'info');
                log(`📊 Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                log(`📋 Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`, 'info');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Error response body: ${errorText.slice(0, 500)}`, 'error');
                    setStatus(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
                    document.getElementById('responseData').textContent = `Error ${response.status}:\n${errorText}`;
                    return;
                }

                const data = await response.json();
                log(`✅ Successfully parsed JSON response`, 'success');
                
                // Extract regions array
                const regions = data?.data || data?.regions || data?.items || (Array.isArray(data) ? data : []);
                const regionCount = Array.isArray(regions) ? regions.length : 0;
                
                log(`📦 Regions found: ${regionCount}`, 'success');
                
                if (regionCount > 0) {
                    log(`📝 First region: ${regions[0]?.name || regions[0]?.name_en || 'N/A'}`, 'info');
                    log(`🔑 First region keys: ${Object.keys(regions[0] || {}).join(', ')}`, 'info');
                }

                setStatus(`✅ Success! Found ${regionCount} regions`, 'success');
                document.getElementById('responseData').textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                log(`💥 Exception caught: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
                document.getElementById('responseData').textContent = `Exception:\n${error.message}\n\n${error.stack}`;
            }
        }

        async function testWithAuth() {
            try {
                const idToken = sessionStorage.getItem('idToken');
                if (!idToken) {
                    log('⚠️ No idToken found in sessionStorage', 'error');
                    setStatus('❌ No authentication token found. Please log in first.', 'error');
                    return;
                }

                log('🚀 Starting authenticated API test...', 'info');
                log(`📍 Lambda URL: ${LAMBDA_URL}`, 'info');
                log(`🔐 Using Authorization header`, 'info');

                setStatus('🔄 Fetching regions with authentication...', 'info');
                
                const startTime = Date.now();
                const response = await fetch(LAMBDA_URL, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${idToken.slice(0, 20)}...`
                    }
                });

                const elapsed = Date.now() - startTime;
                log(`⏱️ Response received in ${elapsed}ms`, 'info');
                log(`📊 Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Error response: ${errorText.slice(0, 500)}`, 'error');
                    setStatus(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
                    document.getElementById('responseData').textContent = errorText;
                    return;
                }

                const data = await response.json();
                const regions = data?.data || data?.regions || data?.items || (Array.isArray(data) ? data : []);
                const regionCount = Array.isArray(regions) ? regions.length : 0;
                
                log(`✅ Successfully authenticated request`, 'success');
                log(`📦 Regions found: ${regionCount}`, 'success');
                
                setStatus(`✅ Success! Found ${regionCount} regions (authenticated)`, 'success');
                document.getElementById('responseData').textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                log(`💥 Exception: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
                document.getElementById('responseData').textContent = error.stack;
            }
        }

        // New: deep diagnostics to understand browser/network behavior
        async function runDiagnostics() {
            setStatus('🔎 Running deep diagnostics...', 'info');
            try {
                const ua = navigator.userAgent;
                const language = navigator.language;
                const platform = navigator.platform;
                const online = navigator.onLine;
                const isSecure = window.isSecureContext;
                const lambdaOrigin = (() => { try { return new URL(LAMBDA_URL).origin; } catch { return 'n/a'; } })();
                log(`🌐 UA: ${ua}`);
                log(`🖥️ Platform: ${platform}, Lang: ${language}`);
                log(`🔒 Secure Context: ${isSecure}, Online: ${online}`);
                log(`📍 Page Origin: ${window.location.origin}`);
                log(`🎯 Lambda Origin: ${lambdaOrigin}`);
                if (navigator.connection) {
                    log(`📶 Network: ${navigator.connection.effectiveType || 'n/a'}, saveData=${navigator.connection.saveData || false}`);
                }
                try {
                    const sw = navigator.serviceWorker;
                    if (sw) {
                        const reg = await sw.getRegistration();
                        log(`🧰 ServiceWorker controller: ${!!sw.controller}, registration: ${!!reg}`);
                    }
                } catch {}
                try {
                    if (navigator.storage && navigator.storage.estimate) {
                        const est = await navigator.storage.estimate();
                        log(`💾 Storage usage: ${(est.usage||0)} of ${(est.quota||0)} bytes`);
                    }
                } catch {}
                const cspMeta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
                if (cspMeta) log(`🛡️ CSP meta present: ${cspMeta.content}`);
                log(`🔗 Open Lambda directly (new tab): <a href="${LAMBDA_URL}" target="_blank" rel="noopener">${LAMBDA_URL}</a>`);

                const attempts = [];
                const addAttempt = (name, fn) => attempts.push({ name, fn });

                const headersJSON = (h) => { try { return JSON.stringify(Object.fromEntries(h.entries())); } catch { return '{}'; } };

                addAttempt('GET (default settings)', async () => {
                    const res = await fetch(LAMBDA_URL, { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
                    return res;
                });
                addAttempt('GET (trailing slash)', async () => {
                    const url = LAMBDA_URL.endsWith('/') ? LAMBDA_URL : `${LAMBDA_URL}/`;
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
                    return res;
                });
                addAttempt('GET (cache-buster)', async () => {
                    const sep = LAMBDA_URL.includes('?') ? '&' : '?';
                    const res = await fetch(`${LAMBDA_URL}${sep}_ts=${Date.now()}`, { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
                    return res;
                });
                addAttempt('GET (explicit CORS + no-referrer)', async () => {
                    const res = await fetch(LAMBDA_URL, { mode: 'cors', referrerPolicy: 'no-referrer', headers: { 'Accept': 'application/json' }, cache: 'no-store' });
                    return res;
                });
                addAttempt('GET (force preflight: Content-Type: application/json)', async () => {
                    const res = await fetch(LAMBDA_URL, { method: 'GET', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, cache: 'no-store' });
                    return res;
                });
                addAttempt('HEAD (CORS)', async () => {
                    const res = await fetch(LAMBDA_URL, { method: 'HEAD', mode: 'cors', cache: 'no-store' });
                    return res;
                });
                addAttempt('GET (no-cors; expect opaque)', async () => {
                    const res = await fetch(LAMBDA_URL, { mode: 'no-cors', cache: 'no-store' });
                    return res; // opaque response, status 0
                });
                addAttempt('XMLHttpRequest (fallback)', async () => {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', LAMBDA_URL, true);
                        xhr.timeout = 10000;
                        xhr.responseType = 'text';
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4) {
                                resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, statusText: xhr.statusText, headers: new Headers(), text: () => Promise.resolve(xhr.responseText) });
                            }
                        };
                        xhr.onerror = function() { reject(new TypeError('XHR network error')); };
                        xhr.ontimeout = function() { reject(new TypeError('XHR timeout')); };
                        try { xhr.send(); } catch (e) { reject(e); }
                    });
                });

                for (const attempt of attempts) {
                    const label = attempt.name;
                    const started = Date.now();
                    try {
                        log(`➡️ Attempt: ${label}`);
                        const res = await attempt.fn();
                        const ms = Date.now() - started;
                        const status = typeof res.status === 'number' ? res.status : 0;
                        const ok = !!res.ok;
                        log(`⬅️ Result: ${label}: status=${status}, ok=${ok}, time=${ms}ms` , ok ? 'success' : (status ? 'info' : 'error'));
                        if (res.headers && res.headers.entries) {
                            log(`   ↳ Headers: ${headersJSON(res.headers)}`);
                            const acao = res.headers.get && res.headers.get('access-control-allow-origin');
                            if (acao) log(`   ↳ ACAO: ${acao}`);
                        } else {
                            log('   ↳ No headers available (possibly opaque or XHR shim)');
                        }
                        if (ok && res.json) {
                            try {
                                const json = await res.clone().json();
                                const regions = json?.data || json?.regions || json?.items || (Array.isArray(json) ? json : []);
                                log(`   ↳ Parsed JSON ok. Items: ${Array.isArray(regions) ? regions.length : 'n/a'}`);
                            } catch {
                                // ignore parse errors for HEAD/no-cors
                            }
                        } else if (status && res.text) {
                            const text = await res.text();
                            log(`   ↳ Body (first 200 chars): ${String(text).slice(0,200)}`);
                        }
                    } catch (e) {
                        log(`❌ ${label} failed: ${e && e.message ? e.message : e}`, 'error');
                    }
                }

                setStatus('✅ Diagnostics completed. Review logs above.', 'success');
            } catch (err) {
                log(`💥 Diagnostics error: ${err.message}`, 'error');
                setStatus(`❌ Diagnostics error: ${err.message}`, 'error');
            }
        }

        // Auto-run tip logs
        log('🎯 Page loaded, ready for testing', 'info');
        log('💡 Tip: Open browser DevTools (F12) to see network requests', 'info');
    </script>
</body>
</html>
