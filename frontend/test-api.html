<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Regions</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Regions API Test Page</h1>
    <p>Testing: <code>http://localhost:3000/api/regions</code></p>
    
    <button onclick="testAPI()">🔄 Test API</button>
    <button onclick="clearResults()">🗑️ Clear</button>
    
    <div id="results"></div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">⏳ Loading...</div>';
            
            try {
                console.log('🔄 Fetching from /api/regions...');
                const response = await fetch('/api/regions');
                
                console.log(`📡 Response status: ${response.status}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('✅ Data received:', data);
                
                const html = `
                    <div class="result success">
                        <h2>✅ API Success!</h2>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Total Regions:</strong> ${data.data?.length || 0}</p>
                        <p><strong>Source:</strong> ${data.source}</p>
                        <p><strong>Summary:</strong></p>
                        <pre>${JSON.stringify(data.summary, null, 2)}</pre>
                        
                        <h3>First 5 Regions:</h3>
                        <pre>${JSON.stringify(data.data?.slice(0, 5), null, 2)}</pre>
                    </div>
                `;
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h2>❌ API Error</h2>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-test on page load
        window.addEventListener('load', () => {
            console.log('🚀 Page loaded, testing API...');
            testAPI();
        });
    </script>
</body>
</html>
