<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Orders Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>WizzCentral Orders Page Test</h1>
    <div id="status" class="status info">Initializing...</div>
    <div id="results"></div>

    <!-- Include all required scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js"></script>
    <script src="js/orders-api.js"></script>

    <script>
        async function testOrdersAPI() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            try {
                statusDiv.innerHTML = 'Testing WizzOrdersAPI initialization...';
                statusDiv.className = 'status info';

                // Check if WizzOrdersAPI is available
                if (!window.WizzOrdersAPI) {
                    throw new Error('WizzOrdersAPI not found');
                }

                // Initialize and test the API
                const api = new WizzOrdersAPI();
                await api.initialize();

                statusDiv.innerHTML = 'API initialized successfully. Fetching orders...';
                
                const result = await api.getOrders(5); // Get 5 orders for testing
                
                if (result.success) {
                    statusDiv.innerHTML = `✅ Success: Found ${result.orders.length} orders`;
                    statusDiv.className = 'status success';
                    
                    resultsDiv.innerHTML = `
                        <h3>Orders Data:</h3>
                        <pre>${JSON.stringify(result.orders, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(result.message || 'Unknown error');
                }

            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'status error';
                console.error('Test failed:', error);
            }
        }

        // Run test when page loads
        document.addEventListener('DOMContentLoaded', testOrdersAPI);
    </script>
</body>
</html>
