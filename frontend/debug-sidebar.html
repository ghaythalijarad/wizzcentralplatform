<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Sidebar</title>
    <link rel="stylesheet" href="styles/material-3-design-system.css">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }
        .debug-info {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h2>Sidebar Debug Test</h2>
        <p>Page loaded. Testing sidebar loading...</p>
        <div id="log"></div>
    </div>

    <!-- Sidebar placeholder -->
    <div id="sidebar-placeholder" style="border: 2px dashed red; min-height: 200px; background: #ffeaea;">
        <p style="padding: 20px;">Sidebar placeholder - should be replaced</p>
    </div>

    <script src="assets/js/navigation.js"></script>
    <script>
        const log = document.getElementById('log');
        
        function addLog(message) {
            log.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
            console.log(message);
        }

        addLog('Page loaded');
        addLog('NavigationManager available: ' + (typeof NavigationManager !== 'undefined'));
        
        if (typeof NavigationManager !== 'undefined') {
            const nav = new NavigationManager();
            addLog('NavigationManager instance created');
            
            nav.init().then(() => {
                addLog('NavigationManager initialized successfully');
            }).catch(error => {
                addLog('NavigationManager initialization failed: ' + error.message);
            });
        }
    </script>
</body>
</html>
