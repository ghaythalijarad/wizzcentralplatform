<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Platform Discount Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .debug-output { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Quick Platform Discount Test</h1>
    <p>Current URL: <code id="currentUrl"></code></p>
    
    <div class="test-section">
        <h3>Step 1: Basic Connectivity</h3>
        <button class="btn-primary" onclick="testBasicConnectivity()">Test Basic Connectivity</button>
        <div id="connectivityResult"></div>
    </div>

    <div class="test-section">
        <h3>Step 2: Authentication Status</h3>
        <button class="btn-primary" onclick="checkAuthStatus()">Check Auth Status</button>
        <div id="authResult"></div>
    </div>

    <div class="test-section">
        <h3>Step 3: AWS Connection</h3>
        <button class="btn-primary" onclick="testAWSConnection()">Test AWS Connection</button>
        <div id="awsResult"></div>
    </div>

    <div class="test-section">
        <h3>Step 4: Create Platform Discount</h3>
        <button class="btn-success" onclick="createTestDiscount()">Create Test Platform Discount</button>
        <div id="createResult"></div>
    </div>

    <div class="test-section">
        <h3>Debug Output</h3>
        <button class="btn-primary" onclick="clearDebug()">Clear Debug</button>
        <div id="debugOutput" class="debug-output">Starting tests...\n</div>
    </div>

    <!-- Load scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js?v=5"></script>
    <script src="data-service.js?v=5"></script>

    <script>
        // Initialize page
        document.getElementById('currentUrl').textContent = window.location.href;
        
        function addDebug(message) {
            const debugDiv = document.getElementById('debugOutput');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.textContent += `[${timestamp}] ${message}\n`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        function clearDebug() {
            document.getElementById('debugOutput').textContent = 'Debug cleared.\n';
        }

        function setResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${isSuccess ? 'success' : 'error'}">${message}</div>`;
        }

        async function testBasicConnectivity() {
            try {
                addDebug('Testing basic connectivity...');
                const response = await fetch('/config.js');
                if (response.ok) {
                    setResult('connectivityResult', '✅ Basic connectivity working');
                    addDebug('✅ Basic connectivity test passed');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                setResult('connectivityResult', `❌ Connectivity failed: ${error.message}`, false);
                addDebug(`❌ Connectivity test failed: ${error.message}`);
            }
        }

        async function checkAuthStatus() {
            try {
                addDebug('Checking authentication status...');
                const isAuth = sessionStorage.getItem('isAuthenticated') === 'true';
                const hasToken = !!sessionStorage.getItem('idToken');
                const userEmail = sessionStorage.getItem('userEmail');
                
                if (isAuth && hasToken) {
                    setResult('authResult', `✅ Authenticated as: ${userEmail || 'Unknown'}`);
                    addDebug(`✅ Authentication status: OK (${userEmail})`);
                } else {
                    setResult('authResult', '⚠️ Not authenticated. Please login first at: <a href="/" target="_blank">Login Page</a>', false);
                    addDebug('⚠️ Not authenticated - need to login first');
                }
            } catch (error) {
                setResult('authResult', `❌ Auth check failed: ${error.message}`, false);
                addDebug(`❌ Auth check failed: ${error.message}`);
            }
        }

        async function testAWSConnection() {
            try {
                addDebug('Testing AWS connection...');
                
                // Wait for data service
                let retries = 10;
                while (retries > 0 && !window.dataService) {
                    addDebug('Waiting for dataService...');
                    await new Promise(resolve => setTimeout(resolve, 500));
                    retries--;
                }

                if (!window.dataService) {
                    throw new Error('DataService not available');
                }

                const startTime = Date.now();
                const client = await window.dataService.getDynamoDBClient();
                const duration = Date.now() - startTime;
                
                if (client) {
                    // Test a simple scan
                    const scanResult = await window.dataService.scan('WizzCentral_Platform_Discounts', { Limit: 1 });
                    setResult('awsResult', `✅ AWS connection working (${duration}ms)`);
                    addDebug(`✅ AWS connection test passed in ${duration}ms`);
                    addDebug(`Found ${scanResult.Items?.length || 0} items in platform discounts table`);
                } else {
                    throw new Error('Could not get DynamoDB client');
                }
            } catch (error) {
                setResult('awsResult', `❌ AWS connection failed: ${error.message}`, false);
                addDebug(`❌ AWS connection failed: ${error.message}`);
            }
        }

        async function createTestDiscount() {
            try {
                addDebug('Creating test platform discount...');
                
                if (!window.dataService) {
                    throw new Error('DataService not available');
                }

                const testDiscount = {
                    discountId: `quick_test_${Date.now()}`,
                    title: 'Quick Test Discount',
                    description: 'Test discount created from quick test page',
                    type: 'percentage',
                    value: 15,
                    code: `TEST${Date.now().toString().slice(-4)}`,
                    minOrderValue: 20,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: '2025-12-31',
                    isActive: true,
                    usage: 0,
                    limit: 100,
                    discountSource: 'platform'
                };

                addDebug(`Creating discount: ${testDiscount.title} (${testDiscount.code})`);
                
                const startTime = Date.now();
                const result = await window.dataService.createPlatformDiscount(testDiscount);
                const duration = Date.now() - startTime;
                
                if (result.success) {
                    setResult('createResult', `✅ Platform discount created successfully in ${duration}ms!<br>ID: ${result.discountId}<br><a href="/pages/promotions.html" target="_blank">View in Promotions Page</a>`);
                    addDebug(`✅ Platform discount created successfully in ${duration}ms`);
                    addDebug(`Discount ID: ${result.discountId}`);
                } else {
                    throw new Error('Creation returned false');
                }
            } catch (error) {
                setResult('createResult', `❌ Failed to create platform discount: ${error.message}`, false);
                addDebug(`❌ Platform discount creation failed: ${error.message}`);
            }
        }

        // Auto-run basic tests on page load
        window.addEventListener('load', () => {
            addDebug('Page loaded, starting basic tests...');
            setTimeout(testBasicConnectivity, 500);
            setTimeout(checkAuthStatus, 1000);
        });
    </script>
</body>
</html>
