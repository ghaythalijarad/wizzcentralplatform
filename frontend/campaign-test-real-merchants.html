<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Creation Test with Real Merchants</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .test-section { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .log { background: #000; color: #00ff00; padding: 10px; font-family: monospace; border-radius: 4px; max-height: 200px; overflow-y: auto; margin: 10px 0; }
        button { background: #007cba; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #005c8a; }
        select, input, textarea { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        .form-group { margin: 15px 0; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .campaign-preview { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🎯 Campaign Creation Test with Real Merchants</h1>
    
    <div class="test-section">
        <h3>Real Merchant Integration Validation</h3>
        <p>This test validates the complete campaign creation workflow using real merchant data from WhizzMerchants_Businesses table.</p>
        
        <button onclick="loadRealMerchants()">1. Load Real Merchants</button>
        <button onclick="createTestCampaign()">2. Create Test Campaign</button>
        <button onclick="validateCampaignData()">3. Validate Campaign</button>
        <button onclick="clearLog()">Clear Log</button>
        
        <div id="log" class="log"></div>
    </div>

    <div class="test-section">
        <h3>Campaign Creation Form (Real Data)</h3>
        
        <div class="form-group">
            <label><strong>Campaign Title:</strong></label>
            <input type="text" id="campaignTitle" value="Test Campaign for Real Merchants" />
        </div>
        
        <div class="form-group">
            <label><strong>Campaign Type:</strong></label>
            <select id="campaignType">
                <option value="first_order">First Order Discount</option>
                <option value="new_customer">New Customer Special</option>
                <option value="loyalty">Loyalty Reward</option>
                <option value="seasonal">Seasonal Promotion</option>
            </select>
        </div>
        
        <div class="form-group">
            <label><strong>Discount Value:</strong></label>
            <input type="number" id="discountValue" value="20" min="1" max="100" />
        </div>
        
        <div class="form-group">
            <label><strong>Target Restaurants (Real Data):</strong></label>
            <select id="targetRestaurants" multiple>
                <option>Loading real merchants...</option>
            </select>
        </div>
        
        <div class="form-group">
            <label><strong>Campaign Description:</strong></label>
            <textarea id="campaignDescription" rows="3">This is a test campaign targeting real merchants from the WizzCentral platform.</textarea>
        </div>
        
        <div class="campaign-preview" id="campaignPreview" style="display: none;">
            <h4>📋 Campaign Preview</h4>
            <div id="previewContent"></div>
        </div>
    </div>

    <!-- Required scripts -->
    <script src="config/config.js"></script>
    <script src="assets/js/aws-utils.js"></script>
    <script src="data-service.js"></script>
    
    <script>
        let realMerchants = [];
        let selectedRestaurants = [];

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span><br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Load real merchants and populate dropdown
        async function loadRealMerchants() {
            log('🧪 Loading real merchants from DynamoDB...');
            
            try {
                // Method 1: Try data service
                if (window.dataService) {
                    log('📡 Using data service...');
                    await window.dataService.initialize();
                    realMerchants = await window.dataService.getBusinesses();
                    log(`✅ Data service returned ${realMerchants.length} businesses`, 'success');
                } else {
                    // Method 2: Direct API call
                    log('📡 Using direct API call...');
                    const response = await fetch('/businesses');
                    const data = await response.json();
                    if (data.success) {
                        realMerchants = data.businesses;
                        log(`✅ API returned ${realMerchants.length} businesses`, 'success');
                    } else {
                        throw new Error(data.error || 'API request failed');
                    }
                }

                // Filter for restaurants
                const restaurants = realMerchants.filter(b => {
                    const businessType = (b.businessType || '').toLowerCase();
                    return businessType.includes('restaurant') || businessType === 'restaurant';
                });

                log(`🍽️ Found ${restaurants.length} restaurants`, 'success');

                // Populate dropdown
                const select = document.getElementById('targetRestaurants');
                if (restaurants.length > 0) {
                    select.innerHTML = restaurants.map(restaurant => {
                        const id = restaurant.businessId || restaurant.id;
                        const name = restaurant.businessName || restaurant.name;
                        const city = restaurant.city || 'Unknown City';
                        const displayName = `${name} (${city})`;
                        
                        log(`📍 Adding: ${displayName} - ID: ${id}`);
                        return `<option value="${id}">${displayName}</option>`;
                    }).join('');
                    
                    log('✅ Restaurant dropdown populated with real data!', 'success');
                } else {
                    log('⚠️ No restaurants found', 'error');
                    select.innerHTML = '<option>No restaurants found</option>';
                }

            } catch (error) {
                log(`❌ Error loading merchants: ${error.message}`, 'error');
                console.error('Error details:', error);
            }
        }

        // Create test campaign with real merchant targeting
        async function createTestCampaign() {
            log('🎯 Creating test campaign with real merchant targeting...');
            
            try {
                const campaignData = {
                    title: document.getElementById('campaignTitle').value,
                    type: document.getElementById('campaignType').value,
                    discountType: 'percentage',
                    discountValue: parseInt(document.getElementById('discountValue').value),
                    description: document.getElementById('campaignDescription').value,
                    targetRestaurants: Array.from(document.getElementById('targetRestaurants').selectedOptions).map(opt => opt.value),
                    status: 'draft',
                    source: 'real-merchant-integration-test'
                };

                log(`📋 Campaign Data: ${JSON.stringify(campaignData, null, 2)}`);

                if (campaignData.targetRestaurants.length === 0) {
                    log('⚠️ No restaurants selected for targeting', 'error');
                    return;
                }

                // Get restaurant details for validation
                const selectedRestaurantDetails = realMerchants.filter(m => 
                    campaignData.targetRestaurants.includes(m.businessId)
                );

                log(`✅ Selected ${selectedRestaurantDetails.length} real restaurants:`, 'success');
                selectedRestaurantDetails.forEach(restaurant => {
                    log(`   • ${restaurant.businessName} (${restaurant.city})`);
                });

                // Attempt to create campaign via API
                log('📡 Sending campaign creation request...');
                const response = await fetch('/campaigns', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(campaignData)
                });

                const result = await response.json();
                
                if (result.success) {
                    log(`✅ Campaign created successfully! ID: ${result.campaign.campaignId}`, 'success');
                    
                    // Show campaign preview
                    showCampaignPreview(result.campaign, selectedRestaurantDetails);
                } else {
                    log(`❌ Campaign creation failed: ${result.error}`, 'error');
                }

            } catch (error) {
                log(`❌ Error creating campaign: ${error.message}`, 'error');
                console.error('Campaign creation error:', error);
            }
        }

        // Validate campaign data
        async function validateCampaignData() {
            log('🔍 Validating campaign data integration...');
            
            try {
                // Test 1: Verify real merchants are accessible
                log('Test 1: Verifying real merchant data access...');
                const businessesResponse = await fetch('/businesses');
                const businessesData = await businessesResponse.json();
                
                if (businessesData.success && businessesData.count === 3) {
                    log('✅ Real merchant data accessible (3 merchants)', 'success');
                } else {
                    log(`❌ Merchant data issue: ${businessesData.count} merchants found`, 'error');
                }

                // Test 2: Verify campaign creation endpoint
                log('Test 2: Verifying campaign creation endpoint...');
                const campaignsResponse = await fetch('/campaigns');
                const campaignsData = await campaignsResponse.json();
                
                if (campaignsData.success) {
                    log(`✅ Campaign endpoint working (${campaignsData.count} campaigns)`, 'success');
                } else {
                    log('❌ Campaign endpoint issue', 'error');
                }

                // Test 3: Verify expected merchants present
                log('Test 3: Verifying expected merchants are present...');
                const expectedMerchants = ['سنونو', 'كارتوشكا', 'أسواق الكرادة'];
                const foundMerchants = businessesData.businesses.map(b => b.businessName);
                const missingMerchants = expectedMerchants.filter(name => !foundMerchants.includes(name));
                
                if (missingMerchants.length === 0) {
                    log('✅ All expected merchants present!', 'success');
                } else {
                    log(`❌ Missing merchants: ${missingMerchants.join(', ')}`, 'error');
                }

                log('🎉 Validation completed!', 'success');

            } catch (error) {
                log(`❌ Validation error: ${error.message}`, 'error');
            }
        }

        // Show campaign preview
        function showCampaignPreview(campaign, restaurants) {
            const preview = document.getElementById('campaignPreview');
            const content = document.getElementById('previewContent');
            
            content.innerHTML = `
                <strong>Campaign ID:</strong> ${campaign.campaignId}<br>
                <strong>Title:</strong> ${campaign.title}<br>
                <strong>Type:</strong> ${campaign.type}<br>
                <strong>Discount:</strong> ${campaign.discountValue}%<br>
                <strong>Status:</strong> ${campaign.status}<br>
                <strong>Target Restaurants:</strong><br>
                ${restaurants.map(r => `&nbsp;&nbsp;• ${r.businessName} (${r.city})`).join('<br>')}
                <br><br>
                <strong>✅ Integration Status:</strong> Campaign successfully created with real merchant targeting!
            `;
            
            preview.style.display = 'block';
        }

        // Auto-load merchants when page loads
        document.addEventListener('DOMContentLoaded', function() {
            log('📄 Campaign test page loaded');
            
            setTimeout(() => {
                loadRealMerchants();
            }, 1000);
        });
    </script>
</body>
</html>
