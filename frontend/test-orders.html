<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Orders API</title>
</head>
<body>
    <h1>Test Orders API</h1>
    <button id="testBtn">Test Orders API</button>
    <div id="results"></div>

    <!-- AWS SDK and required scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js"></script>
    <script src="js/orders-api.js"></script>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing Orders API...</p>';
            
            try {
                console.log('Testing WizzOrdersAPI...');
                
                // Initialize AWS
                await AWSUtils.initialize();
                console.log('✅ AWSUtils initialized');
                
                // Test WizzOrdersAPI
                const api = new WizzOrdersAPI();
                await api.initialize();
                console.log('✅ WizzOrdersAPI initialized');
                
                // Get orders
                const result = await api.getOrders();
                console.log('✅ Orders result:', result);
                
                resultsDiv.innerHTML = `
                    <h2>Results:</h2>
                    <p><strong>Success:</strong> ${result.success}</p>
                    <p><strong>Count:</strong> ${result.count}</p>
                    <p><strong>Source:</strong> ${result.source}</p>
                    <pre>${JSON.stringify(result.orders, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('❌ Test failed:', error);
                resultsDiv.innerHTML = `
                    <h2>Error:</h2>
                    <p style="color: red;">${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        });
    </script>
</body>
</html>
