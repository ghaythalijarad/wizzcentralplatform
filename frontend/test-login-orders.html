<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Login for Orders</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form { max-width: 400px; margin: 0 auto; }
        .field { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="form">
        <h1>Test Login</h1>
        <div id="status"></div>
        
        <div class="field">
            <label>Email:</label>
            <input type="email" id="email" value="test@wizz.com">
        </div>
        
        <div class="field">
            <label>Password:</label>
            <input type="password" id="password" value="Test123!">
        </div>
        
        <button onclick="testLogin()">Test Login</button>
        <button onclick="mockAuth()">Mock Authentication</button>
        <button onclick="testOrders()">Test Orders (Skip Auth)</button>
    </div>

    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js"></script>
    <script src="js/orders-api.js"></script>

    <script>
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.className = `status ${isError ? 'error' : 'success'}`;
        }

        async function testLogin() {
            try {
                updateStatus('Testing login...');
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (typeof Auth !== 'undefined' && Auth.signIn) {
                    const result = await Auth.signIn(email, password);
                    updateStatus(`Login successful: ${JSON.stringify(result)}`);
                } else {
                    throw new Error('Auth.signIn not available');
                }
            } catch (error) {
                updateStatus(`Login failed: ${error.message}`, true);
            }
        }

        function mockAuth() {
            // Set mock authentication for testing
            sessionStorage.setItem('isAuthenticated', 'true');
            sessionStorage.setItem('userEmail', 'test@wizz.com');
            sessionStorage.setItem('userId', 'test-user-123');
            sessionStorage.setItem('idToken', 'mock-id-token');
            sessionStorage.setItem('accessToken', 'mock-access-token');
            
            updateStatus('Mock authentication set! Now try testing orders.');
        }

        async function testOrders() {
            try {
                updateStatus('Testing orders API...');
                
                if (typeof WizzOrdersAPI === 'undefined') {
                    throw new Error('WizzOrdersAPI not loaded');
                }

                const api = new WizzOrdersAPI();
                await api.initialize();
                
                const result = await api.getOrders(5);
                
                if (result.success) {
                    updateStatus(`Orders loaded: ${result.orders.length} orders found`);
                } else {
                    throw new Error(result.message || 'Unknown error');
                }
            } catch (error) {
                updateStatus(`Orders test failed: ${error.message}`, true);
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
