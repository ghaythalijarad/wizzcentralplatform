<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral - Simple Login</title>
    <link rel="stylesheet" href="styles/dashboard.css">
    <style>
        .simple-login {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 1rem;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-debug {
            background: #28a745;
        }
        .btn-debug:hover {
            background: #1e7e34;
        }
        .status {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="simple-login">
        <h2>WizzCentral Login</h2>
        
        <div id="status" class="status"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="g87_a@yahoo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="Gha@551987" required>
            </div>
            
            <button type="submit" class="btn">Login with Cognito</button>
        </form>
        
        <button onclick="debugLogin()" class="btn btn-debug">Quick Debug Login (Skip Cognito)</button>
        
        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee;">
            <button onclick="clearAll()" class="btn" style="background: #dc3545;">Clear All Sessions</button>
        </div>
    </div>

    <!-- Load dependencies -->
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js"></script>
    
    <script>
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
        
        async function debugLogin() {
            console.log('🚀 Debug login - setting mock credentials');
            
            // Create mock tokens (these won't work for real AWS calls but will bypass UI auth checks)
            const mockIdToken = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJkZWJ1Zy11c2VyIiwiaXNzIjoiaHR0cHM6Ly9jb2duaXRvLWlkcC51cy1lYXN0LTEuYW1hem9uYXdzLmNvbS91cy1lYXN0LTFfTERnZm8xUG1jIiwiZW1haWwiOiJnODdfYUB5YWhvby5jb20iLCJleHAiOjk5OTk5OTk5OTl9.mock';
            
            sessionStorage.setItem('idToken', mockIdToken);
            sessionStorage.setItem('accessToken', 'mock-access-token');
            sessionStorage.setItem('isAuthenticated', 'true');
            sessionStorage.setItem('userEmail', 'g87_a@yahoo.com');
            sessionStorage.setItem('userId', 'debug-user-123');
            
            showStatus('Debug login successful! Redirecting...', 'success');
            
            setTimeout(() => {
                window.location.href = 'pages/promotions.html';
            }, 1000);
        }
        
        async function realLogin(email, password) {
            showStatus('Authenticating with AWS Cognito...', 'success');
            
            try {
                // Wait for AuthService
                let retries = 0;
                while (!window.AuthService && retries < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    retries++;
                }
                
                if (!window.AuthService) {
                    throw new Error('AuthService not loaded');
                }
                
                await AuthService.initialize();
                const result = await AuthService.login(email, password);
                
                if (result.success) {
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('isAuthenticated', 'true');
                    
                    showStatus('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'pages/promotions.html';
                    }, 1000);
                } else {
                    showStatus('Login failed: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showStatus('Login error: ' + error.message, 'error');
            }
        }
        
        function clearAll() {
            sessionStorage.clear();
            localStorage.clear();
            showStatus('All sessions cleared', 'success');
            setTimeout(() => location.reload(), 1000);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await realLogin(email, password);
        });
        
        // Check current status
        document.addEventListener('DOMContentLoaded', () => {
            const hasAuth = sessionStorage.getItem('isAuthenticated') === 'true';
            const hasToken = !!sessionStorage.getItem('idToken');
            
            if (hasAuth && hasToken) {
                showStatus('Already logged in. Go to promotions page or clear sessions.', 'success');
            }
        });
    </script>
</body>
</html>
