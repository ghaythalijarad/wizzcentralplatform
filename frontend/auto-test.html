<!DOCTYPE html>
<html>
<head>
    <title>Auto Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        .result { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>🧪 PROMOTION CREATION AUTO TEST</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            console.log(msg);
            output.innerHTML += '<div class="result">' + msg + '</div>';
        }
        
        // Open promotions page in new window and test
        log('Opening promotions page...');
        const testWindow = window.open('http://localhost:8083/frontend/pages/promotions.html', '_blank');
        
        setTimeout(() => {
            if (testWindow) {
                log('Injecting test script...');
                
                // Inject the test into the opened window
                testWindow.eval(`
                    console.log('🧪 TESTING PROMOTION CREATION...');
                    
                    // Set debug mode first
                    sessionStorage.setItem('debugMode', 'true');
                    
                    setTimeout(() => {
                        const createBtn = document.getElementById('openAddPromotionModalBtn');
                        console.log('Create button:', createBtn ? '✅ Found' : '❌ Missing');
                        
                        if (createBtn) {
                            createBtn.click();
                            const modal = document.getElementById('addPromotionModal');
                            console.log('Modal opens:', modal && modal.style.display === 'flex' ? '✅ Yes' : '❌ No');
                            
                            if (modal && modal.style.display === 'flex') {
                                const testData = {
                                    title: 'AUTO TEST ' + Date.now(),
                                    code: 'AUTO' + Math.floor(Math.random() * 1000),
                                    type: 'percentage',
                                    value: '15',
                                    description: 'Automated test promotion',
                                    startDate: new Date().toISOString().slice(0, 16),
                                    endDate: new Date(Date.now() + 7*24*60*60*1000).toISOString().slice(0, 16)
                                };
                                
                                // Fill form
                                for (const [field, value] of Object.entries(testData)) {
                                    const element = document.getElementById(field);
                                    if (element) element.value = value;
                                }
                                console.log('✅ Form filled with test data');
                                
                                // Submit
                                const form = document.getElementById('addPromotionForm');
                                if (form) {
                                    console.log('📝 Submitting form...');
                                    const submitEvent = new Event('submit', { bubbles: true, cancelable: true });
                                    form.dispatchEvent(submitEvent);
                                    
                                    setTimeout(() => {
                                        const isModalClosed = modal.style.display === 'none';
                                        console.log('Result:', isModalClosed ? '🎉 SUCCESS!' : '❌ FAILED');
                                    }, 2000);
                                }
                            }
                        }
                    }, 2000);
                `);
                
                log('✅ Test script injected. Check the other window console for results.');
            }
        }, 3000);
    </script>
</body>
</html>
