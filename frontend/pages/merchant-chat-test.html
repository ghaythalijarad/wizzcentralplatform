<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Chat Test - Support Agent View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
        }
        
        .status-dot.connected {
            background: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.2);
        }
        
        .main {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 600px;
        }
        
        .sessions {
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }
        
        .sessions-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            color: #495057;
        }
        
        .session {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .session:hover {
            background: #f8f9fa;
        }
        
        .session.active {
            background: #e7f3ff;
            border-left: 3px solid #667eea;
        }
        
        .session-name {
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .session-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .session-email {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
        }
        
        .session-time {
            font-size: 11px;
            color: #adb5bd;
        }
        
        .chat {
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .chat-title {
            font-weight: 600;
            font-size: 18px;
            color: #212529;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }
        
        .message.sent {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .message-content {
            max-width: 60%;
        }
        
        .message-text {
            background: #f1f3f5;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.sent .message-text {
            background: #667eea;
            color: white;
        }
        
        .message-sender {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .message-time {
            font-size: 11px;
            color: #adb5bd;
            margin-top: 4px;
        }
        
        .chat-input {
            padding: 20px 30px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ced4da;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #667eea;
        }
        
        .input-group button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .input-group button:hover {
            background: #5568d3;
        }
        
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .log {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            margin-bottom: 4px;
            color: #495057;
        }
        
        .log-entry.success {
            color: #28a745;
        }
        
        .log-entry.error {
            color: #dc3545;
        }
        
        .log-entry.info {
            color: #17a2b8;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎧 Support Agent Dashboard</h1>
            <p>Merchant Live Chat - Stage: ghayth</p>
        </div>
        
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <div id="statusText">Connecting...</div>
        </div>
        
        <div class="main">
            <div class="sessions">
                <div class="sessions-header">
                    Active Sessions (<span id="sessionCount">0</span>)
                </div>
                <div id="sessionsList">
                    <div class="empty-state" style="padding: 40px 20px;">
                        <i class="fas fa-comments"></i>
                        <p style="margin-top: 10px;">Waiting for sessions...</p>
                    </div>
                </div>
            </div>
            
            <div class="chat">
                <div class="chat-header">
                    <div class="chat-title" id="chatTitle">Select a conversation</div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state">
                        <i class="fas fa-comment-dots"></i>
                        <h3 style="margin: 10px 0;">No conversation selected</h3>
                        <p>Select a session from the left to start chatting</p>
                    </div>
                </div>
                
                <div class="chat-input" id="chatInput" style="display: none;">
                    <div class="input-group">
                        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
                        <button type="button" id="sendButton">
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="log" id="log"></div>
    </div>
    
    <script>
        // Configuration
        const WS_URL = 'wss://bx4snzqxpd.execute-api.us-east-1.amazonaws.com/ghayth';
        const AGENT_ID = 'agent_' + Date.now();
        const AGENT_NAME = 'Support Agent';
        
        // State
        let ws = null;
        let sessions = new Map();
        let activeSessionId = null;
        
        // Initialize
        function init() {
            log('Initializing agent dashboard...', 'info');
            connectWebSocket();
        }
        
        // WebSocket connection
        function connectWebSocket() {
            log('Connecting to WebSocket...', 'info');
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                log('✅ WebSocket connected', 'success');
                updateStatus(true);
                sendAgentConnect();
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`📥 Received: ${data.type}`, 'info');
                handleMessage(data);
            };
            
            ws.onerror = (error) => {
                log('❌ WebSocket error', 'error');
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                log('🔌 WebSocket disconnected', 'error');
                updateStatus(false);
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        // Send agent connect message
        function sendAgentConnect() {
            const msg = {
                action: 'chat_agent_connect',
                type: 'chat_agent_connect',
                agentId: AGENT_ID,
                agentName: AGENT_NAME
            };
            ws.send(JSON.stringify(msg));
            log('📤 Sent agent_connect', 'info');
        }
        
        // Handle incoming messages
        function handleMessage(data) {
            switch(data.type) {
                case 'agent_connected':
                    log('✅ Agent connected successfully', 'success');
                    break;
                    
                case 'active_sessions':
                    log(`📊 Received ${data.sessions.length} active sessions`, 'success');
                    data.sessions.forEach(session => {
                        // Ensure messages array exists
                        if (!session.messages) {
                            session.messages = [];
                        }
                        sessions.set(session.sessionId, session);
                    });
                    renderSessions();
                    break;
                    
                case 'new_chat_session':
                    log(`🆕 New session: ${data.sessionId}`, 'success');
                    const newSession = {
                        sessionId: data.sessionId,
                        userType: data.userType,
                        merchantName: data.merchantName || data.payload?.merchantName,
                        merchantEmail: data.merchantEmail || data.payload?.merchantEmail,
                        driverName: data.driverName || data.payload?.driverName,
                        status: 'waiting_for_agent',
                        createdAt: new Date().toISOString(),
                        messages: []
                    };
                    sessions.set(newSession.sessionId, newSession);
                    renderSessions();
                    playNotificationSound();
                    break;
                    
                case 'chat_message':
                    log(`💬 Message in session: ${data.sessionId}`, 'info');
                    console.log('📨 Full chat_message data:', data);
                    
                    let session = sessions.get(data.sessionId);
                    if (!session) {
                        // Create session if it doesn't exist
                        log(`⚠️ Session not found, creating: ${data.sessionId}`, 'info');
                        session = {
                            sessionId: data.sessionId,
                            userType: data.userType,
                            merchantName: data.merchantName,
                            merchantEmail: data.merchantEmail,
                            driverName: data.driverName,
                            status: 'active',
                            messages: []
                        };
                        sessions.set(data.sessionId, session);
                    }
                    
                    if (!session.messages) session.messages = [];
                    
                    // Add the message
                    session.messages.push(data.message);
                    log(`✅ Message added: "${data.message.text.substring(0, 30)}..."`, 'success');
                    console.log('📊 Session now has messages:', session.messages.length);
                    
                    // Update UI
                    if (activeSessionId === data.sessionId) {
                        log('🔄 Updating active chat view', 'info');
                        renderMessages();
                    }
                    renderSessions();
                    break;
            }
        }
        
        // Render sessions list
        function renderSessions() {
            const sessionsList = document.getElementById('sessionsList');
            const sessionCount = document.getElementById('sessionCount');
            
            if (sessions.size === 0) {
                sessionsList.innerHTML = `
                    <div class="empty-state" style="padding: 40px 20px;">
                        <i class="fas fa-comments"></i>
                        <p style="margin-top: 10px;">Waiting for sessions...</p>
                    </div>
                `;
                sessionCount.textContent = '0';
                return;
            }
            
            sessionCount.textContent = sessions.size;
            
            // Clear and rebuild the sessions list
            sessionsList.innerHTML = '';
            
            sessions.forEach((session, id) => {
                const userIcon = session.userType === 'merchant' ? '🏪' : '🚗';
                const userName = session.userType === 'merchant' 
                    ? (session.merchantName || session.merchantEmail)
                    : (session.driverName || 'Driver');
                const messageCount = session.messages ? session.messages.length : 0;
                const lastMessage = messageCount > 0 
                    ? session.messages[messageCount - 1].text.substring(0, 40) + '...'
                    : 'No messages yet';
                
                // Create session element using DOM
                const sessionDiv = document.createElement('div');
                sessionDiv.className = `session ${activeSessionId === id ? 'active' : ''}`;
                sessionDiv.style.cursor = 'pointer';
                
                // Add click event listener directly to DOM element
                sessionDiv.addEventListener('click', function() {
                    selectSession(id);
                });
                
                sessionDiv.innerHTML = `
                    <div class="session-name">
                        ${userIcon} ${userName}
                        <span class="session-badge">${session.userType}</span>
                    </div>
                    ${session.merchantEmail ? `<div class="session-email">${session.merchantEmail}</div>` : ''}
                    <div class="session-time">${messageCount} messages</div>
                `;
                
                sessionsList.appendChild(sessionDiv);
            });
        }
        
        // Select session
        function selectSession(sessionId) {
            log(`🎯 Selecting session: ${sessionId}`, 'info');
            activeSessionId = sessionId;
            const session = sessions.get(sessionId);
            
            if (!session) {
                log(`❌ Session not found: ${sessionId}`, 'error');
                return;
            }
            
            log(`✅ Session selected: ${session.merchantName || session.driverName}`, 'success');
            
            document.getElementById('chatTitle').textContent = 
                (session.userType === 'merchant' ? '🏪 ' : '🚗 ') +
                (session.merchantName || session.driverName || 'User');
            
            document.getElementById('chatInput').style.display = 'block';
            
            renderSessions();
            renderMessages();
        }
        
        // Make selectSession available globally for onclick handlers
        window.selectSession = selectSession;
        
        // Render messages
        function renderMessages() {
            const chatMessages = document.getElementById('chatMessages');
            const session = sessions.get(activeSessionId);
            
            if (!session || !session.messages || session.messages.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment"></i>
                        <h3 style="margin: 10px 0;">No messages yet</h3>
                        <p>Start the conversation by sending a message</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            session.messages.forEach(msg => {
                const isAgent = msg.senderType === 'agent' || msg.senderType === 'support';
                const avatar = isAgent ? '👨‍💼' : (session.userType === 'merchant' ? '🏪' : '🚗');
                const senderName = isAgent ? 'You' : (session.merchantName || session.driverName || 'User');
                
                html += `
                    <div class="message ${isAgent ? 'sent' : ''}">
                        <div class="message-avatar">${avatar}</div>
                        <div class="message-content">
                            <div class="message-sender">${senderName}</div>
                            <div class="message-text">${msg.text}</div>
                            <div class="message-time">${new Date(msg.createdAt).toLocaleTimeString()}</div>
                        </div>
                    </div>
                `;
            });
            
            chatMessages.innerHTML = html;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Send message
        function sendMessage() {
            console.log('🚀 sendMessage called from button click');
            log('🚀 sendMessage called', 'info');
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket not connected', 'error');
                alert('WebSocket not connected. Please wait...');
                return;
            }
            
            if (!activeSessionId) {
                log('❌ No active session', 'error');
                alert('Please select a session first');
                return;
            }
            
            const input = document.getElementById('messageInput');
            if (!input) {
                log('❌ Message input not found', 'error');
                return;
            }
            
            const text = input.value.trim();
            log(`📝 Message text: "${text}"`, 'info');
            
            if (!text) {
                log('❌ Empty message', 'error');
                return;
            }
            
            const msg = {
                action: 'chat_message',
                type: 'chat_message',
                sessionId: activeSessionId,
                message: text,
                senderType: 'agent',
                agentId: AGENT_ID,
                agentName: AGENT_NAME,
                timestamp: new Date().toISOString()
            };
            
            log(`📤 Sending message to session ${activeSessionId}`, 'success');
            console.log('Sending WebSocket message:', msg);
            
            try {
                ws.send(JSON.stringify(msg));
                log('✅ Message sent successfully', 'success');
                
                // Add message to local state immediately for optimistic UI update
                const session = sessions.get(activeSessionId);
                if (session) {
                    if (!session.messages) session.messages = [];
                    session.messages.push({
                        text: text,
                        senderType: 'agent',
                        agentId: AGENT_ID,
                        agentName: AGENT_NAME,
                        createdAt: new Date().toISOString()
                    });
                    renderMessages();
                }
                
                input.value = '';
                input.focus();
            } catch (error) {
                log(`❌ Failed to send: ${error.message}`, 'error');
                console.error('Send error:', error);
            }
        }
        
        // Make sendMessage available globally
        window.sendMessage = sendMessage;
        console.log('✅ sendMessage exposed to window:', typeof window.sendMessage);
        
        // Update status indicator
        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected to ghayth stage';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected - Reconnecting...';
            }
        }
        
        // Log to console
        function log(message, type = 'info') {
            console.log(message);
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // Play notification sound
        function playNotificationSound() {
            // Could add audio element here
            log('🔔 New session notification', 'info');
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Send button click
            const sendButton = document.getElementById('sendButton');
            if (sendButton) {
                sendButton.addEventListener('click', function(e) {
                    console.log('✅ Send button clicked!');
                    e.preventDefault();
                    sendMessage();
                });
                log('✅ Send button listener attached', 'success');
            } else {
                log('❌ Send button not found', 'error');
            }
            
            // Enter key in input
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        console.log('✅ Enter key pressed!');
                        e.preventDefault();
                        sendMessage();
                    }
                });
                log('✅ Input enter listener attached', 'success');
            } else {
                log('❌ Message input not found', 'error');
            }
        }
        
        // Initialize on load
        window.onload = function() {
            init();
            setupEventListeners();
        };
    </script>
</body>
</html>
