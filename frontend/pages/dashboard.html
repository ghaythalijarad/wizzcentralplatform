<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Dashboard</title>
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Lightweight debug panel (shown with ?debug=1) */
        #dashboard-debug-panel { display:none;background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;padding:8px 12px;border-radius:8px;margin:8px 8px 0;font:12px/1.4 system-ui,-apple-system,Segoe UI,Roboto; }
        #dashboard-debug-panel code { background:rgba(0,0,0,0.05);padding:1px 4px;border-radius:4px; }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<body data-page="dashboard">
    <!-- Sidebar include placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar -->
        <div class="top-bar bg-neutral-0 shadow-sm border-b border-neutral-200">
            <div class="top-bar-left flex items-center gap-4">
                <button class="btn btn-ghost btn-sm" id="menuToggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="h2 text-neutral-900 mb-0">Dashboard Overview</h1>
            </div>
            <div class="top-bar-right flex items-center gap-3">
                <div class="notifications">
                    <button class="btn btn-ghost btn-sm relative" aria-label="View notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge badge-error absolute -top-1 -right-1 text-xs">3</span>
                    </button>
                </div>
                <div class="user-menu">
                    <button class="btn btn-ghost btn-sm" aria-label="User menu">
                        <i class="fas fa-user"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-6 p-6">
            <div class="card bg-gradient-primary text-white">
                <div class="card-body flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-users text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-0" id="customersCount">0</h3>
                        <p class="text-sm opacity-90 mb-0">Customers</p>
                    </div>
                </div>
            </div>
            <div class="card bg-gradient-secondary text-white">
                <div class="card-body flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-store text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-0" id="merchantsCount">0</h3>
                        <p class="text-sm opacity-90 mb-0">Merchants</p>
                    </div>
                </div>
            </div>
            <div class="card bg-gradient-success text-white">
                <div class="card-body flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-motorcycle text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-0" id="driversCount">0</h3>
                        <p class="text-sm opacity-90 mb-0">Drivers</p>
                    </div>
                </div>
            </div>
            <div class="card bg-gradient-warning text-white">
                <div class="card-body flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-shopping-bag text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-0" id="ordersCount">0</h3>
                        <p class="text-sm opacity-90 mb-0">Orders</p>
                    </div>
                </div>
            </div>
            <div class="card bg-gradient-info text-white">
                <div class="card-body flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-tags text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-0" id="promotionsCount">0</h3>
                        <p class="text-sm opacity-90 mb-0">Promotions</p>
                    </div>
                </div>
            </div>
            <div class="card bg-gradient-error text-white">
                <div class="card-body flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-headset text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-0" id="ticketsCount">0</h3>
                        <p class="text-sm opacity-90 mb-0">Support Tickets</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="p-6">
            <!-- Dashboard Content -->
            <div class="dashboard-content">
                <!-- Charts and Recent Activity -->
                <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Recent Businesses -->
                    <div class="card lg:col-span-2">
                        <div class="card-header border-b border-neutral-200 p-6 pb-4">
                            <div class="flex items-center justify-between">
                                <h3 class="h4 text-neutral-900 mb-0">Recent Businesses</h3>
                                <a href="merchants.html" class="btn btn-primary btn-sm">
                                    View All
                                    <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                        <div class="card-body p-6">
                            <div class="merchant-list space-y-4" id="recentBusinessesList">
                                <!-- Recent businesses will populate here -->
                                <div class="flex items-center justify-center py-12 text-neutral-500">
                                    <div class="text-center">
                                        <i class="fas fa-store text-3xl mb-3 opacity-50"></i>
                                        <p class="text-sm">Loading recent businesses...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Quick Actions -->
                    <div class="card">
                        <div class="card-header border-b border-neutral-200 p-6 pb-4">
                            <h3 class="h4 text-neutral-900 mb-0">Quick Actions</h3>
                        </div>
                        <div class="card-body p-6">
                            <div class="space-y-3">
                                <a href="customers.html" class="btn btn-outline w-full justify-start">
                                    <i class="fas fa-users"></i>
                                    Manage Customers
                                </a>
                                <a href="merchants.html" class="btn btn-outline w-full justify-start">
                                    <i class="fas fa-store"></i>
                                    Add Merchant
                                </a>
                                <a href="orders.html" class="btn btn-outline w-full justify-start">
                                    <i class="fas fa-shopping-bag"></i>
                                    View Orders
                                </a>
                                <a href="support.html" class="btn btn-outline w-full justify-start">
                                    <i class="fas fa-headset"></i>
                                    Support Center
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>

    <!-- Configuration -->
    <script src="../config.js?v=20250906"></script>

    <!-- Centralized utilities -->
    <script src="../assets/js/auth-utils.js?v=20250906"></script>
    <script src="../assets/js/aws-utils.js?v=20250906"></script>

    <!-- Data service (depends on aws-utils) -->
    <script src="../data-service.js?v=20250906"></script>

    <!-- Page-specific scripts -->
    <script src="../assets/js/sidebar.js?v=20250906"></script>
    <script src="../assets/js/navigation.js?v=20250906"></script>
    <script src="../dashboard.js?v=20250906"></script>

    <!-- Inline build stamp for debugging -->
    <script>
        (function(){
            const build = 'dashboard.html#2025-09-06T'+new Date().toISOString().slice(11,19);
            document.documentElement.setAttribute('data-build', build);
            console.log('Dashboard page build:', build);
            const p = new URLSearchParams(location.search);
            if (p.get('debug') === '1') {
                const el = document.getElementById('dashboard-debug-panel');
                if (el) el.style.display = 'inline-block';
                const s = Array.from(document.scripts).find(x => (x.src||'').includes('/frontend/dashboard.js'));
                // values filled by dashboard.js helpers
            }
        })();
    </script>
</body>

</html>
