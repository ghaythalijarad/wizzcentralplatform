<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Support (Live Chat)</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../enhanced-amazon-connect-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/platform-theme.css">
    <style>
        .page-content { 
            padding: 1.5rem; 
            background: #f8fafc; 
            min-height: calc(100vh - 120px); 
        }
        
        .tab-content { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            border: 1px solid #e5e7eb; 
            min-height: 600px; 
            padding: 0; 
            overflow: hidden; 
            display: block; 
        }
        
        .connection-status-banner {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .connection-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
        }
        
        .status-indicator.connected { background: #10b981; }
        .status-indicator.disconnected { background: #ef4444; }
        .status-indicator.connecting { background: #f59e0b; }
        
        .connection-text {
            font-weight: 500;
            color: #374151;
        }
        
        .refresh-btn {
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #374151;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .refresh-btn:hover {
            background: #f9fafb;
        }
        
        #agent-chat-container {
            min-height: 600px;
        }
    </style>
</head>

<body data-page="support">
    <div id="sidebar-placeholder"></div>

    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menuToggle" title="Toggle menu" aria-label="Toggle navigation menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-header">
                    <h1 class="page-title">Support Center</h1>
                    <p class="page-subtitle">Live Chat Management</p>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="btn-secondary" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="page-content">
            <div class="tab-content">
                <!-- Connection Status Banner -->
                <div class="connection-status-banner">
                    <div class="connection-info">
                        <div class="status-indicator" id="status-indicator"></div>
                        <span class="connection-text" id="connection-status">Initializing live chat connection...</span>
                        </div>
                    <button class="refresh-btn" onclick="reconnectLiveChat()" title="Reconnect Live Chat">
                        <i class="fas fa-sync-alt"></i>
                        Reconnect
                    </button>
                    </div>

                <!-- Agent Chat Interface Container -->
                <div id="agent-chat-container">
                    <!-- Agent chat interface will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Required configuration and core libs -->
    <script src="../config.js"></script>
    <script src="../assets/js/auth-utils.js"></script>
    <script src="../assets/js/navigation.js"></script>

    <!-- OOP Modular Architecture core -->
    <script src="../js/core/EventBus.js"></script>
    <script src="../js/core/ThemeManager.js"></script>
    <script src="../js/core/ModalManager.js"></script>
    <script src="../js/core/StorageManager.js"></script>

    <!-- WebSocket infrastructure -->
    <script src="../assets/js/ws-compat-shim.js"></script>
    <script src="../assets/js/websocket-manager.js"></script>
    
    <!-- Live Chat modules -->
    <script src="../assets/js/live-chat-manager.js"></script>
    <script src="../assets/js/agent-chat-interface.js"></script>
    
    <!-- Legacy support modules (for backward compatibility) -->
    <script src="../js/support/ChatSessionService.js"></script>
    <script src="../js/support/LiveChatSocket.js"></script>
    <script src="../js/support/LiveChatUI.js"></script>
    <script>
        let agentChatInterface = null;
        let wsManager = null;

        // Prevent auto-initialization since we're manually initializing
        window.manualLiveChatInit = true;

        /**
         * Initialize the unified live chat system
         */
        async function initializeLiveChat() {
            try {
                updateConnectionStatus('connecting', 'Initializing live chat system...');

                // Initialize WebSocketManager if not already done
                if (!window.wsManager) {
                    console.log('🔗 Initializing WebSocketManager...');

                    const config = window.WIZZCENTRAL_CONFIG || {};
                    const wsUrl = config.WEBSOCKET?.LIVE_CHAT_URL || 'wss://0fs1zdwyzf.execute-api.us-east-1.amazonaws.com/dev';

                    window.wsManager = new WebSocketManager({
                        url: wsUrl,
                        protocols: [],
                        autoReconnect: true,
                        maxReconnectAttempts: 10,
                        reconnectDelay: 1000
                    });

                    // Setup connection event handlers
                    window.wsManager.on('connected', async () => {
                        updateConnectionStatus('connected', 'Connected to live chat');
                        console.log('✅ WebSocket connected');
                    
                        // Send agent connect message
                        try {
                            const agentConnectMessage = {
                                action: 'agent_connect',
                                type: 'agent_connect',
                                payload: {
                                    agentId: 'support_agent_' + Date.now(),
                                    agentName: 'Support Agent',
                                    status: 'available'
                                }
                            };

                            // Send via raw WebSocket if available
                            if (window.wsManager && window.wsManager.ws && window.wsManager.ws.readyState === WebSocket.OPEN) {
                                window.wsManager.ws.send(JSON.stringify(agentConnectMessage));
                                console.log('📤 Sent agent connect message via raw WebSocket');
                            } else if (window.wsManager && typeof window.wsManager.sendMessage === 'function') {
                                window.wsManager.sendMessage(agentConnectMessage);
                                console.log('📤 Sent agent connect message via sendMessage');
                            } else {
                                console.warn('⚠️ WebSocket not available for sending agent connect message');
                            }
                        } catch (error) {
                            console.error('❌ Failed to send agent connect message:', error);
                        }
                    });

                    window.wsManager.on('disconnected', () => {
                        updateConnectionStatus('disconnected', 'Disconnected from live chat');
                        console.log('❌ WebSocket disconnected');
                    });

                    window.wsManager.on('connecting', () => {
                        updateConnectionStatus('connecting', 'Connecting to live chat...');
                        console.log('🔄 WebSocket connecting...');
                    });

                    window.wsManager.on('error', (error) => {
                        updateConnectionStatus('disconnected', 'Connection error');
                        console.error('❌ WebSocket error:', error);
                    });

                    // Connect to WebSocket first
                    console.log('📡 Connecting to WebSocket...');
                    const businessId = '7ccf646c-9594-48d4-8f63-c366d89257e5';
                    await window.wsManager.connect(businessId);
                }
                            
                // Initialize AgentChatInterface after WebSocket is connected
                if (!agentChatInterface) {
                    console.log('💬 Initializing AgentChatInterface...');

                    agentChatInterface = new AgentChatInterface({
                        containerId: 'agent-chat-container',
                        agentId: 'support_agent_' + Date.now(),
                        agentName: 'Support Agent'
                    });

                            await agentChatInterface.init();

                            // Request notification permission
                            agentChatInterface.requestNotificationPermission();
                        }

                updateConnectionStatus('connected', 'Live chat system ready');
                console.log('✅ Live chat system initialized successfully');

            } catch (error) {
                console.error('❌ Failed to initialize live chat system:', error);
                console.error('❌ Error details:', {
                    message: error.message,
                    stack: error.stack,
                    wsManagerExists: !!window.wsManager,
                    agentChatExists: !!window.AgentChatInterface,
                    containerExists: !!document.getElementById('agent-chat-container')
                    });
                                                                    updateConnectionStatus('disconnected', `Failed to initialize live chat: ${error.message}`);

                                                                    // Show error notification
                                                                    if (window.showAlert) {
                                                                        window.showAlert(`Failed to initialize live chat system: ${error.message}`, 'danger');
                                                                    } else {
                                                                        alert(`LiveChat Error: ${error.message}`);
                                                                    }
                                                                }
                                                            }

                                                            /**
                                                             * Reconnect live chat system
                                                             */
                                                            async function reconnectLiveChat() {
                                                                console.log('🔄 Reconnecting live chat system...');

                                                                try {
                                                                    // Disconnect existing connections
                                                                    if (window.wsManager) {
                                                                        await window.wsManager.disconnect();
                                                                    }

                                                                    if (agentChatInterface) {
                                                                        agentChatInterface.destroy();
                                                                        agentChatInterface = null;
                }

                                                        // Wait a moment then reinitialize
                                                        setTimeout(() => {
                                                            initializeLiveChat();
                                                        }, 1000);
                                            
            } catch (error) {
                                                                console.error('❌ Failed to reconnect live chat:', error);
                                                                updateConnectionStatus('disconnected', 'Failed to reconnect');
                                                            }
                                                        }

                                                        /**
                                                         * Update connection status in UI
                                                         */
                                                        function updateConnectionStatus(status, message) {
                                                            const statusIndicator = document.getElementById('status-indicator');
                                                            const connectionStatus = document.getElementById('connection-status');

                                                            if (statusIndicator) {
                                                                statusIndicator.className = `status-indicator ${status}`;
                                                            }

                                                            if (connectionStatus) {
                                                                connectionStatus.textContent = message;
            }
        }

                        /**
                         * Initialize the page when DOM is ready
                         */
        document.addEventListener('DOMContentLoaded', function () {
            console.log('🚀 Support page loading...');

            // Load navigation and authentication
            if (typeof loadNavigation === 'function') {
                loadNavigation();
            }

            if (typeof checkAuthentication === 'function') {
                checkAuthentication();
            }

            // Initialize live chat system after a short delay
            setTimeout(() => {
                initializeLiveChat();
            }, 500);
        });

                        // Global functions for backward compatibility
                        window.reconnectLiveChat = reconnectLiveChat;
                        window.updateConnectionStatus = updateConnectionStatus;

                        // Expose for debugging
                        window.agentChatInterface = agentChatInterface;
                        window.wsManager = wsManager;

                        console.log('💬 Support page script loaded');
                    </script>
</body>

</html>
