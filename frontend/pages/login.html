<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Login</title>
    <link rel="stylesheet" href="../styles/material-3-design-system.css">
    <script src="../styles/wizz-theme-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    
    <style>
        /* Material 3 Login Page Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--md-sys-typescale-body-large-font);
            font-size: var(--md-sys-typescale-body-large-size);
            font-weight: var(--md-sys-typescale-body-large-weight);
            line-height: var(--md-sys-typescale-body-large-line-height);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            z-index: 2;
        }

        .login-card {
            background: var(--md-sys-color-surface-container);
            border-radius: var(--md-sys-shape-corner-extra-large);
            padding: 2rem;
            box-shadow: var(--md-sys-elevation-3);
            border: 1px solid var(--md-sys-color-outline-variant);
            position: relative;
            backdrop-filter: blur(20px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .logo i {
            font-size: 2rem;
            color: var(--md-sys-color-primary);
            animation: rocket-bounce 2s ease-in-out infinite;
        }

        @keyframes rocket-bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            40% {
                transform: translateY(-10px) rotate(-5deg);
            }
            60% {
                transform: translateY(-5px) rotate(5deg);
            }
        }

        .logo h1 {
            font-family: var(--md-sys-typescale-headline-large-font);
            font-size: var(--md-sys-typescale-headline-large-size);
            font-weight: var(--md-sys-typescale-headline-large-weight);
            color: var(--md-sys-color-primary);
            margin: 0;
        }

        .subtitle {
            font-family: var(--md-sys-typescale-body-medium-font);
            font-size: var(--md-sys-typescale-body-medium-size);
            color: var(--md-sys-color-on-surface-variant);
            margin: 0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-family: var(--md-sys-typescale-body-small-font);
            font-size: var(--md-sys-typescale-body-small-size);
            font-weight: var(--md-sys-typescale-body-small-weight);
            color: var(--md-sys-color-on-surface-variant);
            margin-left: 1rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-small);
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-sys-typescale-body-large-font);
            font-size: var(--md-sys-typescale-body-large-size);
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            background: var(--md-sys-color-surface-container-high);
            box-shadow: 0 0 0 2px var(--md-sys-color-primary-container);
        }

        .input-wrapper input::placeholder {
            color: var(--md-sys-color-on-surface-variant);
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--md-sys-color-on-surface-variant);
            z-index: 1;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: var(--md-sys-shape-corner-extra-small);
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .password-toggle:hover {
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            accent-color: var(--md-sys-color-primary);
        }

        .remember-me label {
            font-size: var(--md-sys-typescale-body-small-size);
            color: var(--md-sys-color-on-surface-variant);
            margin: 0;
        }

        .forgot-password {
            color: var(--md-sys-color-primary);
            text-decoration: none;
            font-size: var(--md-sys-typescale-body-small-size);
            font-weight: var(--md-sys-typescale-body-small-weight);
            transition: color var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .forgot-password:hover {
            color: var(--md-sys-color-primary-container);
            text-decoration: underline;
        }

        .login-btn {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: var(--md-sys-shape-corner-full);
            padding: 1rem 1.5rem;
            font-family: var(--md-sys-typescale-label-large-font);
            font-size: var(--md-sys-typescale-label-large-size);
            font-weight: var(--md-sys-typescale-label-large-weight);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            box-shadow: var(--md-sys-elevation-1);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background: var(--md-sys-color-on-surface);
            color: var(--md-sys-color-surface);
            cursor: not-allowed;
            opacity: 0.38;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        /* Background Animation */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(135deg, 
                var(--md-sys-color-primary-container) 0%, 
                var(--md-sys-color-secondary-container) 50%,
                var(--md-sys-color-tertiary-container) 100%);
            opacity: 0.1;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .shape-1 {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape-3 {
            width: 60px;
            height: 60px;
            top: 70%;
            left: 20%;
            animation-delay: 4s;
        }

        .shape-4 {
            width: 100px;
            height: 100px;
            top: 10%;
            right: 30%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                max-width: 100%;
                padding: 0;
            }

            .login-card {
                border-radius: var(--md-sys-shape-corner-large);
                padding: 1.5rem;
                margin: 0.5rem;
            }

            .logo h1 {
                font-size: var(--md-sys-typescale-headline-medium-size);
            }

            .form-options {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }

        /* Success/Error Messages with Material 3 */
        .message {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            border-radius: var(--md-sys-shape-corner-large);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--md-sys-typescale-body-medium-font);
            font-size: var(--md-sys-typescale-body-medium-size);
            font-weight: var(--md-sys-typescale-body-medium-weight);
            z-index: 1000;
            min-width: 280px;
            max-width: 400px;
            box-shadow: var(--md-sys-elevation-3);
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .message.success {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .message.error {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }

        .message.info {
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .message i {
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        /* Animation keyframes */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .message {
            animation: slideInRight 0.3s ease-out;
        }

        /* Dark theme support */
        @media (prefers-color-scheme: dark) {
            .background-animation {
                opacity: 0.05;
            }
            
            .floating-shape {
                opacity: 0.05;
            }
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<body>
    <!-- Load configuration -->
    <script src="../config.js"></script>

    <!-- Load Amazon Cognito Identity JS (working authentication library) -->
    <script
        src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>

    <!-- Main Content -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-rocket"></i>
                    <h1>WizzCentral</h1>
                </div>
                <p class="subtitle">Welcome back! Please sign in to your account.</p>
            </div>

            <form class="login-form" id="loginForm" method="post" action="#">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <div class="background-animation">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="floating-shape shape-4"></div>
        </div>
    </div>

    <script>
        // Working login script using Amazon Cognito Identity JS
        console.log('Loading working login script...');

        let isConfigLoaded = false;

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            console.log('DOM loaded, initializing...');

            // Load configuration
            loadConfiguration();

            // Initialize UI
            initializeUI();
        });

        function loadConfiguration() {
            try {
                console.log('Loading configuration...');

                // Retry mechanism for configuration loading
                let retryCount = 0;
                const maxRetries = 10;
                
                function checkConfig() {
                    if (window.WIZZCENTRAL_CONFIG) {
                        isConfigLoaded = true;
                        console.log('Configuration loaded successfully');
                        console.log('User Pool:', window.WIZZCENTRAL_CONFIG.COGNITO_USER_POOL_ID);
                        console.log('Client ID:', window.WIZZCENTRAL_CONFIG.COGNITO_CLIENT_ID);
                        return true;
                    } else if (retryCount < maxRetries) {
                        retryCount++;
                        console.log(`Configuration not ready, retry ${retryCount}/${maxRetries}...`);
                        setTimeout(checkConfig, 100);
                        return false;
                    } else {
                        throw new Error('Configuration not available after retries');
                    }
                }
                
                checkConfig();
            } catch (error) {
                console.error('Configuration loading failed:', error);
                showMessage('Authentication configuration missing', 'error');
            }
        }

        function initializeUI() {
            console.log('Initializing UI...');

            // DOM Elements
            const loginForm = document.getElementById('loginForm');
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordInput = document.getElementById('password');
            const emailInput = document.getElementById('email');

            if (!loginForm) {
                console.error('Login form not found');
                return;
            }

            // Password Toggle Functionality
            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            }

            // Form Submission Handler
            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                console.log('Form submitted');

                // Wait for configuration to be loaded
                const waitForConfig = () => {
                    if (isConfigLoaded) {
                        const email = emailInput?.value?.trim() || '';
                        const password = passwordInput?.value?.trim() || '';
                        const remember = document.getElementById('remember')?.checked || false;

                        // Basic validation
                        if (!email || !password) {
                            showMessage('Please fill in all required fields.', 'error');
                            return;
                        }

                        if (!isValidEmail(email)) {
                            showMessage('Please enter a valid email address.', 'error');
                            return;
                        }

                        if (password.length < 6) {
                            showMessage('Password must be at least 6 characters long.', 'error');
                            return;
                        }

                        console.log('Validation passed, calling handleLogin');
                        handleLogin(email, password, remember);
                    } else {
                        console.log('Waiting for configuration to load...');
                        setTimeout(waitForConfig, 100);
                    }
                };
                
                waitForConfig();
            });

            // Auto-fill remembered email
            const rememberLogin = localStorage.getItem('rememberLogin');
            const lastEmail = localStorage.getItem('lastEmail');

            if (rememberLogin === 'true' && lastEmail && emailInput) {
                emailInput.value = lastEmail;
                const rememberCheckbox = document.getElementById('remember');
                if (rememberCheckbox) rememberCheckbox.checked = true;
            }

            console.log('UI initialized successfully');
        }

        // Email validation function
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Working Cognito authentication
        function authenticateWithCognito(email, password) {
            return new Promise((resolve, reject) => {
                try {
                    const config = window.WIZZCENTRAL_CONFIG;

                    // Create user pool
                    const poolData = {
                        UserPoolId: config.COGNITO_USER_POOL_ID,
                        ClientId: config.COGNITO_CLIENT_ID
                    };

                    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

                    // Create user
                    const userData = {
                        Username: email,
                        Pool: userPool
                    };

                    const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

                    // Create auth details
                    const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails({
                        Username: email,
                        Password: password
                    });

                    // Authenticate
                    cognitoUser.authenticateUser(authenticationDetails, {
                        onSuccess: function (result) {
                            console.log('Authentication successful');

                            resolve({
                                success: true,
                                tokens: {
                                    accessToken: result.getAccessToken().getJwtToken(),
                                    idToken: result.getIdToken().getJwtToken(),
                                    refreshToken: result.getRefreshToken().getToken()
                                },
                                user: {
                                    username: email,
                                    userId: result.getIdToken().payload.sub
                                }
                            });
                        },

                        onFailure: function (err) {
                            console.error('Cognito authentication failed:', err);
                            reject(err);
                        },

                        newPasswordRequired: function (userAttributes, requiredAttributes) {
                            console.log('New password required');
                            reject(new Error('New password required'));
                        }
                    });

                } catch (error) {
                    console.error('Cognito setup failed:', error);
                    reject(error);
                }
            });
        }

        // Enhanced login handler
        async function handleLogin(email, password, remember) {
            const loginBtn = document.querySelector('.login-btn');
            if (!loginBtn) return;

            const originalText = loginBtn.innerHTML;

            // Update button state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Signing In...</span>';
            loginBtn.disabled = true;

            try {
                console.log('Attempting login with email:', email);

                // Authenticate with Cognito
                const authResult = await authenticateWithCognito(email, password);

                if (authResult.success) {
                    console.log('Login successful');
                    showMessage('Login successful! Redirecting...', 'success');

                    // Store user info and tokens in format expected by auth-utils.js
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('isAuthenticated', 'true');
                    sessionStorage.setItem('userId', authResult.user.userId);
                    sessionStorage.setItem('accessToken', authResult.tokens.accessToken);
                    sessionStorage.setItem('idToken', authResult.tokens.idToken);
                    sessionStorage.setItem('refreshToken', authResult.tokens.refreshToken);

                    // Store remember preference
                    if (remember) {
                        localStorage.setItem('rememberLogin', 'true');
                        localStorage.setItem('lastEmail', email);
                    } else {
                        localStorage.removeItem('rememberLogin');
                        localStorage.removeItem('lastEmail');
                    }

                    // Redirect to the dashboard page
                    setTimeout(() => {
                        console.log('Redirecting to dashboard...');
                        
                        // Since login.html and dashboard.html are in the same /pages/ directory,
                        // we can use a simple relative path
                        const dashboardUrl = 'dashboard.html';
                        console.log('Dashboard URL:', dashboardUrl);
                        
                        window.location.href = dashboardUrl;
                    }, 1000);

                } else {
                    throw new Error('Authentication failed');
                }

            } catch (error) {
                console.error('Login error:', error);
                handleLoginError(error);
            } finally {
                // Reset button state
                loginBtn.innerHTML = originalText;
                loginBtn.disabled = false;
            }
        }

        function handleLoginError(error) {
            let errorMessage = 'Login failed';

            console.log('Error details:', {
                name: error.name,
                message: error.message
            });

            const errorString = error.message || error.toString();

            if (errorString.includes('NotAuthorizedException') || errorString.includes('Incorrect username or password')) {
                errorMessage = 'Invalid email or password';
            } else if (errorString.includes('UserNotConfirmedException')) {
                errorMessage = 'Please verify your email address';
            } else if (errorString.includes('UserNotFoundException')) {
                errorMessage = 'User not found';
            } else if (errorString.includes('TooManyRequestsException')) {
                errorMessage = 'Too many login attempts. Please try again later.';
            } else if (errorString.includes('NetworkError') || errorString.includes('fetch')) {
                errorMessage = 'Network error. Please check your connection.';
            } else if (error.message && error.message !== 'Authentication failed') {
                errorMessage = error.message;
            }

            showMessage(errorMessage, 'error');
        }

        // Message display function with Material 3 styling
        function showMessage(message, type) {
            // Remove existing messages
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }

            // Create message element
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;

            // Add to document
            document.body.appendChild(messageDiv);

            // Auto remove after 5 seconds
            setTimeout(() => {
                messageDiv.style.animation = 'slideOutRight 0.3s ease-in forwards';
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.parentNode.removeChild(messageDiv);
                    }
                }, 300);
            }, 5000);
        }

        // Forgot password handler
        document.addEventListener('DOMContentLoaded', function () {
            const forgotPasswordLink = document.querySelector('.forgot-password');
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    showMessage('Password reset functionality will be implemented soon.', 'info');
                });
            }
        });
    </script>
</body>

</html>
