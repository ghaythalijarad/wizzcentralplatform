<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Drivers Management</title>
    <link rel="stylesheet" href="../styles/material-3-design-system.css">
    <script src="../styles/wizz-theme-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Driver status toggle styles -->
    <style>
        .btn-toggle-status {
            border: none;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            transition: all 0.2s;
            margin-left: 0.25rem;
        }

        .btn-toggle-status.approved {
            background: #fef3c7;
            color: #d97706;
            border: 1px solid #fbbf24;
        }

        .btn-toggle-status.approved:hover {
            background: #fde68a;
            color: #92400e;
        }

        .btn-toggle-status.pending {
            background: #dcfce7;
            color: #059669;
            border: 1px solid #22c55e;
        }

        .btn-toggle-status.pending:hover {
            background: #bbf7d0;
            color: #047857;
        }

        .btn-toggle-status:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* Lightweight debug panel (shown with ?debug=1) */
        #drivers-debug-panel {
            display: none;
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #7c2d12;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0 0 8px;
            font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto;
        }

        #drivers-debug-panel code {
            background: rgba(0, 0, 0, 0.05);
            padding: 1px 4px;
            border-radius: 4px;
        }
    </style>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<body data-page="drivers">
    <!-- Sidebar include placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">Drivers Management</h1>
            </div>
            <div class="top-bar-right">
                <button class="btn-primary" onclick="openAddDriverModal()">
                    <i class="fas fa-plus"></i>
                    Add New Driver
                </button>
                <div class="notifications">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                </div>
                <div class="user-menu">
                    <button class="user-menu-btn">
                        <i class="fas fa-user-circle"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="page-content">
            <!-- Driver Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon online">
                        <i class="fas fa-motorcycle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>0</h3>
                        <p>Approved Drivers</p>
                        <span class="stat-change neutral">Loading...</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon delivering">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3>0</h3>
                        <p>Pending Review</p>
                        <span class="stat-change neutral">Loading...</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon total">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3>0</h3>
                        <p>Total Drivers</p>
                        <span class="stat-change neutral">Loading...</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon rating">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="stat-info">
                        <h3>0.0</h3>
                        <p>Average Rating</p>
                        <span class="stat-change neutral">Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Filters and Search -->
            <div class="table-controls">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search drivers..." id="searchInput">
                </div>
                <div class="filter-container">
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="online">Online</option>
                        <option value="offline">Offline</option>
                        <option value="delivering">Delivering</option>
                        <option value="unavailable">Unavailable</option>
                    </select>
                    <select id="ratingFilter">
                        <option value="">All Ratings</option>
                        <option value="5">5 Stars</option>
                        <option value="4">4+ Stars</option>
                        <option value="3">3+ Stars</option>
                    </select>
                </div>
            </div>

            <!-- Drivers Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Driver</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Current Location</th>
                            <th>Orders Completed</th>
                            <th>Rating</th>
                            <th>Earnings Today</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="driversTableBody">
                        <!-- Driver data will be loaded dynamically from WhizzDrivers_dev table -->
                        <tr>
                            <td colspan="8" class="text-center" style="padding: 2rem;">
                                <i class="fas fa-spinner fa-spin"></i> Loading drivers from database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Driver Modal -->
    <div class="modal" id="addDriverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Driver</h2>
                <button class="modal-close" onclick="closeAddDriverModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addDriverForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="driverName">Full Name</label>
                            <input type="text" id="driverName" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="driverEmail">Email</label>
                            <input type="email" id="driverEmail" name="email" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="driverPhone">Phone Number</label>
                            <input type="tel" id="driverPhone" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="driverLicense">License Number</label>
                            <input type="text" id="driverLicense" name="license" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicleType">Vehicle Type</label>
                            <select id="vehicleType" name="vehicleType" required>
                                <option value="">Select vehicle type</option>
                                <option value="motorcycle">Motorcycle</option>
                                <option value="bicycle">Bicycle</option>
                                <option value="car">Car</option>
                                <option value="scooter">Scooter</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="emergencyContact">Emergency Contact</label>
                            <input type="tel" id="emergencyContact" name="emergencyContact" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeAddDriverModal()">Cancel</button>
                <button type="submit" form="addDriverForm" class="btn-primary">Add Driver</button>
            </div>
        </div>
    </div>

    <!-- AWS SDK and Cognito SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    
    <!-- Configuration -->
    <script src="../config.js?v=20250906"></script>

    <!-- Authentication service (direct Cognito) -->
    <script src="../auth-service.js?v=20250906"></script>

    <!-- Centralized utilities -->
    <script src="../assets/js/auth-utils.js?v=20250906"></script>
    <script src="../assets/js/aws-utils.js?v=20250906"></script>

    <!-- Data service (depends on aws-utils) -->
    <script src="../data-service.js?v=20250906"></script>

    <!-- Page-specific scripts -->
    <script src="../assets/js/navigation.js?v=20250906"></script>
    <script src="../drivers.js?v=20250906"></script>

    <!-- Inline build stamp for debugging -->
    <script>
        (function(){
            const build = 'drivers.html#2025-09-06T'+new Date().toISOString().slice(11,19);
            document.documentElement.setAttribute('data-build', build);
            console.log('Drivers page build:', build);
            const p = new URLSearchParams(location.search);
            if (p.get('debug') === '1') {
                const el = document.getElementById('drivers-debug-panel');
                if (el) el.style.display = 'inline-block';
                const s = Array.from(document.scripts).find(x => (x.src||'').includes('/frontend/drivers.js'));
                document.getElementById('dbg-build').textContent = build;
                document.getElementById('dbg-path').textContent = location.pathname;
                document.getElementById('dbg-drivers-src').textContent = s ? s.src : 'inline/unknown';
                document.getElementById('dbg-auth').textContent = (sessionStorage.getItem('idToken') ? 'idToken=yes' : 'idToken=no') + ', user=' + (sessionStorage.getItem('userEmail')||'');
                document.getElementById('dbg-aws').textContent = (window.AWSUtils && AWSUtils.isInitialized) ? 'initialized' : 'not-initialized';
                document.getElementById('dbg-table').textContent = 'WhizzDrivers_dev';
                // count filled by drivers.js when available
            }
        })();
    </script>
</body>

</html>
