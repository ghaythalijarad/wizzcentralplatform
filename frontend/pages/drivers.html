<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Drivers Management</title>
    <link rel="stylesheet" href="../styles/material-3-design-system.css">
    <script src="../styles/wizz-theme-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>

    <!-- Material 3 Enhanced Driver Management Styles -->
    <style>
        /* Enhanced Material 3 Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 24px;
            box-shadow: var(--md-sys-elevation-level1);
            border: none;
            transition: all var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .stat-card:hover {
            box-shadow: var(--md-sys-elevation-level2);
            transform: translateY(-2px);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--md-sys-color-primary);
        }
        
        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--md-sys-shape-corner-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        
        .stat-icon.online { background: var(--md-sys-color-primary); }
        .stat-icon.delivering { background: var(--md-sys-color-tertiary); }
        .stat-icon.total { background: var(--md-sys-color-secondary); }
        .stat-icon.rating { background: var(--md-sys-color-tertiary); }
        
        .stat-info h3 {
            font: var(--md-sys-typescale-display-small-font);
            font-size: var(--md-sys-typescale-display-small-size);
            font-weight: var(--md-sys-typescale-display-small-weight);
            color: var(--md-sys-color-on-surface);
            margin: 0 0 4px 0;
        }
        
        .stat-info p {
            font: var(--md-sys-typescale-body-medium-font);
            color: var(--md-sys-color-on-surface-variant);
            margin: 0 0 8px 0;
        }
        
        .stat-change {
            font: var(--md-sys-typescale-label-small-font);
            padding: 4px 8px;
            border-radius: var(--md-sys-shape-corner-full);
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
        }

        /* Enhanced Table Controls */
        .table-controls {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: var(--md-sys-elevation-level1);
        }
        
        .search-container {
            position: relative;
            flex: 1;
            min-width: 280px;
        }
        
        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-on-surface-variant);
        }
        
        .search-container input {
            width: 100%;
            height: 56px;
            padding: 0 16px 0 48px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-medium);
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            font: var(--md-sys-typescale-body-large-font);
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }
        
        .search-container input:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.2);
        }
        
        .filter-container {
            display: flex;
            gap: 12px;
        }
        
        .filter-container select {
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-medium);
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            font: var(--md-sys-typescale-body-large-font);
            min-width: 140px;
            cursor: pointer;
        }

        /* Enhanced Data Table */
        .table-container {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-large);
            overflow: hidden;
            box-shadow: var(--md-sys-elevation-level1);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }
        
        .data-table thead {
            background: var(--md-sys-color-surface-container-high);
        }
        
        .data-table th {
            padding: 16px;
            text-align: left;
            font: var(--md-sys-typescale-title-medium-font);
            font-weight: var(--md-sys-typescale-title-medium-weight);
            color: var(--md-sys-color-on-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }
        
        .data-table td {
            padding: 16px;
            font: var(--md-sys-typescale-body-medium-font);
            color: var(--md-sys-color-on-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }
        
        .data-table tbody tr:hover {
            background: var(--md-sys-color-surface-container-highest);
        }

        /* Driver Status Buttons */
        .btn-toggle-status {
            border: none;
            padding: 8px 16px;
            border-radius: var(--md-sys-shape-corner-full);
            cursor: pointer;
            font: var(--md-sys-typescale-label-medium-font);
            font-weight: var(--md-sys-typescale-label-medium-weight);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            height: 40px;
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .btn-toggle-status.approved {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .btn-toggle-status.approved:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            box-shadow: var(--md-sys-elevation-level1);
        }

        .btn-toggle-status.pending {
            background: var(--md-sys-color-tertiary-container);
            color: var(--md-sys-color-on-tertiary-container);
        }

        .btn-toggle-status.pending:hover {
            background: var(--md-sys-color-tertiary);
            color: var(--md-sys-color-on-tertiary);
            box-shadow: var(--md-sys-elevation-level1);
        }

        .btn-toggle-status:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Enhanced Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-extra-large);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--md-sys-elevation-level3);
        }

        .modal-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }

        .modal-header h2 {
            font: var(--md-sys-typescale-headline-small-font);
            font-weight: var(--md-sys-typescale-headline-small-weight);
            color: var(--md-sys-color-on-surface);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: var(--md-sys-shape-corner-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--md-sys-color-on-surface-variant);
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .modal-close:hover {
            background: var(--md-sys-color-surface-container-highest);
        }

        .modal-body {
            padding: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font: var(--md-sys-typescale-body-small-font);
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-medium);
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            font: var(--md-sys-typescale-body-large-font);
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.2);
        }

        .modal-footer {
            padding: 16px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Enhanced Action Buttons */
        .btn-primary {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            height: 40px;
            padding: 0 24px;
            border-radius: var(--md-sys-shape-corner-full);
            font: var(--md-sys-typescale-label-large-font);
            font-weight: var(--md-sys-typescale-label-large-weight);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .btn-primary:hover {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            box-shadow: var(--md-sys-elevation-level1);
        }

        .btn-secondary {
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline);
            height: 40px;
            padding: 0 24px;
            border-radius: var(--md-sys-shape-corner-full);
            font: var(--md-sys-typescale-label-large-font);
            font-weight: var(--md-sys-typescale-label-large-weight);
            cursor: pointer;
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }

        .btn-secondary:hover {
            background: var(--md-sys-color-surface-container-highest);
        }

        /* Debug panel */
        #drivers-debug-panel {
            display: none;
            background: var(--md-sys-color-error-container);
            border: 1px solid var(--md-sys-color-error);
            color: var(--md-sys-color-on-error-container);
            padding: 12px 16px;
            border-radius: var(--md-sys-shape-corner-medium);
            margin: 16px 0;
            font: var(--md-sys-typescale-body-small-font);
        }

        #drivers-debug-panel code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: var(--md-sys-shape-corner-small);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-container {
                justify-content: stretch;
            }

            .filter-container select {
                flex: 1;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

<body data-page="drivers">

    <!-- Main Content -->

    <!-- Main Content -->

    <!-- Add Driver Modal -->
    <div class="modal" id="addDriverModal">

            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeAddDriverModal()">Cancel</button>
                <button type="submit" form="addDriverForm" class="btn-primary">Add Driver</button>
            </div>
        </div>
    </div>

                console.warn('Auth check error:', e);
            }
        }
    </script>
    
    <!-- Inline build stamp for debugging -->
    <script>
        (function(){
            const build = 'drivers.html#2025-09-06T'+new Date().toISOString().slice(11,19);
            document.documentElement.setAttribute('data-build', build);
            console.log('Drivers page build:', build);
            const p = new URLSearchParams(location.search);
            if (p.get('debug') === '1') {
                const el = document.getElementById('drivers-debug-panel');
                if (el) el.style.display = 'inline-block';
                const s = Array.from(document.scripts).find(x => (x.src||'').includes('/frontend/drivers.js'));
                document.getElementById('dbg-build').textContent = build;
                document.getElementById('dbg-path').textContent = location.pathname;
                document.getElementById('dbg-drivers-src').textContent = s ? s.src : 'inline/unknown';
                document.getElementById('dbg-auth').textContent = (sessionStorage.getItem('idToken') ? 'idToken=yes' : 'idToken=no') + ', user=' + (sessionStorage.getItem('userEmail')||'');
                document.getElementById('dbg-aws').textContent = (window.AWSUtils && AWSUtils.isInitialized) ? 'initialized' : 'not-initialized';
                document.getElementById('dbg-table').textContent = 'WhizzDrivers_dev';
                // count filled by drivers.js when available
            }
        })();
    </script>
<!-- Sidebar Loading Script -->
<script>
    // Load sidebar content
    async function loadSidebar() {
        try {
            const response = await fetch('/includes/sidebar.html');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const html = await response.text();

            const placeholder = document.getElementById('sidebar-placeholder');
            if (placeholder) {
                placeholder.innerHTML = html;
                console.log('✅ Sidebar loaded successfully');

                // Set active state for drivers page
                const driversNavItem = document.querySelector('.nav-item[data-page="drivers"]');
                if (driversNavItem) {
                    // Remove any existing active states
                    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                    // Add active to drivers
                    driversNavItem.classList.add('active');
                }
            }
        } catch (error) {
            console.error('❌ Failed to load sidebar:', error);
        }
    }

    // Load sidebar when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadSidebar);
    } else {
        loadSidebar();
    }
</script>
