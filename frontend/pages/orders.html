<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Orders Management</title>
    <link rel="stylesheet" href="../styles/material-3-design-system.css">
    <script src="../styles/wizz-theme-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <style>
        /* Material 3 Orders Management Styles */
        .orders-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
    
        .orders-controls {
            background-color: var(--md-sys-color-surface-container-low);
            padding: 24px;
            border-radius: var(--md-sys-shape-corner-large);
            box-shadow: var(--md-sys-elevation-level1);
            margin-bottom: 32px;
        }
    
        .controls-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
    
        .search-box {
            flex: 1;
            min-width: 200px;
        }
    
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-small);
            font-size: var(--md-sys-typescale-body-large-font-size);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            transition: all var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
        }
    
        .filter-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }
    
        .filter-group select {
            padding: 12px 16px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-small);
            font-size: var(--md-sys-typescale-body-large-font-size);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
        }
    
        .status-badge {
            padding: 6px 12px;
            border-radius: var(--md-sys-shape-corner-full);
            font-size: var(--md-sys-typescale-label-small-font-size);
            font-weight: var(--md-sys-typescale-label-small-font-weight);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    
        .status-confirmed {
            background-color: var(--md-sys-color-success-container);
            color: var(--md-sys-color-on-success-container);
        }
    
        .status-pending {
            background-color: var(--md-sys-color-warning-container);
            color: var(--md-sys-color-on-warning-container);
        }
    
        .status-cancelled {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }
    
        .orders-table {
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-large);
            overflow: hidden;
            box-shadow: var(--md-sys-elevation-level1);
        }
    
        .table-header {
            background: #f8fafc;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    
        .orders-grid {
            overflow-x: auto;
        }
    
        .orders-grid table {
            width: 100%;
            border-collapse: collapse;
        }
    
        .orders-grid th,
        .orders-grid td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }
    
        .orders-grid th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
    
        .orders-grid td {
            font-size: 14px;
            color: #1e293b;
        }
    
        .orders-grid tr:hover {
            background: #f8fafc;
        }
    
        .view-details-btn {
            background: #00c2e8;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
    
        .view-details-btn:hover {
            background: #009bb8;
        }
    
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #00c2e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
    
            100% {
                transform: rotate(360deg);
            }
        }
    
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
    
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
    
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: between;
            align-items: center;
        }
    
        .modal-header h2 {
            margin: 0;
            color: #1e293b;
        }
    
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            margin-left: auto;
        }
    
        .modal-body {
            padding: 1.5rem;
        }
    
        .order-detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
    
        .detail-item {
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
        }
    
        .detail-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
    
        .detail-value {
            font-size: 14px;
            color: #1e293b;
            font-weight: 500;
        }
    
        .raw-data {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .items-list {
            background: #f8fafc;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: #1e293b;
            flex: 1;
        }

        .item-details {
            display: flex;
            gap: 1rem;
            font-size: 14px;
            color: #64748b;
        }

        .pricing-details {
            background: #f8fafc;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .price-row:last-child {
            border-bottom: none;
        }

        .total-row {
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            border-top: 2px solid #00c2e8;
            font-size: 16px;
        }
    
        @media (max-width: 768px) {
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
    
            .filter-group {
                justify-content: space-between;
            }
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<body data-page="orders">
    <!-- Sidebar include placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Page Content -->
        <div class="page-content">
            <!-- Orders Statistics -->
            <div class="orders-stats">
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #00c2e8, #009bb8);">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">Total Orders</div>
                        <div class="stat-value" id="total-orders">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #10b981, #047857);">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">Confirmed</div>
                        <div class="stat-value" id="confirmed-orders">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #f59e0b, #d97706);">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" id="pending-orders">0</div>
                        </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon" style="background: linear-gradient(45deg, #ef4444, #dc2626);">
                                <i class="fas fa-times-circle"></i>
                            </div>
                            <div class="stat-info">
                                <div class="stat-label">Cancelled</div>
                                <div class="stat-value" id="cancelled-orders">0</div>
                            </div>
                        </div>
                        </div>
                        
                        <!-- Search and Filter Controls -->
                        <div class="orders-controls">
                            <div class="controls-row">
                                <div class="search-box">
                                    <input type="text" id="search-input" placeholder="Search orders by ID, customer name..."
                                        onkeyup="filterOrders()">
                                </div>
                                <div class="filter-group">
                                    <select id="status-filter" onchange="filterOrders()">
                                        <option value="">All Statuses</option>
                                        <option value="confirmed">Confirmed</option>
                                        <option value="pending">Pending</option>
                                        <option value="cancelled">Cancelled</option>
                                    </select>
                                    <input type="date" id="date-from" onchange="filterOrders()" title="From Date">
                                    <input type="date" id="date-to" onchange="filterOrders()" title="To Date">
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="orders-table">
                <div class="table-header">
                    <h3>Orders List</h3>
                    <div id="table-status">
                        <span class="loading-spinner"></span>
                        Loading orders...
                    </div>
                </div>
                <div class="orders-grid">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Status</th>
                                <th>Total</th>
                                <th>Date</th>
                                <th>Actions</th>
                                </tr>
                                </thead>
                        <tbody id="orders-tbody">
                            <!-- Orders will be populated here -->
                        </tbody>
                        </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Order Details</h2>
                <button class="modal-close" onclick="closeOrderModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="order-details-content">
                    <!-- Order details will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>
    <!-- Configuration -->
    <script src="../config.js"></script>
    <!-- Centralized utilities -->
    <script src="../assets/js/auth-utils.js"></script>
    <script src="../assets/js/aws-utils.js"></script>
    <!-- Sidebar -->
    <script src="../assets/js/navigation.js"></script>
<script>
    let allOrders = [];
    let filteredOrders = [];

    // Load orders from API
    async function loadOrders() {
        const tableStatus = document.getElementById('table-status');
        const tbody = document.getElementById('orders-tbody');

        tableStatus.innerHTML = '<span class="loading-spinner"></span> Loading orders...';

        try {
            const response = await fetch('/orders');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            allOrders = data.orders || [];
            filteredOrders = [...allOrders];

            updateStatistics();
            renderOrdersTable();

            tableStatus.innerHTML = `${allOrders.length} orders loaded`;
        } catch (error) {
            console.error('Error loading orders:', error);
            tableStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error loading orders';
            tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 2rem; color: #ef4444;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                            <div>Failed to load orders: ${error.message}</div>
                        </td>
                    </tr>
                `;
        }
    }

    // Update statistics
    function updateStatistics() {
        const stats = allOrders.reduce((acc, order) => {
            acc.total++;
            if (order.status === 'confirmed') acc.confirmed++;
            else if (order.status === 'pending') acc.pending++;
            else if (order.status === 'cancelled') acc.cancelled++;
            return acc;
        }, { total: 0, confirmed: 0, pending: 0, cancelled: 0 });

        document.getElementById('total-orders').textContent = stats.total;
        document.getElementById('confirmed-orders').textContent = stats.confirmed;
        document.getElementById('pending-orders').textContent = stats.pending;
        document.getElementById('cancelled-orders').textContent = stats.cancelled;
    }

    // Render orders table
    function renderOrdersTable() {
        const tbody = document.getElementById('orders-tbody');

        if (filteredOrders.length === 0) {
            tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 2rem; color: #64748b;">
                            <i class="fas fa-search" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                            <div>No orders found</div>
                        </td>
                    </tr>
                `;
            return;
        }

        tbody.innerHTML = filteredOrders.map(order => `
                <tr>
                    <td><strong>${order.orderId}</strong></td>
                    <td>
                        <div>${order.customerName || 'N/A'}</div>
                        <div style="font-size: 12px; color: #64748b;">${order.customerEmail || ''}</div>
                    </td>
                    <td>
                        <span class="status-badge status-${order.status}">
                            ${order.status}
                        </span>
                    </td>
                    <td>$${(order.totalAmount || 0).toFixed(2)}</td>
                    <td>${order.formattedDate}</td>
                    <td>
                        <button class="view-details-btn" onclick="showOrderDetails('${order.cleanOrderId}')">>
                            View Details
                        </button>
                    </td>
                </tr>
            `).join('');
    }

    // Filter orders
    function filterOrders() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const statusFilter = document.getElementById('status-filter').value;
        const dateFrom = document.getElementById('date-from').value;
        const dateTo = document.getElementById('date-to').value;

        filteredOrders = allOrders.filter(order => {
            // Text search
            const matchesSearch = !searchTerm ||
                order.orderId.toLowerCase().includes(searchTerm) ||
                (order.customerName && order.customerName.toLowerCase().includes(searchTerm)) ||
                (order.customerEmail && order.customerEmail.toLowerCase().includes(searchTerm));

            // Status filter
            const matchesStatus = !statusFilter || order.status === statusFilter;

            // Date filters
            const orderDate = new Date(order.createdAt).toISOString().split('T')[0];
            const matchesDateFrom = !dateFrom || orderDate >= dateFrom;
            const matchesDateTo = !dateTo || orderDate <= dateTo;

            return matchesSearch && matchesStatus && matchesDateFrom && matchesDateTo;
        });

        renderOrdersTable();
        document.getElementById('table-status').innerHTML = `${filteredOrders.length} orders shown`;
    }

    // Show order details
    async function showOrderDetails(orderId) {
        const modal = document.getElementById('orderModal');
        const content = document.getElementById('order-details-content');

        content.innerHTML = '<div style="text-align: center;"><span class="loading-spinner"></span> Loading order details...</div>';
        modal.style.display = 'block';

        try {
            const response = await fetch(`/orders/${orderId}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const orderData = await response.json();
            const order = orderData.order;

            content.innerHTML = `
                <div class="order-detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">Order ID</div>
                        <div class="detail-value">${order.orderId || order.PK}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Order Number</div>
                        <div class="detail-value">${order.orderNumber || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">
                            <span class="status-badge status-${order.status}">${order.status}</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Total Amount</div>
                        <div class="detail-value">${order.currency || 'IQD'} ${(order.pricing?.total || order.total_legacy || 0).toLocaleString()}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Created Date</div>
                        <div class="detail-value">${order.createdAtFormatted || new Date(order.createdAt).toLocaleString()}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Customer Name</div>
                        <div class="detail-value">${order.customerName || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Customer Email</div>
                        <div class="detail-value">${order.customerEmail || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Customer Phone</div>
                        <div class="detail-value">${order.customerPhone || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Store Name</div>
                        <div class="detail-value">${order.storeName || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Payment Method</div>
                        <div class="detail-value">${order.paymentMethod || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Delivery Type</div>
                        <div class="detail-value">${order.deliveryType || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Channel</div>
                        <div class="detail-value">${order.channel || 'N/A'}</div>
                    </div>
                </div>
                
                ${order.items && order.items.length > 0 ? `
                <h4>Order Items</h4>
                <div class="items-list">
                    ${order.items.map(item => `
                        <div class="item-row">
                            <div class="item-name">${item.name}</div>
                            <div class="item-details">
                                <span>Qty: ${item.quantity}</span>
                                <span>Price: ${order.currency || 'IQD'} ${item.unitPrice?.toLocaleString()}</span>
                                <span>Total: ${order.currency || 'IQD'} ${(item.unitPrice * item.quantity)?.toLocaleString()}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}
                
                ${order.pricing ? `
                <h4>Pricing Breakdown</h4>
                <div class="pricing-details">
                    <div class="price-row">
                        <span>Subtotal:</span>
                        <span>${order.currency || 'IQD'} ${order.pricing.goodsSubtotal?.toLocaleString()}</span>
                    </div>
                    <div class="price-row">
                        <span>Delivery Fee:</span>
                        <span>${order.currency || 'IQD'} ${order.pricing.deliveryFee?.toLocaleString()}</span>
                    </div>
                    <div class="price-row">
                        <span>Service Fee:</span>
                        <span>${order.currency || 'IQD'} ${order.pricing.serviceFee?.toLocaleString()}</span>
                    </div>
                    <div class="price-row">
                        <span>Tax:</span>
                        <span>${order.currency || 'IQD'} ${order.pricing.tax?.toLocaleString()}</span>
                    </div>
                    <div class="price-row total-row">
                        <span><strong>Total:</strong></span>
                        <span><strong>${order.currency || 'IQD'} ${order.pricing.total?.toLocaleString()}</strong></span>
                    </div>
                </div>
                ` : ''}
                
                <details style="margin-top: 20px;">
                    <summary style="cursor: pointer; font-weight: bold;">Raw Order Data</summary>
                    <div class="raw-data" style="max-height: 300px; overflow-y: auto;">${JSON.stringify(order, null, 2)}</div>
                </details>
            `;
        } catch (error) {
            console.error('Error loading order details:', error);
            content.innerHTML = `
                    <div style="text-align: center; color: #ef4444;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <div>Failed to load order details: ${error.message}</div>
                    </div>
                `;
        }
    }

    // Close order modal
    function closeOrderModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    // Close modal when clicking outside
    window.onclick = function (event) {
        const modal = document.getElementById('orderModal');
        if (event.target === modal) {
            closeOrderModal();
        }
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', function () {
        loadOrders();
    });
</script>
<!-- Sidebar Loading Script -->
<script>
    // Load sidebar content
    async function loadSidebar() {
        try {
            const response = await fetch('/includes/sidebar.html');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const html = await response.text();

            const placeholder = document.getElementById('sidebar-placeholder');
            if (placeholder) {
                placeholder.innerHTML = html;
                console.log('✅ Sidebar loaded successfully');

                // Set active state for orders page
                const ordersNavItem = document.querySelector('.nav-item[data-page="orders"]');
                if (ordersNavItem) {
                    // Remove any existing active states
                    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                    // Add active to orders
                    ordersNavItem.classList.add('active');
                }
            }
        } catch (error) {
            console.error('❌ Failed to load sidebar:', error);
        }
    }

    // Load sidebar when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadSidebar);
    } else {
        loadSidebar();
    }
</script>
</body>

</html>
