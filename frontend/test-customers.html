<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Customers Page</title>
    <link rel="stylesheet" href="styles/material-3-design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Roboto', sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        #debug {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .simple-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .simple-table th,
        .simple-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .simple-table th {
            background: #f0f0f0;
            font-weight: 600;
        }
        .simple-table tr:hover {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 WizzCentral Customers Test Page</h1>
        
        <div id="status" class="status loading">
            <i class="fas fa-spinner fa-spin"></i> Loading customers data...
        </div>
        
        <div id="summary" style="display: none;">
            <h3>📊 Customer Summary</h3>
            <p><strong>Total Customers:</strong> <span id="totalCount">0</span></p>
            <p><strong>Active Customers:</strong> <span id="activeCount">0</span></p>
            <p><strong>VIP Customers:</strong> <span id="vipCount">0</span></p>
        </div>
        
        <div id="tableContainer" style="display: none;">
            <h3>👥 Customers List</h3>
            <table class="simple-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Orders</th>
                        <th>Spent (IQD)</th>
                        <th>Points</th>
                        <th>Segment</th>
                    </tr>
                </thead>
                <tbody id="customersTableBody">
                </tbody>
            </table>
        </div>
        
        <div id="debug">Initializing...</div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js"></script>
    <script src="customer-points-service.js"></script>
    <script src="customers.js"></script>

    <script>
        // Override the renderCustomersTable function for testing
        window.originalRenderCustomersTable = window.renderCustomersTable;
        
        function renderCustomersTable() {
            const tbody = document.getElementById('customersTableBody');
            if (!tbody || !window.customers) return;
            
            const debugEl = document.getElementById('debug');
            debugEl.textContent += `\n🎯 Rendering ${window.customers.length} customers...`;
            
            tbody.innerHTML = window.customers.map(customer => `
                <tr>
                    <td><strong>${customer.name}</strong></td>
                    <td>${customer.email}</td>
                    <td><span style="color: ${customer.status === 'active' ? 'green' : 'red'}">${customer.status}</span></td>
                    <td>${customer.totalOrders}</td>
                    <td>${customer.totalSpent.toLocaleString()}</td>
                    <td>${customer.points.toLocaleString()}</td>
                    <td>${customer.segment}</td>
                </tr>
            `).join('');
            
            // Update summary
            document.getElementById('totalCount').textContent = window.customers.length;
            document.getElementById('activeCount').textContent = window.customers.filter(c => c.status === 'active').length;
            document.getElementById('vipCount').textContent = window.customers.filter(c => c.segment === 'vip').length;
            
            // Show UI elements
            document.getElementById('summary').style.display = 'block';
            document.getElementById('tableContainer').style.display = 'block';
            
            // Update status
            const statusEl = document.getElementById('status');
            statusEl.className = 'status success';
            statusEl.innerHTML = '<i class="fas fa-check"></i> ✅ Customers loaded successfully!';
            
            debugEl.textContent += `\n✅ Table rendered with ${window.customers.length} customers`;
        }
        
        // Test initialization
        document.addEventListener('DOMContentLoaded', async function() {
            const debugEl = document.getElementById('debug');
            debugEl.textContent = '🚀 DOM loaded, starting test...\n';
            
            try {
                debugEl.textContent += '📦 Loading customer data...\n';
                
                // Call the initialization function from customers.js
                if (typeof window.initializeCustomersPage === 'function') {
                    await window.initializeCustomersPage();
                    debugEl.textContent += '✅ initializeCustomersPage completed\n';
                } else {
                    debugEl.textContent += '❌ initializeCustomersPage function not found\n';
                    // Try direct data loading
                    if (typeof window.loadCustomersData === 'function') {
                        await window.loadCustomersData();
                        debugEl.textContent += '✅ loadCustomersData completed\n';
                        renderCustomersTable();
                    } else {
                        debugEl.textContent += '❌ loadCustomersData function not found\n';
                    }
                }
                
            } catch (error) {
                debugEl.textContent += `❌ Error: ${error.message}\n`;
                
                const statusEl = document.getElementById('status');
                statusEl.className = 'status error';
                statusEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
