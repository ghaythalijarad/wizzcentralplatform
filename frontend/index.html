<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🚀 WizzCentral</h1>
        <p class="subtitle">Sign in to your account</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required value="g87_a@yahoo.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required value="Gha@551987">
            </div>
            
            <button type="submit" id="loginBtn">Sign In</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <!-- AWS SDK and Cognito -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    
    <script>
        // Simple logger - only to browser console
        function log(message, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        // Cognito Configuration
        const COGNITO_CONFIG = {
            region: 'us-east-1',
            userPoolId: 'us-east-1_Cp9YnOQWi',
            clientId: '5hun8p61grnakisu5gammcjelv'
        };

        log('Initializing Cognito User Pool...', 'info');
        const poolData = {
            UserPoolId: COGNITO_CONFIG.userPoolId,
            ClientId: COGNITO_CONFIG.clientId
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        log('✅ User Pool initialized', 'success');

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showStatus('Please enter both email and password', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            showStatus('Authenticating...', 'info');
            log(`Starting authentication for: ${email}`, 'info');

            try {
                const authenticationData = {
                    Username: email,
                    Password: password
                };
                const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);

                const userData = {
                    Username: email,
                    Pool: userPool
                };
                const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

                cognitoUser.authenticateUser(authenticationDetails, {
                    onSuccess: function(result) {
                        log('✅ Authentication successful!', 'success');
                        
                        const accessToken = result.getAccessToken().getJwtToken();
                        const idToken = result.getIdToken().getJwtToken();
                        const refreshToken = result.getRefreshToken().getToken();

                        log('✅ Tokens received', 'success');
                        
                        // Store tokens
                        sessionStorage.setItem('accessToken', accessToken);
                        sessionStorage.setItem('idToken', idToken);
                        sessionStorage.setItem('refreshToken', refreshToken);
                        sessionStorage.setItem('userEmail', email);
                        sessionStorage.setItem('isAuthenticated', 'true');
                        sessionStorage.setItem('lastLoginTime', Date.now().toString());

                        log('✅ Tokens stored in session', 'success');
                        showStatus('✅ Login successful! Redirecting...', 'success');

                        // Check for return URL, otherwise redirect to dashboard
                        setTimeout(() => {
                            const returnUrl = sessionStorage.getItem('returnUrl');
                            if (returnUrl) {
                                log(`Redirecting to original destination: ${returnUrl}`, 'info');
                                sessionStorage.removeItem('returnUrl'); // Clear it after use
                                window.location.href = returnUrl;
                            } else {
                                log('Redirecting to dashboard...', 'info');
                                window.location.href = '/pages/dashboard.html';
                            }
                        }, 1500);
                    },

                    onFailure: function(err) {
                        log(`❌ Authentication failed: ${err.code || err.name}`, 'error');
                        log(`Error message: ${err.message}`, 'error');
                        
                        let errorMessage = 'Login failed';
                        
                        if (err.code === 'NotAuthorizedException') {
                            errorMessage = 'Invalid email or password';
                        } else if (err.code === 'UserNotConfirmedException') {
                            errorMessage = 'Please verify your email address';
                        } else if (err.code === 'UserNotFoundException') {
                            errorMessage = 'User not found';
                        } else if (err.message) {
                            errorMessage = err.message;
                        }

                        showStatus(`❌ ${errorMessage}`, 'error');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Sign In';
                    },

                    newPasswordRequired: function(userAttributes, requiredAttributes) {
                        log('⚠️ New password required', 'warning');
                        showStatus('New password required. Please contact support.', 'error');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Sign In';
                    }
                });

            } catch (error) {
                log(`❌ Exception: ${error.message}`, 'error');
                console.error('Login exception:', error);
                showStatus('An error occurred during login', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        log('✅ Login page ready', 'success');
    </script>
</body>
</html>
