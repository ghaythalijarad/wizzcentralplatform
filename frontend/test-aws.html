<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AWS Connection</title>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
    <h1>AWS Configuration Test</h1>
    <div id="results"></div>
    
    <script>
        const config = {
            region: 'us-east-1',
            userPoolId: 'us-east-1_Cp9YnOQWi',
            clientId: '5hun8p61grnakisu5gammcjelv',
            identityPoolId: 'us-east-1:10dd68af-9c1e-448e-ae67-89eaeb3c8160'
        };
        
        const resultsDiv = document.getElementById('results');
        
        function log(message) {
            console.log(message);
            resultsDiv.innerHTML += '<p>' + message + '</p>';
        }
        
        async function testAWSConnection() {
            log('🔍 Testing AWS Connection...');
            
            try {
                // Configure AWS
                AWS.config.region = config.region;
                
                // Try to get unauthenticated credentials
                log('1. Testing unauthenticated access...');
                AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                    IdentityPoolId: config.identityPoolId
                });
                
                await new Promise((resolve, reject) => {
                    AWS.config.credentials.get((err) => {
                        if (err) reject(err);
                        else resolve();
                    });
                });
                
                log('✅ Unauthenticated credentials obtained');
                
                // Test DynamoDB connection
                log('2. Testing DynamoDB table access...');
                const dynamodb = new AWS.DynamoDB.DocumentClient();
                
                const params = {
                    TableName: 'WhizzDrivers_dev',
                    Limit: 1
                };
                
                const result = await dynamodb.scan(params).promise();
                log(`✅ DynamoDB scan successful! Found ${result.Items.length} item(s)`);
                
                if (result.Items.length > 0) {
                    log('📄 Sample driver data:');
                    log(JSON.stringify(result.Items[0], null, 2));
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                log('📋 Full error: ' + JSON.stringify(error, null, 2));
            }
        }
        
        testAWSConnection();
    </script>
</body>
</html>
