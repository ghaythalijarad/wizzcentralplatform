<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Manager Test</title>
</head>
<body>
    <h1>WebSocket Manager Test</h1>
    <div id="status">Loading...</div>
    <div id="logs"></div>

    <script src="/assets/js/websocket-manager.js" onload="console.log('✅ websocket-manager.js loaded')" onerror="console.error('❌ Failed to load websocket-manager.js')"></script>
    <script>
        function log(message) {
            console.log(message);
            const logsDiv = document.getElementById('logs');
            if (logsDiv) {
                logsDiv.innerHTML += '<p>' + new Date().toLocaleTimeString() + ' - ' + message + '</p>';
            }
        }
        
        // Check immediately
        log('Script loaded, WebSocketManager available: ' + (!!window.WebSocketManager));
        
        document.addEventListener('DOMContentLoaded', function() {
            const statusDiv = document.getElementById('status');
            
            log('DOM loaded, checking WebSocketManager...');
            log('Available window properties with WebSocket: ' + Object.keys(window).filter(key => key.includes('WebSocket')));
            
            if (window.WebSocketManager) {
                statusDiv.innerHTML = '✅ WebSocketManager loaded successfully!';
                log('✅ WebSocketManager class available');
                log('WebSocketManager type: ' + typeof window.WebSocketManager);
                log('WebSocketManager prototype: ' + (window.WebSocketManager.prototype ? 'exists' : 'missing'));
                
                try {
                    const wsManager = new window.WebSocketManager();
                    log('✅ WebSocketManager instance created successfully');
                    log('Instance type: ' + typeof wsManager);
                    statusDiv.innerHTML += '<br>✅ Instance creation successful';
                } catch (error) {
                    log('❌ Failed to create WebSocketManager instance: ' + error.message);
                    statusDiv.innerHTML += '<br>❌ Instance creation failed: ' + error.message;
                }
            } else {
                statusDiv.innerHTML = '❌ WebSocketManager not available';
                log('❌ WebSocketManager not found on window object');
                log('Available window keys: ' + Object.keys(window).slice(0, 20).join(', ') + '...');
            }
        });
    </script>
</body>
</html>
