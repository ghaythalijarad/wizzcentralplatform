<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Fix & Test - WizzCentral Promotions</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00c2e8 0%, #009bb8 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin: 0 0 20px 0;
            font-size: 2rem;
        }
        
        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .info { background: #e6f9fe; color: #00748a; border: 1px solid #00c2e8; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        
        .btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }
        
        .btn.secondary {
            background: #00c2e8;
        }
        
        .btn.secondary:hover {
            background: #009bb8;
            box-shadow: 0 10px 25px rgba(0, 194, 232, 0.3);
        }
        
        .progress {
            width: 100%;
            height: 6px;
            background: #f1f5f9;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .data-preview {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        
        .data-preview h3 {
            margin-top: 0;
            color: #334155;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .data-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ Promotions Fix Tool</h1>
        <p>Applying emergency fix for WizzCentral Platform promotions loading issue</p>
        
        <div id="status" class="status info">
            Ready to apply emergency fix...
        </div>
        
        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        
        <div id="dataPreview" class="data-preview" style="display: none;">
            <h3>📊 Sample Data Preview</h3>
            <div class="data-item">
                <span><strong>Campaigns:</strong></span>
                <span id="campaignsCount">0</span>
            </div>
            <div class="data-item">
                <span><strong>Merchant Discounts:</strong></span>
                <span id="discountsCount">0</span>
            </div>
            <div class="data-item">
                <span><strong>Total Promotions:</strong></span>
                <span id="totalCount">0</span>
            </div>
        </div>
        
        <button id="applyFixBtn" class="btn" onclick="applyEmergencyFix()">
            🚀 Apply Emergency Fix
        </button>
        
        <button id="testPromotionsBtn" class="btn secondary" onclick="openPromotionsPage()" style="display: none;">
            🔍 Test Promotions Page
        </button>
        
        <div style="margin-top: 20px;">
            <a href="pages/promotions.html" class="btn secondary">
                📱 Direct Link to Promotions
            </a>
        </div>
    </div>

    <script>
        // Sample data
        const sampleCampaigns = [
            {
                name: "Summer Sale 2024",
                campaignId: "CAMP_001",
                discountType: "percentage",
                discountValue: 20,
                status: "active",
                usage: 45,
                usageLimit: 100,
                minimumOrderValue: 50,
                startDate: "2024-06-01T00:00:00Z"
            },
            {
                name: "Welcome Discount",
                campaignId: "CAMP_002", 
                discountType: "fixed",
                discountValue: 10,
                status: "active",
                usage: 12,
                usageLimit: 50,
                minimumOrderValue: 25,
                startDate: "2024-01-01T00:00:00Z"
            }
        ];

        const sampleDiscounts = [
            {
                title: "Restaurant Special",
                discountId: "DISC_001",
                type: "percentage",
                value: 15,
                status: "active",
                usage_count: 23,
                usage_limit: 100,
                valid_to: "2024-12-31T23:59:59Z"
            },
            {
                title: "Coffee Shop Deal",
                discountId: "DISC_002",
                type: "fixed",
                value: 5,
                status: "active", 
                usage_count: 8,
                usage_limit: 200,
                valid_to: "2024-12-31T23:59:59Z"
            },
            {
                title: "Retail Discount",
                discountId: "DISC_003",
                type: "percentage",
                value: 25,
                status: "active",
                usage_count: 56,
                usage_limit: 150,
                valid_to: "2024-12-31T23:59:59Z"
            },
            {
                title: "Service Provider Deal",
                discountId: "DISC_004",
                type: "fixed",
                value: 15,
                status: "active",
                usage_count: 34,
                usage_limit: 75,
                valid_to: "2024-12-31T23:59:59Z"
            },
            {
                title: "Grocery Store Special",
                discountId: "DISC_005",
                type: "percentage",
                value: 12,
                status: "active",
                usage_count: 67,
                usage_limit: 200,
                valid_to: "2024-12-31T23:59:59Z"
            }
        ];

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        function updateProgress(percent) {
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function showDataPreview() {
            document.getElementById('campaignsCount').textContent = sampleCampaigns.length;
            document.getElementById('discountsCount').textContent = sampleDiscounts.length;
            document.getElementById('totalCount').textContent = sampleCampaigns.length + sampleDiscounts.length;
            document.getElementById('dataPreview').style.display = 'block';
        }

        async function applyEmergencyFix() {
            const button = document.getElementById('applyFixBtn');
            button.disabled = true;
            button.textContent = '⏳ Applying Fix...';
            
            try {
                updateStatus('🔧 Initializing emergency fix...', 'info');
                updateProgress(20);
                
                await sleep(500);
                
                updateStatus('📊 Preparing sample data...', 'info');
                updateProgress(40);
                showDataPreview();
                
                await sleep(500);
                
                updateStatus('💾 Storing fix data in browser session...', 'info');
                updateProgress(60);
                
                // Store emergency fix data
                sessionStorage.setItem('emergencyFixActive', 'true');
                sessionStorage.setItem('sampleCampaigns', JSON.stringify(sampleCampaigns));
                sessionStorage.setItem('sampleDiscounts', JSON.stringify(sampleDiscounts));
                sessionStorage.setItem('fixAppliedAt', new Date().toISOString());
                
                await sleep(500);
                
                updateStatus('✅ Validating fix data...', 'info');
                updateProgress(80);
                
                // Validate data was stored correctly
                const storedCampaigns = JSON.parse(sessionStorage.getItem('sampleCampaigns') || '[]');
                const storedDiscounts = JSON.parse(sessionStorage.getItem('sampleDiscounts') || '[]');
                
                if (storedCampaigns.length !== sampleCampaigns.length || 
                    storedDiscounts.length !== sampleDiscounts.length) {
                    throw new Error('Data validation failed');
                }
                
                await sleep(500);
                
                updateProgress(100);
                updateStatus(`
                    ✅ <strong>Emergency Fix Applied Successfully!</strong><br>
                    📊 <strong>Data Ready:</strong><br>
                    • ${sampleCampaigns.length} Campaigns prepared<br>
                    • ${sampleDiscounts.length} Merchant Discounts prepared<br>
                    🎯 <strong>Status:</strong> Ready to test promotions page
                `, 'success');
                
                button.textContent = '✅ Fix Applied';
                document.getElementById('testPromotionsBtn').style.display = 'inline-block';
                
                console.log('✅ Emergency fix applied successfully');
                console.log('📊 Data stored:', {
                    campaigns: storedCampaigns.length,
                    discounts: storedDiscounts.length,
                    fixActive: sessionStorage.getItem('emergencyFixActive')
                });
                
            } catch (error) {
                console.error('❌ Fix application failed:', error);
                updateStatus(`❌ <strong>Fix Failed:</strong> ${error.message}`, 'error');
                updateProgress(0);
                button.disabled = false;
                button.textContent = '🚀 Apply Emergency Fix';
            }
        }

        function openPromotionsPage() {
            updateStatus('🔄 Opening promotions page...', 'info');
            window.open('pages/promotions.html', '_blank');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Check if fix is already applied
        window.addEventListener('load', function() {
            if (sessionStorage.getItem('emergencyFixActive') === 'true') {
                const appliedAt = sessionStorage.getItem('fixAppliedAt');
                if (appliedAt) {
                    const timeAgo = Math.round((Date.now() - new Date(appliedAt).getTime()) / 1000);
                    updateStatus(`
                        ℹ️ <strong>Fix Already Applied</strong><br>
                        Applied ${timeAgo} seconds ago<br>
                        Ready to test promotions page
                    `, 'info');
                    updateProgress(100);
                    showDataPreview();
                    document.getElementById('testPromotionsBtn').style.display = 'inline-block';
                    document.getElementById('applyFixBtn').textContent = '✅ Fix Applied';
                }
            }
        });
    </script>
</body>
</html>
