<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Diagnostic Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        .section:last-child {
            border-bottom: none;
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .status-item {
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #ccc;
        }
        .status-item.success {
            background: #d4edda;
            border-left-color: #28a745;
        }
        .status-item.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        .status-item.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        .status-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .status-value {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #666;
            word-break: break-all;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }
        #console {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .log-success { color: #4ec9b0; }
        .log-error { color: #f48771; }
        .log-warning { color: #dcdcaa; }
        .log-info { color: #9cdcfe; }
        .log-time { color: #858585; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 WizzCentral Login Diagnostic</h1>
            <p>Complete system check and login test</p>
        </div>

        <div class="section">
            <h2>📊 System Status</h2>
            <div id="systemStatus" class="status-grid"></div>
        </div>

        <div class="section">
            <h2>⚙️ Configuration</h2>
            <div id="configStatus" class="status-grid"></div>
        </div>

        <div class="section">
            <h2>🔐 Test Login</h2>
            <input type="email" id="email" placeholder="Email Address" value="g87_a@yahoo.com">
            <input type="password" id="password" placeholder="Password" value="Gha@551987">
            <div style="margin-top: 20px;">
                <button class="btn" onclick="runFullTest()">🚀 Run Full Diagnostic & Login</button>
                <button class="btn btn-secondary" onclick="clearConsole()">🗑️ Clear Console</button>
            </div>
        </div>

        <div class="section">
            <h2>📝 Console Output</h2>
            <div id="console"></div>
        </div>
    </div>

    <!-- Load AWS SDKs -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="config.js"></script>

    <script>
        const consoleEl = document.getElementById('console');
        
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            consoleEl.appendChild(entry);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(message);
        }

        function clearConsole() {
            consoleEl.innerHTML = '';
            log('Console cleared', 'info');
        }

        function updateSystemStatus() {
            const statusDiv = document.getElementById('systemStatus');
            const items = [];

            // Check AWS SDK
            if (typeof AWS !== 'undefined') {
                items.push({ label: 'AWS SDK', value: `v${AWS.VERSION}`, status: 'success' });
            } else {
                items.push({ label: 'AWS SDK', value: 'Not loaded', status: 'error' });
            }

            // Check Cognito SDK
            if (typeof AmazonCognitoIdentity !== 'undefined') {
                items.push({ label: 'Cognito SDK', value: 'Loaded ✓', status: 'success' });
            } else {
                items.push({ label: 'Cognito SDK', value: 'Not loaded', status: 'error' });
            }

            // Check Config
            if (window.WIZZCENTRAL_CONFIG) {
                items.push({ label: 'Configuration', value: 'Loaded ✓', status: 'success' });
            } else {
                items.push({ label: 'Configuration', value: 'Not loaded', status: 'error' });
            }

            // Check Browser
            items.push({ 
                label: 'Browser', 
                value: navigator.userAgent.split(' ').slice(-1)[0], 
                status: 'success' 
            });

            statusDiv.innerHTML = items.map(item => `
                <div class="status-item ${item.status}">
                    <div class="status-label">${item.label}</div>
                    <div class="status-value">${item.value}</div>
                </div>
            `).join('');
        }

        function updateConfigStatus() {
            const configDiv = document.getElementById('configStatus');
            const cfg = window.WIZZCENTRAL_CONFIG || {};
            
            const items = [
                { label: 'Region', value: cfg.COGNITO_REGION || 'NOT SET' },
                { label: 'User Pool ID', value: cfg.COGNITO_USER_POOL_ID || 'NOT SET' },
                { label: 'Client ID', value: cfg.COGNITO_CLIENT_ID || 'NOT SET' },
                { label: 'Identity Pool', value: cfg.COGNITO_IDENTITY_POOL_ID || 'NOT SET' }
            ];

            configDiv.innerHTML = items.map(item => {
                const status = item.value === 'NOT SET' ? 'error' : 'success';
                return `
                    <div class="status-item ${status}">
                        <div class="status-label">${item.label}</div>
                        <div class="status-value">${item.value}</div>
                    </div>
                `;
            }).join('');
        }

        async function runFullTest() {
            clearConsole();
            log('═══════════════════════════════════════', 'info');
            log('🚀 STARTING FULL DIAGNOSTIC TEST', 'info');
            log('═══════════════════════════════════════', 'info');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                log('❌ Please enter email and password', 'error');
                return;
            }

            // Step 1: Check dependencies
            log('\n📦 Step 1: Checking Dependencies...', 'info');
            if (typeof AWS === 'undefined') {
                log('❌ AWS SDK not loaded', 'error');
                return;
            }
            log(`✅ AWS SDK v${AWS.VERSION}`, 'success');

            if (typeof AmazonCognitoIdentity === 'undefined') {
                log('❌ Cognito Identity SDK not loaded', 'error');
                return;
            }
            log('✅ Amazon Cognito Identity SDK loaded', 'success');

            // Step 2: Check configuration
            log('\n⚙️  Step 2: Checking Configuration...', 'info');
            if (!window.WIZZCENTRAL_CONFIG) {
                log('❌ Configuration not loaded', 'error');
                return;
            }
            
            const cfg = window.WIZZCENTRAL_CONFIG;
            log(`✅ Region: ${cfg.COGNITO_REGION}`, 'success');
            log(`✅ User Pool: ${cfg.COGNITO_USER_POOL_ID}`, 'success');
            log(`✅ Client ID: ${cfg.COGNITO_CLIENT_ID}`, 'success');

            // Step 3: Create User Pool
            log('\n🏗️  Step 3: Creating User Pool...', 'info');
            let userPool;
            try {
                const poolData = {
                    UserPoolId: cfg.COGNITO_USER_POOL_ID,
                    ClientId: cfg.COGNITO_CLIENT_ID
                };
                userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
                log('✅ User Pool created successfully', 'success');
            } catch (error) {
                log(`❌ Failed to create User Pool: ${error.message}`, 'error');
                return;
            }

            // Step 4: Create Cognito User
            log('\n👤 Step 4: Creating Cognito User...', 'info');
            let cognitoUser;
            try {
                const userData = {
                    Username: email,
                    Pool: userPool
                };
                cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
                log(`✅ Cognito User created for: ${email}`, 'success');
            } catch (error) {
                log(`❌ Failed to create Cognito User: ${error.message}`, 'error');
                return;
            }

            // Step 5: Create Auth Details
            log('\n🔑 Step 5: Creating Authentication Details...', 'info');
            let authDetails;
            try {
                const authData = {
                    Username: email,
                    Password: password
                };
                authDetails = new AmazonCognitoIdentity.AuthenticationDetails(authData);
                log('✅ Authentication details created', 'success');
            } catch (error) {
                log(`❌ Failed to create auth details: ${error.message}`, 'error');
                return;
            }

            // Step 6: Authenticate
            log('\n🔐 Step 6: Authenticating...', 'info');
            log('⏳ Please wait...', 'warning');
            
            cognitoUser.authenticateUser(authDetails, {
                onSuccess: (result) => {
                    log('\n═══════════════════════════════════════', 'success');
                    log('✅ LOGIN SUCCESSFUL!', 'success');
                    log('═══════════════════════════════════════', 'success');
                    
                    const accessToken = result.getAccessToken().getJwtToken();
                    const idToken = result.getIdToken().getJwtToken();
                    const refreshToken = result.getRefreshToken().getToken();

                    log(`\n🎫 Access Token (${accessToken.length} chars): ${accessToken.substring(0, 50)}...`, 'info');
                    log(`🆔 ID Token (${idToken.length} chars): ${idToken.substring(0, 50)}...`, 'info');
                    log(`🔄 Refresh Token (${refreshToken.length} chars): ${refreshToken.substring(0, 50)}...`, 'info');

                    // Decode ID token
                    try {
                        const payload = JSON.parse(atob(idToken.split('.')[1]));
                        log('\n👤 User Information:', 'info');
                        log(`   Email: ${payload.email}`, 'info');
                        log(`   Email Verified: ${payload.email_verified}`, 'info');
                        log(`   User ID: ${payload.sub}`, 'info');
                        log(`   Username: ${payload['cognito:username']}`, 'info');
                        log(`   Token Use: ${payload.token_use}`, 'info');
                        const expDate = new Date(payload.exp * 1000);
                        log(`   Expires: ${expDate.toLocaleString()}`, 'info');
                    } catch (e) {
                        log(`⚠️  Could not decode token: ${e.message}`, 'warning');
                    }

                    log('\n✅ All tests passed! Login is working correctly.', 'success');
                    log('═══════════════════════════════════════', 'success');
                },
                
                onFailure: (err) => {
                    log('\n═══════════════════════════════════════', 'error');
                    log('❌ LOGIN FAILED', 'error');
                    log('═══════════════════════════════════════', 'error');
                    log(`\nError Code: ${err.code || 'Unknown'}`, 'error');
                    log(`Error Name: ${err.name || 'Unknown'}`, 'error');
                    log(`Error Message: ${err.message || 'Unknown'}`, 'error');
                    
                    if (err.code === 'NotAuthorizedException') {
                        log('\n💡 This usually means:', 'warning');
                        log('   • Incorrect email or password', 'warning');
                        log('   • Account is disabled', 'warning');
                        log('   • Client secret issue (if app has secret)', 'warning');
                    } else if (err.code === 'UserNotFoundException') {
                        log('\n💡 User does not exist in this user pool', 'warning');
                    } else if (err.code === 'UserNotConfirmedException') {
                        log('\n💡 Email verification required', 'warning');
                    }
                    
                    log('\n🔍 Full Error Object:', 'error');
                    log(JSON.stringify(err, null, 2), 'error');
                    log('═══════════════════════════════════════', 'error');
                },
                
                newPasswordRequired: (userAttributes, requiredAttributes) => {
                    log('\n⚠️  NEW PASSWORD REQUIRED', 'warning');
                    log('User Attributes:', 'info');
                    log(JSON.stringify(userAttributes, null, 2), 'info');
                    log('Required Attributes:', 'info');
                    log(JSON.stringify(requiredAttributes, null, 2), 'info');
                }
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            log('🔍 Login Diagnostic Tool Loaded', 'success');
            updateSystemStatus();
            updateConfigStatus();
        });
    </script>
</body>
</html>
