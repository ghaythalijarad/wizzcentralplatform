<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Platform Discount Creation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .debug-output {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .success { color: #198754; }
        .error { color: #dc3545; }
        .info { color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Platform Discount Creation Test</h2>
        <p>This page tests the platform discount creation functionality.</p>
        
        <!-- Debug Output -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Debug Output</h5>
                <button id="clearDebug" class="btn btn-sm btn-secondary">Clear</button>
            </div>
            <div class="card-body">
                <div id="debugOutput" class="debug-output">
                    Initializing test page...
                </div>
            </div>
        </div>

        <!-- Test Actions -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Actions</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <button id="testAWSConnection" class="btn btn-primary mb-2">Test AWS Connection</button>
                        <button id="loadPlatformDiscounts" class="btn btn-info mb-2">Load Platform Discounts</button>
                        <button id="testCreateDiscount" class="btn btn-success mb-2">Test Create Platform Discount</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Platform Discount Form -->
        <div class="card">
            <div class="card-header">
                <h5>Create Platform Discount</h5>
            </div>
            <div class="card-body">
                <form id="platformDiscountForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="type" class="form-label">Type</label>
                                <select class="form-control" id="type" name="type" required>
                                    <option value="percentage">Percentage</option>
                                    <option value="fixed">Fixed Amount</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="value" class="form-label">Value</label>
                                <input type="number" class="form-control" id="value" name="value" step="0.01" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="minOrderValue" class="form-label">Minimum Order Value</label>
                                <input type="number" class="form-control" id="minOrderValue" name="minOrderValue" step="0.01" value="0">
                            </div>
                            <div class="mb-3">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="startDate" name="startDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="endDate" class="form-label">End Date</label>
                                <input type="date" class="form-control" id="endDate" name="endDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="limit" class="form-label">Usage Limit</label>
                                <input type="number" class="form-control" id="limit" name="limit" value="100">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="isActive" name="isActive" checked>
                                <label class="form-check-label" for="isActive">Active</label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Platform Discount</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Load scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1544.0.min.js"></script>
    <script src="config.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/aws-utils.js?v=5"></script>
    <script src="data-service.js?v=5"></script>

    <script>
        // Debug output functionality
        const debugOutput = document.getElementById('debugOutput');
        
        function addDebugMessage(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            debugOutput.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            debugOutput.scrollTop = debugOutput.scrollHeight;
        }

        // Clear debug output
        document.getElementById('clearDebug').addEventListener('click', () => {
            debugOutput.innerHTML = '';
        });

        // Initialize page
        addDebugMessage('Page loaded, initializing...');

        // Wait for data service to be available
        async function waitForDataService() {
            let retries = 20;
            while (retries > 0 && !window.dataService) {
                addDebugMessage('Waiting for data service...');
                await new Promise(resolve => setTimeout(resolve, 500));
                retries--;
            }
            
            if (!window.dataService) {
                addDebugMessage('Data service not available after waiting', 'error');
                return false;
            }
            
            addDebugMessage('Data service is available', 'success');
            return true;
        }

        // Test AWS connection
        async function testAWSConnection() {
            addDebugMessage('Testing AWS connection...');
            
            try {
                if (!await waitForDataService()) {
                    throw new Error('Data service not available');
                }

                // Test DynamoDB connection
                const dynamoDB = await window.dataService.getDynamoDBClient();
                addDebugMessage('DynamoDB client obtained: ' + !!dynamoDB, 'success');

                // Test table scan
                const result = await window.dataService.scan('WizzCentral_Platform_Discounts', { Limit: 1 });
                addDebugMessage('Table scan successful: Found ' + (result.Items?.length || 0) + ' items', 'success');

                return true;
            } catch (error) {
                addDebugMessage('AWS connection test failed: ' + error.message, 'error');
                return false;
            }
        }

        // Load platform discounts
        async function loadPlatformDiscounts() {
            addDebugMessage('Loading platform discounts...');
            
            try {
                if (!await waitForDataService()) {
                    throw new Error('Data service not available');
                }

                const discounts = await window.dataService.getPlatformDiscounts();
                addDebugMessage('Loaded ' + discounts.length + ' platform discounts', 'success');
                
                if (discounts.length > 0) {
                    addDebugMessage('First discount: ' + JSON.stringify(discounts[0], null, 2));
                }
                
                return discounts;
            } catch (error) {
                addDebugMessage('Failed to load platform discounts: ' + error.message, 'error');
                return [];
            }
        }

        // Test create platform discount
        async function testCreateDiscount() {
            addDebugMessage('Testing platform discount creation...');
            
            try {
                if (!await waitForDataService()) {
                    throw new Error('Data service not available');
                }

                const testDiscount = {
                    discountId: 'test_web_' + Date.now(),
                    title: 'Web Test Discount',
                    description: 'Test discount created from web interface',
                    type: 'percentage',
                    value: 20,
                    minOrderValue: 25,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: '2025-12-31',
                    isActive: true,
                    usage: 0,
                    limit: 50,
                    discountSource: 'platform',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                addDebugMessage('Creating test discount: ' + JSON.stringify(testDiscount, null, 2));
                
                const result = await window.dataService.createPlatformDiscount(testDiscount);
                addDebugMessage('Platform discount created successfully: ' + JSON.stringify(result, null, 2), 'success');
                
                return result;
            } catch (error) {
                addDebugMessage('Failed to create platform discount: ' + error.message, 'error');
                return null;
            }
        }

        // Handle form submission
        document.getElementById('platformDiscountForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            addDebugMessage('Form submitted, creating platform discount...');
            
            try {
                if (!await waitForDataService()) {
                    throw new Error('Data service not available');
                }

                const formData = new FormData(event.target);
                const discountData = {
                    discountId: 'platform_' + Date.now(),
                    title: formData.get('title'),
                    description: formData.get('description'),
                    type: formData.get('type'),
                    value: parseFloat(formData.get('value')),
                    minOrderValue: parseFloat(formData.get('minOrderValue')) || 0,
                    startDate: formData.get('startDate'),
                    endDate: formData.get('endDate'),
                    isActive: formData.get('isActive') === 'on',
                    usage: 0,
                    limit: parseInt(formData.get('limit')) || 0,
                    discountSource: 'platform',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                addDebugMessage('Form data: ' + JSON.stringify(discountData, null, 2));
                
                const result = await window.dataService.createPlatformDiscount(discountData);
                addDebugMessage('Platform discount created from form: ' + JSON.stringify(result, null, 2), 'success');
                
                // Reset form
                event.target.reset();
                
                // Set default dates
                document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('endDate').value = '2025-12-31';
                
            } catch (error) {
                addDebugMessage('Form submission failed: ' + error.message, 'error');
            }
        });

        // Set up test button event listeners
        document.getElementById('testAWSConnection').addEventListener('click', testAWSConnection);
        document.getElementById('loadPlatformDiscounts').addEventListener('click', loadPlatformDiscounts);
        document.getElementById('testCreateDiscount').addEventListener('click', testCreateDiscount);

        // Set default dates
        document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('endDate').value = '2025-12-31';

        // Initialize when page loads
        window.addEventListener('load', async () => {
            addDebugMessage('Window loaded, initializing services...');
            
            // Wait a bit for all scripts to load
            setTimeout(async () => {
                await waitForDataService();
                addDebugMessage('Initialization complete', 'success');
            }, 1000);
        });
    </script>
</body>
</html>
