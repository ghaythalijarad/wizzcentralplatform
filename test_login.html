<!DOCTYPE html>
<html>
<head>
    <title>Cognito Login Test</title>
</head>
<body>
    <h1>Cognito Login Test</h1>
    <form id="testForm">
        <input type="email" id="email" value="g87_a@yahoo.com" placeholder="Email" required><br><br>
        <input type="password" id="password" value="Gha@551987" placeholder="Password" required><br><br>
        <button type="submit">Test Login</button>
    </form>
    
    <div id="result"></div>
    
    <script src="config.js"></script>
    <script type="module">
        import { Amplify, Auth } from 'https://cdn.jsdelivr.net/npm/aws-amplify@6.4.7/dist/aws-amplify.esm.js';
        
        // Configure Amplify
        console.log('Config:', window.WIZZCENTRAL_CONFIG);
        
        // Load amplify_outputs.json configuration
        try {
            const response = await fetch('./amplify_outputs.json');
            const config = await response.json();
            console.log('Amplify outputs:', config);
            Amplify.configure(config);
        } catch (error) {
            console.error('Failed to load amplify outputs:', error);
        }
        
        console.log('Test page Amplify configured');
        
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            result.innerHTML = 'Testing login...';
            
            try {
                console.log('Attempting login with:', email);
                const user = await Auth.signIn(email, password);
                console.log('Login successful:', user);
                result.innerHTML = '<div style="color: green;">✅ Login successful!</div>';
                result.innerHTML += '<pre>' + JSON.stringify(user, null, 2) + '</pre>';
            } catch (error) {
                console.error('Login failed:', error);
                result.innerHTML = '<div style="color: red;">❌ Login failed: ' + error.message + '</div>';
                result.innerHTML += '<pre>' + JSON.stringify(error, null, 2) + '</pre>';
            }
        });
    </script>
</body>
</html>
