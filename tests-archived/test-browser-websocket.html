<!DOCTYPE html>
<html>
<head>
    <title>Browser WebSocket Test - WhizzDriver Chat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #e8f5e8; color: #2e7d2e; }
        .error { background: #ffe8e8; color: #d63384; }
        .info { background: #e8f4fd; color: #0c63e4; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; width: 300px; }
    </style>
</head>
<body>
    <h1>🚀 WhizzDriver WebSocket Connection Test</h1>
    <p>Testing connection to: <strong>wss://lwk0wf6rpl.execute-api.us-east-1.amazonaws.com/dev</strong></p>
    
    <div>
        <button onclick="testConnection()">🔌 Test Connection</button>
        <button onclick="clearLogs()">🧹 Clear Logs</button>
    </div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Type a message to send..." value="Hello from Flutter test!" />
        <button onclick="sendMessage()">📤 Send Message</button>
    </div>

    <h2>📋 Connection Logs:</h2>
    <div id="logs"></div>

    <script>
        let ws = null;
        let connectionAttempt = 0;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        function testConnection() {
            connectionAttempt++;
            log(`🔄 Starting connection attempt #${connectionAttempt}...`, 'info');
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('⚠️ Connection already open, closing first...', 'info');
                ws.close();
            }

            try {
                const wsUrl = 'wss://lwk0wf6rpl.execute-api.us-east-1.amazonaws.com/dev';
                log(`📡 Connecting to: ${wsUrl}`, 'info');
                
                // Create WebSocket with protocol (matching Flutter setup)
                ws = new WebSocket(wsUrl, ['chat']);
                
                ws.onopen = function(event) {
                    log('✅ WebSocket connection opened successfully!', 'success');
                    
                    // Send join channel message (matching Flutter logic)
                    const joinMessage = {
                        action: 'join_channel',
                        channel: 'driver-support',
                        driverId: 'web-test-driver-001',
                        metadata: {
                            userAgent: navigator.userAgent,
                            timestamp: new Date().toISOString()
                        }
                    };
                    
                    log(`📤 Sending join channel message: ${JSON.stringify(joinMessage)}`, 'info');
                    ws.send(JSON.stringify(joinMessage));
                };

                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        log(`📥 Received: ${JSON.stringify(data, null, 2)}`, 'success');
                    } catch (e) {
                        log(`📥 Received (raw): ${event.data}`, 'success');
                    }
                };

                ws.onerror = function(error) {
                    log(`❌ WebSocket error: ${error.message || 'Unknown error'}`, 'error');
                    console.error('WebSocket error:', error);
                };

                ws.onclose = function(event) {
                    const reason = event.reason || 'No reason provided';
                    const code = event.code;
                    log(`🔌 WebSocket closed. Code: ${code}, Reason: ${reason}, Clean: ${event.wasClean}`, 'info');
                };

            } catch (error) {
                log(`💥 Failed to create WebSocket: ${error.message}`, 'error');
                console.error('WebSocket creation error:', error);
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket not connected. Please connect first.', 'error');
                return;
            }

            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            
            if (!messageText) {
                log('⚠️ Please enter a message to send.', 'error');
                return;
            }

            const message = {
                action: 'send_message',
                message: messageText,
                timestamp: new Date().toISOString(),
                metadata: {
                    source: 'browser-test',
                    userAgent: navigator.userAgent
                }
            };

            log(`📤 Sending message: ${JSON.stringify(message)}`, 'info');
            ws.send(JSON.stringify(message));
            
            // Clear input
            messageInput.value = '';
        }

        // Auto-start connection test when page loads
        window.onload = function() {
            log('🌐 Browser WebSocket Test Initialized', 'info');
            log(`🔧 User Agent: ${navigator.userAgent}`, 'info');
            log('👆 Click "Test Connection" to start testing...', 'info');
        };

        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
