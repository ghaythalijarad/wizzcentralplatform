<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Status Update Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 1200px; }
        .section { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .warning { background: #fff3e0; border-left: 4px solid #ff9800; }
        .info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #263238; color: #ffffff; padding: 15px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; width: 200px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        .step { background: #f0f8ff; border: 1px solid #b0d4f1; border-radius: 4px; padding: 10px; margin: 10px 0; }
        .step h4 { margin-top: 0; color: #0066cc; }
    </style>
</head>
<body>
    <h1>🔧 Backend Status Update Test</h1>
    
    <div class="step">
        <h4>Step 1: Authentication</h4>
        <p>First, make sure you're logged in. Go to <a href="index.html" target="_blank">index.html</a> and log in, then come back to this page.</p>
        <button onclick="checkAuth()">🔐 Check Authentication</button>
        <div id="authStatus"></div>
    </div>

    <div class="step">
        <h4>Step 2: Load Available Merchants</h4>
        <p>Load real merchant IDs from your database to test with.</p>
        <button onclick="loadMerchants()">📋 Load Merchants</button>
        <div id="merchantsList"></div>
    </div>

    <div class="step">
        <h4>Step 3: Test Status Update</h4>
        <div class="form-group">
            <label>Merchant ID:</label>
            <select id="merchantSelect">
                <option value="">Select a merchant...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Action:</label>
            <select id="actionSelect">
                <option value="reject">Reject</option>
                <option value="approve">Approve</option>
                <option value="suspend">Suspend</option>
                <option value="review">Review</option>
                <option value="reactivate">Reactivate</option>
            </select>
        </div>
        <div class="form-group">
            <label>Reason:</label>
            <input type="text" id="reasonInput" value="Testing with enhanced error handling" style="width: 300px;">
        </div>
        <button onclick="testStatusUpdate()">🧪 Test Status Update</button>
        <div id="testResults"></div>
    </div>

    <div class="section">
        <h3>📊 Detailed Logs</h3>
        <div id="detailedLogs"></div>
    </div>

    <script src="config.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script>
        const API_BASE_URL = window.WIZZCENTRAL_CONFIG.API_BASE_URL;
        let merchants = [];
        let dynamoDB = null;

        function log(message, type = 'info', targetId = 'detailedLogs') {
            const timestamp = new Date().toLocaleTimeString();
            const target = document.getElementById(targetId);
            target.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            console.log(`[DEBUG] ${message}`);
        }

        function showCode(title, data, targetId = 'detailedLogs') {
            const target = document.getElementById(targetId);
            target.innerHTML += `
                <h4>${title}</h4>
                <pre>${typeof data === 'object' ? JSON.stringify(data, null, 2) : data}</pre>
            `;
        }

        async function checkAuth() {
            const authDiv = document.getElementById('authStatus');
            authDiv.innerHTML = '<p>Checking authentication...</p>';

            const accessToken = sessionStorage.getItem('accessToken');
            const idToken = sessionStorage.getItem('idToken');

            if (!accessToken && !idToken) {
                authDiv.innerHTML = '<div class="error">❌ Not authenticated. Please log in first.</div>';
                return false;
            }

            authDiv.innerHTML = '<div class="success">✅ Authentication tokens found!</div>';
            log('Authentication check passed', 'success');
            return true;
        }

        async function initializeAWS() {
            if (dynamoDB) return true;

            try {
                const resp = await fetch('/amplify_outputs.json');
                const outputs = await resp.json();
                
                const region = outputs.data?.aws_region || 'us-east-1';
                const identityPoolId = outputs.auth?.identity_pool_id;

                AWS.config.update({ region });
                AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                    IdentityPoolId: identityPoolId
                });

                await AWS.config.credentials.refreshPromise();
                
                dynamoDB = new AWS.DynamoDB.DocumentClient({
                    convertEmptyValues: true,
                    removeUndefinedValues: true,
                    region: region
                });
                
                return true;
            } catch (error) {
                log(`AWS initialization failed: ${error.message}`, 'error');
                return false;
            }
        }

        async function loadMerchants() {
            const merchantsDiv = document.getElementById('merchantsList');
            merchantsDiv.innerHTML = '<p>Loading merchants...</p>';

            if (!await initializeAWS()) {
                merchantsDiv.innerHTML = '<div class="error">Failed to initialize AWS</div>';
                return;
            }

            try {
                const params = {
                    TableName: 'order-receiver-businesses-dev',
                    ProjectionExpression: 'businessId, businessName, #status',
                    ExpressionAttributeNames: { '#status': 'status' }
                };

                const result = await dynamoDB.scan(params).promise();
                
                if (result.Items && result.Items.length > 0) {
                    merchants = result.Items;
                    
                    // Populate select dropdown
                    const select = document.getElementById('merchantSelect');
                    select.innerHTML = '<option value="">Select a merchant...</option>';
                    
                    merchants.forEach(merchant => {
                        select.innerHTML += `<option value="${merchant.businessId}">${merchant.businessName || 'Unknown'} (${merchant.businessId})</option>`;
                    });

                    merchantsDiv.innerHTML = `<div class="success">✅ Loaded ${merchants.length} merchants</div>`;
                    log(`Loaded ${merchants.length} merchants`, 'success');
                    
                } else {
                    merchantsDiv.innerHTML = '<div class="warning">⚠️ No merchants found</div>';
                }

            } catch (error) {
                merchantsDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                log(`Error loading merchants: ${error.message}`, 'error');
            }
        }

        async function testStatusUpdate() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<p>Testing status update...</p>';

            // Check authentication
            if (!await checkAuth()) {
                resultsDiv.innerHTML = '<div class="error">❌ Not authenticated</div>';
                return;
            }

            // Get form values
            const merchantId = document.getElementById('merchantSelect').value;
            const action = document.getElementById('actionSelect').value;
            const reason = document.getElementById('reasonInput').value;

            if (!merchantId) {
                resultsDiv.innerHTML = '<div class="error">❌ Please select a merchant</div>';
                return;
            }

            if (!reason.trim()) {
                resultsDiv.innerHTML = '<div class="error">❌ Please enter a reason</div>';
                return;
            }

            log('=== Starting status update test ===', 'info');
            log(`Merchant ID: ${merchantId}`, 'info');
            log(`Action: ${action}`, 'info');
            log(`Reason: ${reason}`, 'info');

            try {
                const accessToken = sessionStorage.getItem('accessToken') || sessionStorage.getItem('idToken');
                
                const requestBody = {
                    action: action,
                    reason: reason,
                    sendEmail: false // Don't send emails during testing
                };

                const requestUrl = `${API_BASE_URL}/merchants/${merchantId}/status`;
                
                showCode('Request Details', {
                    url: requestUrl,
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken.substring(0, 20)}...`,
                        'Content-Type': 'application/json'
                    },
                    body: requestBody
                });

                log('Sending request to backend...', 'info');

                const response = await fetch(requestUrl, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const responseText = await response.text();
                
                showCode('Response Details', {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries([...response.headers.entries()]),
                    bodyText: responseText
                });

                if (response.ok) {
                    resultsDiv.innerHTML = '<div class="success">✅ Status update successful!</div>';
                    log('Status update succeeded!', 'success');
                    
                    try {
                        const responseData = JSON.parse(responseText);
                        showCode('Success Response Data', responseData);
                    } catch (e) {
                        log('Response was not JSON', 'info');
                    }
                    
                } else {
                    resultsDiv.innerHTML = `<div class="error">❌ Status update failed: ${response.status} ${response.statusText}</div>`;
                    log(`Status update failed: ${response.status} ${response.statusText}`, 'error');
                    
                    if (response.status === 500) {
                        log('🚨 500 SERVER ERROR - Check the enhanced logs above for details', 'error');
                        
                        try {
                            const errorData = JSON.parse(responseText);
                            showCode('500 Error Response', errorData);
                        } catch (e) {
                            log('500 error response was not JSON', 'warning');
                        }
                    }
                }

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Request failed: ${error.message}</div>`;
                log(`Request error: ${error.message}`, 'error');
                showCode('Exception Details', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack
                });
            }

            log('=== Status update test completed ===', 'info');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('Status update test tool initialized', 'info');
            log(`API Base URL: ${API_BASE_URL}`, 'info');
        });
    </script>
</body>
</html>
