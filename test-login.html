<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - WizzCentral</title>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.12/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
    <h1>Login Test</h1>
    <form id="loginForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="G87_a@yahoo.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="Gha@551987" required>
        </div>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    <div id="tokens"></div>
    
    <button onclick="testMerchants()">Test Merchants Page</button>
    
    <script>
        // Configuration from amplify_outputs.json
        const cognitoConfig = {
            userPoolId: 'us-east-1_aX8X9oQTV',
            clientId: '3u9frkvcn18lidj5dpm1a94mf2'
        };
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const tokensDiv = document.getElementById('tokens');
            
            try {
                const poolData = {
                    UserPoolId: cognitoConfig.userPoolId,
                    ClientId: cognitoConfig.clientId
                };
                
                const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
                
                const userData = {
                    Username: email,
                    Pool: userPool
                };
                
                const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
                
                const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails({
                    Username: email,
                    Password: password
                });
                
                cognitoUser.authenticateUser(authenticationDetails, {
                    onSuccess: function(result) {
                        const accessToken = result.getAccessToken().getJwtToken();
                        const idToken = result.getIdToken().getJwtToken();
                        const refreshToken = result.getRefreshToken().getToken();
                        
                        // Store tokens in sessionStorage
                        sessionStorage.setItem('accessToken', accessToken);
                        sessionStorage.setItem('idToken', idToken);
                        sessionStorage.setItem('refreshToken', refreshToken);
                        sessionStorage.setItem('userEmail', email);
                        
                        resultDiv.innerHTML = '<p style="color: green;">✅ Login successful!</p>';
                        tokensDiv.innerHTML = `
                            <h3>Tokens stored in sessionStorage:</h3>
                            <p><strong>Access Token:</strong> ${accessToken.substring(0, 50)}...</p>
                            <p><strong>ID Token:</strong> ${idToken.substring(0, 50)}...</p>
                            <p><strong>Refresh Token:</strong> ${refreshToken.substring(0, 50)}...</p>
                        `;
                    },
                    onFailure: function(err) {
                        resultDiv.innerHTML = `<p style="color: red;">❌ Login failed: ${err.message}</p>`;
                        console.error('Login failed:', err);
                    }
                });
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
                console.error('Error:', error);
            }
        });
        
        function testMerchants() {
            window.open('merchants.html', '_blank');
        }
    </script>
</body>
</html>
