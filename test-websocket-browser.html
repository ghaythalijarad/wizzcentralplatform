<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Connection Test</title>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    <button onclick="sendTestMessage()">Send Test Message</button>

    <script>
        const ws = new WebSocket('wss://0fs1zdwyzf.execute-api.us-east-1.amazonaws.com/dev?userType=support&agentId=browser-test&businessId=7ccf646c-9594-48d4-8f63-c366d89257e5');
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');

        ws.onopen = function() {
            statusDiv.innerHTML = '✅ Connected';
            addMessage('Connected to WebSocket');
            
            // Send agent connect
            ws.send(JSON.stringify({
                type: 'chat_agent_connect',
                agentId: 'browser-test-' + Date.now(),
                agentName: 'Browser Test Agent'
            }));
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            addMessage('📨 Received: ' + data.type + ' - ' + JSON.stringify(data));
            
            if (data.type === 'chat_message') {
                addMessage('🎉 SUCCESS! Chat message received: ' + (data.message?.text || data.messageText));
            }
        };

        ws.onclose = function(event) {
            statusDiv.innerHTML = '❌ Disconnected: ' + event.code;
            addMessage('Disconnected: ' + event.code + ' ' + event.reason);
        };

        ws.onerror = function(error) {
            statusDiv.innerHTML = '❌ Error';
            addMessage('Error: ' + error);
        };

        function addMessage(msg) {
            const div = document.createElement('div');
            div.innerHTML = new Date().toLocaleTimeString() + ' - ' + msg;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendTestMessage() {
            fetch('https://yt0j2cdbe5.execute-api.us-east-1.amazonaws.com/dev/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    participantToken: 'browser_test',
                    message: '🧪 Browser WebSocket Test: This message is sent from the browser test page to verify the complete flow.',
                    metadata: {
                        senderId: 'unknown_driver_browser_test',
                        senderType: 'driver',
                        senderName: 'Browser Test Driver',
                        platform: 'flutter',
                        source: 'http_api'
                    }
                })
            }).then(r => r.json()).then(data => {
                addMessage('📤 HTTP Response: ' + JSON.stringify(data));
            });
        }
    </script>
</body>
</html>
