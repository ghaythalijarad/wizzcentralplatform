<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Merchant Edit Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .success { background: #d4edda; padding: 10px; border-radius: 4px; color: #155724; margin: 10px 0; }
        .error { background: #f8d7da; padding: 10px; border-radius: 4px; color: #721c24; margin: 10px 0; }
        .info { background: #d1ecf1; padding: 10px; border-radius: 4px; color: #0c5460; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        .form-group { margin: 15px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Quick Merchant Edit Test</h1>
        <p>This tests the merchant editing functionality with the current configuration.</p>

        <div id="status" class="info">
            <strong>Status:</strong> Ready to test
        </div>

        <div class="form-group">
            <label>Test Merchant ID:</label>
            <input type="text" id="merchantId" placeholder="Enter merchant business ID">
            <small>Use a valid businessId from your DynamoDB table</small>
        </div>

        <div class="form-group">
            <label>New Business Name:</label>
            <input type="text" id="businessName" placeholder="Enter new business name">
        </div>

        <div class="form-group">
            <label>New Email:</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="form-group">
            <label>New Phone:</label>
            <input type="tel" id="phoneNumber" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label>Business Type:</label>
            <select id="businessType">
                <option value="restaurant">Restaurant</option>
                <option value="store">Store</option>
                <option value="cafe">Cafe</option>
                <option value="cloudkitchen">Cloud Kitchen</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="retail">Retail</option>
            </select>
        </div>

        <button onclick="testMerchantUpdate()">Test Merchant Update</button>
        <button onclick="simulateFormSubmission()">Simulate Form Submission</button>

        <div id="result"></div>
    </div>

    <!-- Load configuration and merchant functions -->
    <script src="config.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="merchants.js"></script>

    <script>
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = type;
            status.innerHTML = `<strong>Status:</strong> ${message}`;
        }

        function showResult(message, type = 'info') {
            const result = document.getElementById('result');
            result.className = type;
            result.innerHTML = message;
        }

        async function testMerchantUpdate() {
            const merchantId = document.getElementById('merchantId').value.trim();
            const businessName = document.getElementById('businessName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const businessType = document.getElementById('businessType').value;

            if (!merchantId) {
                showResult('Please enter a merchant ID', 'error');
                return;
            }

            if (!businessName) {
                showResult('Please enter a business name', 'error');
                return;
            }

            updateStatus('Testing merchant update...');
            
            try {
                // Prepare update data using exact DynamoDB field names
                const updateData = {
                    businessName: businessName,
                    updatedAt: new Date().toISOString()
                };

                if (email) updateData.email = email;
                if (phoneNumber) updateData.phoneNumber = phoneNumber;
                if (businessType) updateData.businessType = businessType;

                console.log('Testing merchant update with data:', updateData);

                // Call the function from merchants.js
                const result = await submitMerchantUpdate(merchantId, updateData);
                
                if (result.success) {
                    updateStatus('✅ Update successful!', 'success');
                    showResult('Merchant updated successfully!', 'success');
                } else {
                    updateStatus('❌ Update failed', 'error');
                    showResult(`Update failed: ${result.error}`, 'error');
                }

            } catch (error) {
                updateStatus('❌ Test failed', 'error');
                showResult(`Test failed: ${error.message}`, 'error');
                console.error('Test error:', error);
            }
        }

        async function simulateFormSubmission() {
            const merchantId = document.getElementById('merchantId').value.trim();
            
            if (!merchantId) {
                showResult('Please enter a merchant ID', 'error');
                return;
            }

            updateStatus('Simulating form submission...');

            try {
                // Create a mock form data object
                const mockFormData = new FormData();
                mockFormData.append('businessName', document.getElementById('businessName').value);
                mockFormData.append('email', document.getElementById('email').value);
                mockFormData.append('phoneNumber', document.getElementById('phoneNumber').value);
                mockFormData.append('businessType', document.getElementById('businessType').value);

                // Create a mock form element
                const mockForm = {
                    getAttribute: (attr) => attr === 'data-merchant-id' ? merchantId : null
                };

                // Simulate the form data collection
                const formData = collectEditFormData({ 
                    getAttribute: () => '',
                    get: (name) => document.getElementById(name)?.value || ''
                });

                console.log('Collected form data:', formData);

                // Validate the data
                const validation = validateEditFormData(formData);
                
                if (!validation.isValid) {
                    updateStatus('❌ Validation failed', 'error');
                    showResult(`Validation errors: ${validation.errors.join(', ')}`, 'error');
                    return;
                }

                // Submit the update
                const result = await submitMerchantUpdate(merchantId, formData);
                
                if (result.success) {
                    updateStatus('✅ Form submission successful!', 'success');
                    showResult('Form submission completed successfully!', 'success');
                } else {
                    updateStatus('❌ Form submission failed', 'error');
                    showResult(`Form submission failed: ${result.error}`, 'error');
                }

            } catch (error) {
                updateStatus('❌ Simulation failed', 'error');
                showResult(`Simulation failed: ${error.message}`, 'error');
                console.error('Simulation error:', error);
            }
        }

        // Enhanced form data collection for testing
        function collectEditFormData(mockForm) {
            const data = {};
            
            // Map form fields to exact DynamoDB field names
            const businessName = document.getElementById('businessName').value?.trim();
            if (businessName) data.businessName = businessName;
            
            const email = document.getElementById('email').value?.trim();
            if (email) data.email = email;
            
            const phoneNumber = document.getElementById('phoneNumber').value?.trim();
            if (phoneNumber) data.phoneNumber = phoneNumber;
            
            const businessType = document.getElementById('businessType').value;
            if (businessType) data.businessType = businessType;
            
            // Add updatedAt timestamp
            data.updatedAt = new Date().toISOString();
            
            return data;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Ready to test merchant editing functionality');
            console.log('Quick test tool loaded');
            console.log('API_BASE_URL:', window.WIZZCENTRAL_CONFIG?.API_BASE_URL);
        });
    </script>
</body>
</html>
