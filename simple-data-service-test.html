<!DOCTYPE html>
<html>
<head>
    <title>Simple Data Service Test</title>
</head>
<body>
    <h1>Data Service Test</h1>
    <div id="status">Testing...</div>
    <pre id="results"></pre>

    <!-- AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <!-- App Configuration -->
    <script src="config.js"></script>
    <!-- Data Service -->
    <script src="data-service.js"></script>
    
    <script>
        async function testDataService() {
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            
            try {
                statusEl.textContent = 'Checking if data service exists...';
                console.log('window.dataService:', window.dataService);
                
                if (!window.dataService) {
                    throw new Error('Data service not found on window object');
                }
                
                statusEl.textContent = 'Initializing data service...';
                await window.dataService.initialize();
                
                statusEl.textContent = 'Getting users...';
                const users = await window.dataService.getUsers();
                
                statusEl.textContent = `Success! Found ${users.length} users`;
                resultsEl.textContent = JSON.stringify(users, null, 2);
                
            } catch (error) {
                statusEl.textContent = `Error: ${error.message}`;
                resultsEl.textContent = `Error details:\n${JSON.stringify(error, null, 2)}\n\nStack:\n${error.stack}`;
                console.error('Data service test failed:', error);
            }
        }
        
        // Run test when page loads
        window.onload = () => {
            console.log('Page loaded, starting test...');
            testDataService();
        };
    </script>
</body>
</html>
