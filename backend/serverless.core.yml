# Core services: Authentication, Users, Basic Functions
service: wizzcentral-core

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    USERS_TABLE: "WizzUser_users_${self:provider.stage}"
    COGNITO_USER_POOL_ID: us-east-1_aX8X9oQTV
    COGNITO_USER_POOL_ARN: arn:aws:cognito-idp:us-east-1:109804294167:userpool/us-east-1_aX8X9oQTV
    COGNITO_JWKS_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_aX8X9oQTV/.well-known/jwks.json
    COGNITO_CLIENT_ID: 3u9frkvcn18lidj5dpm1a94mf2
    COGNITO_CLIENT_SECRET: h017ovuq5gv490hgtisr9sj33gq2c3tlvubrutl2v6to765k6o
    COGNITO_REGION: us-east-1
    JWT_SECRET: ${env:JWT_SECRET, 'wizzcentral-super-secret-key-2024'}
    
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:ListUsers
          Resource: "arn:aws:cognito-idp:us-east-1:109804294167:userpool/us-east-1_aX8X9oQTV"

functions:
  # Authentication Functions
  login:
    handler: src/handlers/auth.login
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  getUser:
    handler: src/handlers/auth.getUser
    events:
      - http:
          path: auth/user
          method: get
          cors: true
          
  register:
    handler: src/handlers/auth.register
    events:
      - http:
          path: auth/register
          method: post
          cors: true
          
  refreshToken:
    handler: src/handlers/auth.refreshToken
    events:
      - http:
          path: auth/refresh
          method: post
          cors: true
          
  initiatePasswordReset:
    handler: src/handlers/auth.initiatePasswordReset
    events:
      - http:
          path: auth/forgot-password
          method: post
          cors: true
          
  confirmPasswordReset:
    handler: src/handlers/auth.confirmPasswordReset
    events:
      - http:
          path: auth/reset-password
          method: post
          cors: true
          
  changePassword:
    handler: src/handlers/auth.changePassword
    events:
      - http:
          path: auth/change-password
          method: post
          cors: true
          authorizer: authorize

  # User Management
  getProfile:
    handler: src/handlers/users.getProfile
    events:
      - http:
          path: users/profile
          method: get
          cors: true
          authorizer: authorize
          
  updateProfile:
    handler: src/handlers/users.updateProfile
    events:
      - http:
          path: users/profile
          method: put
          cors: true
          authorizer: authorize

  # Authorization Function
  authorize:
    handler: src/handlers/auth.authorize

  # Hello World Function
  hello:
    handler: src/handlers/hello.hello
    events:
      - http:
          path: hello
          method: get
          cors: true

plugins:
  - serverless-offline
