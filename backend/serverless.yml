service: wizzcentral-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    USERS_TABLE: "WizzUser_users_${self:provider.stage}"
    MERCHANTS_TABLE: "order-receiver-businesses-${self:provider.stage}"
    DRIVERS_TABLE: "${self:service}-drivers-${self:provider.stage}"
    CUSTOMERS_TABLE: "WizzUser_users_${self:provider.stage}"
    ORDERS_TABLE: "order-receiver-orders-${self:provider.stage}"
    PROMOTIONS_TABLE: "WizzCentral_promotions-${self:provider.stage}"
    PROMOTION_USAGE_TABLE: "${self:service}-promotion-usage-${self:provider.stage}"
    SUPPORT_TICKETS_TABLE: "${self:service}-support-tickets-${self:provider.stage}"
    FAQS_TABLE: "${self:service}-faqs-${self:provider.stage}"
    KNOWLEDGE_BASE_TABLE: "${self:service}-knowledge-base-${self:provider.stage}"
    COGNITO_USER_POOL_ID: us-east-1_aX8X9oQTV
    COGNITO_USER_POOL_ARN: arn:aws:cognito-idp:us-east-1:109804294167:userpool/us-east-1_aX8X9oQTV
    COGNITO_JWKS_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_aX8X9oQTV/.well-known/jwks.json
    COGNITO_CLIENT_ID: 3u9frkvcn18lidj5dpm1a94mf2
    COGNITO_CLIENT_SECRET: h017ovuq5gv490hgtisr9sj33gq2c3tlvubrutl2v6to765k6o
    COGNITO_REGION: us-east-1
    JWT_SECRET: ${env:JWT_SECRET, 'wizzcentral-super-secret-key-2024'}
    NOTIFICATIONS_TABLE: "${self:service}-notifications-${self:provider.stage}"
    
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/order-receiver-discounts-dev"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::wizzcentral-uploads-${self:provider.stage}/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:ListUsers
          Resource: "arn:aws:cognito-idp:us-east-1:109804294167:userpool/us-east-1_aX8X9oQTV"

functions:
  # Authentication Functions
  login:
    handler: src/handlers/auth.login
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  getUser:
    handler: src/handlers/auth.getUser
    events:
      - http:
          path: auth/user
          method: get
          cors: true
          
  register:
    handler: src/handlers/auth.register
    events:
      - http:
          path: auth/register
          method: post
          cors: true
          
  refreshToken:
    handler: src/handlers/auth.refreshToken
    events:
      - http:
          path: auth/refresh
          method: post
          cors: true
          
  initiatePasswordReset:
    handler: src/handlers/auth.initiatePasswordReset
    events:
      - http:
          path: auth/forgot-password
          method: post
          cors: true
          
  confirmPasswordReset:
    handler: src/handlers/auth.confirmPasswordReset
    events:
      - http:
          path: auth/reset-password
          method: post
          cors: true
          
  changePassword:
    handler: src/handlers/auth.changePassword
    events:
      - http:
          path: auth/change-password
          method: post
          cors: true
          authorizer: authorize

  # User Management
  getProfile:
    handler: src/handlers/users.getProfile
    events:
      - http:
          path: users/profile
          method: get
          cors: true
          authorizer: authorize
          
  updateProfile:
    handler: src/handlers/users.updateProfile
    events:
      - http:
          path: users/profile
          method: put
          cors: true
          authorizer: authorize

