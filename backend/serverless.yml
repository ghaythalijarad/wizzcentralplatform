service: wizzcentral-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    USERS_TABLE: "WizzUser_users_${self:provider.stage}"
    MERCHANTS_TABLE: "order-receiver-businesses-${self:provider.stage}"
    DRIVERS_TABLE: "${self:service}-drivers-${self:provider.stage}"
    CUSTOMERS_TABLE: "WizzUser_users_${self:provider.stage}"
    ORDERS_TABLE: "order-receiver-orders-${self:provider.stage}"
    PROMOTIONS_TABLE: "order-receiver-discounts-${self:provider.stage}"
    PROMOTION_USAGE_TABLE: "${self:service}-promotion-usage-${self:provider.stage}"
    SUPPORT_TICKETS_TABLE: "${self:service}-support-tickets-${self:provider.stage}"
    FAQS_TABLE: "${self:service}-faqs-${self:provider.stage}"
    KNOWLEDGE_BASE_TABLE: "${self:service}-knowledge-base-${self:provider.stage}"
    COGNITO_USER_POOL_ID: us-east-1_aX8X9oQTV
    COGNITO_USER_POOL_ARN: arn:aws:cognito-idp:us-east-1:109804294167:userpool/us-east-1_aX8X9oQTV
    COGNITO_JWKS_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_aX8X9oQTV/.well-known/jwks.json
    COGNITO_CLIENT_ID: 3u9frkvcn18lidj5dpm1a94mf2
    COGNITO_CLIENT_SECRET: h017ovuq5gv490hgtisr9sj33gq2c3tlvubrutl2v6to765k6o
    COGNITO_REGION: us-east-1
    JWT_SECRET: ${env:JWT_SECRET, 'wizzcentral-super-secret-key-2024'}
    
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/order-receiver-discounts-dev"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::wizzcentral-uploads-${self:provider.stage}/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:ListUsers
          Resource: "arn:aws:cognito-idp:us-east-1:109804294167:userpool/us-east-1_aX8X9oQTV"

functions:
  # Authentication Functions
  login:
    handler: src/handlers/auth.login
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  getUser:
    handler: src/handlers/auth.getUser
    events:
      - http:
          path: auth/user
          method: get
          cors: true
          
  register:
    handler: src/handlers/auth.register
    events:
      - http:
          path: auth/register
          method: post
          cors: true
          
  refreshToken:
    handler: src/handlers/auth.refreshToken
    events:
      - http:
          path: auth/refresh
          method: post
          cors: true
          
  initiatePasswordReset:
    handler: src/handlers/auth.initiatePasswordReset
    events:
      - http:
          path: auth/forgot-password
          method: post
          cors: true
          
  confirmPasswordReset:
    handler: src/handlers/auth.confirmPasswordReset
    events:
      - http:
          path: auth/reset-password
          method: post
          cors: true
          
  changePassword:
    handler: src/handlers/auth.changePassword
    events:
      - http:
          path: auth/change-password
          method: post
          cors: true
          authorizer: authorize

  # User Management
  getProfile:
    handler: src/handlers/users.getProfile
    events:
      - http:
          path: users/profile
          method: get
          cors: true
          authorizer: authorize
          
  updateProfile:
    handler: src/handlers/users.updateProfile
    events:
      - http:
          path: users/profile
          method: put
          cors: true
          authorizer: authorize

  # Merchant Management
  getMerchants:
    handler: src/handlers/merchants.getMerchants
    events:
      - http:
          path: merchants
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  createMerchant:
    handler: src/handlers/merchants.createMerchant
    events:
      - http:
          path: merchants
          method: post
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  getMerchant:
    handler: src/handlers/merchants.getMerchant
    events:
      - http:
          path: merchants/{merchantId}
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  updateMerchant:
    handler: src/handlers/merchants.updateMerchant
    events:
      - http:
          path: merchants/{merchantId}
          method: put
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  updateMerchantStatus:
    handler: src/handlers/merchants.updateMerchantStatus
    events:
      - http:
          path: merchants/{merchantId}/status
          method: patch
          cors: true
          # Temporarily remove authorizer for testing "Load failed" error
          # authorizer: authorize

  # Driver Management
  getDrivers:
    handler: src/handlers/drivers.getDrivers
    events:
      - http:
          path: drivers
          method: get
          cors: true
          authorizer: authorize
          
  createDriver:
    handler: src/handlers/drivers.createDriver
    events:
      - http:
          path: drivers
          method: post
          cors: true
          authorizer: authorize
          
  getDriver:
    handler: src/handlers/drivers.getDriver
    events:
      - http:
          path: drivers/{driverId}
          method: get
          cors: true
          authorizer: authorize
          
  updateDriver:
    handler: src/handlers/drivers.updateDriver
    events:
      - http:
          path: drivers/{driverId}
          method: put
          cors: true
          authorizer: authorize

  # Customer Management
  getCustomers:
    handler: src/handlers/customers.getCustomers
    events:
      - http:
          path: customers
          method: get
          cors: true
          authorizer: authorize
          
  getCustomer:
    handler: src/handlers/customers.getCustomer
    events:
      - http:
          path: customers/{customerId}
          method: get
          cors: true
          authorizer: authorize

  # Order Management
  listOrders:
    handler: src/handlers/orders.listOrders
    events:
      - http:
          path: orders
          method: get
          cors: true
          authorizer: authorize
          
  createOrder:
    handler: src/handlers/orders.createOrder
    events:
      - http:
          path: orders
          method: post
          cors: true
          authorizer: authorize
          
  getOrder:
    handler: src/handlers/orders.getOrder
    events:
      - http:
          path: orders/{orderId}
          method: get
          cors: true
          authorizer: authorize
          
  updateOrder:
    handler: src/handlers/orders.updateOrder
    events:
      - http:
          path: orders/{orderId}
          method: put
          cors: true
          authorizer: authorize
          
  cancelOrder:
    handler: src/handlers/orders.cancelOrder
    events:
      - http:
          path: orders/{orderId}/cancel
          method: post
          cors: true
          authorizer: authorize
          
  getCustomerOrders:
    handler: src/handlers/orders.getCustomerOrders
    events:
      - http:
          path: customers/{customerId}/orders
          method: get
          cors: true
          authorizer: authorize
          
  getMerchantOrders:
    handler: src/handlers/orders.getMerchantOrders
    events:
      - http:
          path: merchants/{merchantId}/orders
          method: get
          cors: true
          authorizer: authorize
          
  getDriverOrders:
    handler: src/handlers/orders.getDriverOrders
    events:
      - http:
          path: drivers/{driverId}/orders
          method: get
          cors: true
          authorizer: authorize

  # Promotion Management
  listPromotions:
    handler: src/handlers/promotions.listPromotions
    events:
      - http:
          path: promotions
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  createPromotion:
    handler: src/handlers/promotions.createPromotion
    events:
      - http:
          path: promotions
          method: post
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  getPromotion:
    handler: src/handlers/promotions.getPromotion
    events:
      - http:
          path: promotions/{promotionId}
          method: get
          cors: true
          authorizer: authorize
          
  updatePromotion:
    handler: src/handlers/promotions.updatePromotion
    events:
      - http:
          path: promotions/{promotionId}
          method: put
          cors: true
          authorizer: authorize
          
  deletePromotion:
    handler: src/handlers/promotions.deletePromotion
    events:
      - http:
          path: promotions/{promotionId}
          method: delete
          cors: true
          authorizer: authorize
          
  validatePromotionCode:
    handler: src/handlers/promotions.validatePromotionCode
    events:
      - http:
          path: promotions/validate
          method: post
          cors: true
          authorizer: authorize
          
  applyPromotion:
    handler: src/handlers/promotions.applyPromotion
    events:
      - http:
          path: promotions/{promotionId}/apply
          method: post
          cors: true
          authorizer: authorize
          
  getPromotionAnalytics:
    handler: src/handlers/promotions.getPromotionAnalytics
    events:
      - http:
          path: promotions/{promotionId}/analytics
          method: get
          cors: true
          authorizer: authorize

  # Support Management - Tickets
  listTickets:
    handler: src/handlers/support.listTickets
    events:
      - http:
          path: support/tickets
          method: get
          cors: true
          authorizer: authorize
          
  createTicket:
    handler: src/handlers/support.createTicket
    events:
      - http:
          path: support/tickets
          method: post
          cors: true
          authorizer: authorize
          
  getTicket:
    handler: src/handlers/support.getTicket
    events:
      - http:
          path: support/tickets/{ticketId}
          method: get
          cors: true
          authorizer: authorize
          
  updateTicket:
    handler: src/handlers/support.updateTicket
    events:
      - http:
          path: support/tickets/{ticketId}
          method: put
          cors: true
          authorizer: authorize
          
  addMessage:
    handler: src/handlers/support.addMessage
    events:
      - http:
          path: support/tickets/{ticketId}/messages
          method: post
          cors: true
          authorizer: authorize

  # Support Management - FAQs
  listFAQs:
    handler: src/handlers/support.listFAQs
    events:
      - http:
          path: support/faqs
          method: get
          cors: true
          
  createFAQ:
    handler: src/handlers/support.createFAQ
    events:
      - http:
          path: support/faqs
          method: post
          cors: true
          authorizer: authorize
          
  getFAQ:
    handler: src/handlers/support.getFAQ
    events:
      - http:
          path: support/faqs/{faqId}
          method: get
          cors: true
          
  updateFAQ:
    handler: src/handlers/support.updateFAQ
    events:
      - http:
          path: support/faqs/{faqId}
          method: put
          cors: true
          authorizer: authorize
          
  deleteFAQ:
    handler: src/handlers/support.deleteFAQ
    events:
      - http:
          path: support/faqs/{faqId}
          method: delete
          cors: true
          authorizer: authorize

  # Support Management - Knowledge Base
  listKnowledgeBase:
    handler: src/handlers/support.listKnowledgeBase
    events:
      - http:
          path: support/knowledge-base
          method: get
          cors: true
          
  createKnowledgeBase:
    handler: src/handlers/support.createKnowledgeBase
    events:
      - http:
          path: support/knowledge-base
          method: post
          cors: true
          authorizer: authorize
          
  getKnowledgeBase:
    handler: src/handlers/support.getKnowledgeBase
    events:
      - http:
          path: support/knowledge-base/{articleId}
          method: get
          cors: true
          
  updateKnowledgeBase:
    handler: src/handlers/support.updateKnowledgeBase
    events:
      - http:
          path: support/knowledge-base/{articleId}
          method: put
          cors: true
          authorizer: authorize
          
  deleteKnowledgeBase:
    handler: src/handlers/support.deleteKnowledgeBase
    events:
      - http:
          path: support/knowledge-base/{articleId}
          method: delete
          cors: true
          authorizer: authorize

  # Product Management
  getCategories:
    handler: src/handlers/products.getCategories
    events:
      - http:
          path: categories
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  getProducts:
    handler: src/handlers/products.getProducts
    events:
      - http:
          path: products
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  getProduct:
    handler: src/handlers/products.getProduct
    events:
      - http:
          path: products/{productId}
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  getProductsByMerchant:
    handler: src/handlers/products.getProductsByBusiness
    events:
      - http:
          path: merchants/{merchantId}/products
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing

  # Analytics & Dashboard
  getDashboardStats:
    handler: src/handlers/analytics.getDashboardStats
