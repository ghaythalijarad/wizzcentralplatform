    events:
      - http:
          path: merchants/{merchantId}
          method: get
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  updateMerchant:
    handler: src/handlers/merchants.updateMerchant
    events:
      - http:
          path: merchants/{merchantId}
          method: put
          cors: true
          # authorizer: authorize  # Temporarily disabled for testing
          
  updateMerchantStatus:
    handler: src/handlers/merchants.updateMerchantStatus
    events:
      - http:
          path: merchants/{merchantId}/status
          method: patch
          cors: true
          # Temporarily remove authorizer for testing "Load failed" error
          # authorizer: authorize

  # Product Management
  getProductsByMerchant:
    handler: src/handlers/products.getProductsByMerchant
    events:
      - http:
          path: merchants/{merchantId}/products
          method: get
          cors: true
          # authorizer: authorize # Add auth later

  updateProduct:
    handler: src/handlers/products.updateProduct
    events:
      - http:
          path: merchants/{merchantId}/products/{productId}
          method: put
          cors: true
          # authorizer: authorize # Add auth later

  # Driver Management
  getDrivers:
    handler: src/handlers/drivers.getDrivers
    events:
      - http:
          path: drivers
          method: get
          cors: true
          authorizer: authorize
          
  createDriver:
    handler: src/handlers/drivers.createDriver
    events:
      - http:
          path: drivers
          method: post
          cors: true
          authorizer: authorize
          
  getDriver:
    handler: src/handlers/drivers.getDriver
    events:
