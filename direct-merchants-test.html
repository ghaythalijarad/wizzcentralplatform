<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Merchants JS Test</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <h1>Direct Merchants.js Test</h1>
    
    <div id="status" style="padding: 20px; background: #f0f0f0; margin: 20px 0; border-radius: 8px;"></div>
    
    <!-- Copy the exact table structure from merchants.html -->
    <div class="table-container">
        <div id="merchants-table-status"></div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Business</th>
                    <th>Owner</th>
                    <th>Status</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="merchantsTableBody">
                <tr>
                    <td colspan="7" style="text-align: center;">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Status Update Modal -->
    <div id="statusModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="modal-content" style="background:white; padding:1rem; border-radius:8px; max-width:400px; width:90%; position:relative;">
            <button onclick="closeModal('statusModal')" style="position:absolute; top:8px; right:8px; background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
            <h3 style="margin-bottom: 1rem;">Update Merchant Status</h3>
            <div id="statusModalBody"></div>
            <div style="margin-top:1rem; text-align:right;">
                <button class="btn-secondary" onclick="closeModal('statusModal')" style="margin-right: 0.5rem;">Cancel</button>
                <button class="btn-primary" onclick="updateMerchantStatus()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- View Merchant Details Modal -->
    <div id="viewMerchantModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="modal-content" style="background:white; padding:1rem; border-radius:8px; max-width:600px; width:90%; position:relative;">
            <button onclick="closeModal('viewMerchantModal')" style="position:absolute; top:8px; right:8px; background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
            <h3 style="margin-bottom: 1rem;">Merchant Details</h3>
            <div id="merchantDetailsBody"></div>
            <div style="margin-top:1rem; text-align:right;">
                <button class="btn-primary" onclick="closeModal('viewMerchantModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            statusDiv.style.backgroundColor = type === 'error' ? '#ffe6e6' : type === 'success' ? '#e6ffe6' : '#f0f0f0';
            console.log(message);
        }

        updateStatus('Loading AWS SDK...', 'info');
    </script>

    <!-- Load AWS SDK first -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script>
        updateStatus('AWS SDK loaded: ' + (typeof AWS !== 'undefined'), 'info');
        
        // Override logout function early
        window.logout = () => {
            updateStatus('Logout clicked', 'info');
            alert('Logout function called');
        };
    </script>

    <!-- Load config -->
    <script src="config.js"></script>
    <script>
        updateStatus('Config loaded: ' + (typeof window.WIZZCENTRAL_CONFIG !== 'undefined'), 'info');
        
        // Mock dashboard functions to prevent errors
        window.initializeDashboard = function() {
            updateStatus('Mock initializeDashboard called', 'info');
        };
        
        // Mock authentication check
        window.checkAuthentication = function() {
            updateStatus('Mock checkAuthentication called - returning true', 'info');
            return true;
        };
    </script>

    <!-- Load merchants.js directly -->
    <script src="merchants.js"></script>
    <script>
        updateStatus('Merchants.js loaded', 'success');
        
        // Monitor table changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.target.id === 'merchantsTableBody') {
                    updateStatus('Table body changed! New content: ' + mutation.target.innerHTML.substring(0, 50) + '...', 'success');
                }
            });
        });
        
        const tbody = document.getElementById('merchantsTableBody');
        if (tbody) {
            observer.observe(tbody, { childList: true, subtree: true });
            updateStatus('Table body observer set up', 'info');
        } else {
            updateStatus('ERROR: Table body not found!', 'error');
        }
    </script>
</body>
</html>
