<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: lightblue;
        }
        .test-box {
            background: white;
            padding: 20px;
            margin: 10px;
            border: 2px solid black;
        }
        .sidebar-test {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: blue;
            color: white;
            padding: 20px;
        }
        .main-test {
            margin-left: 300px;
            background: yellow;
            padding: 20px;
            min-height: 400px;
        }
    </style>
</head>
<body>
    <h1>Minimal Layout Test</h1>
    
    <div class="test-box">
        <h2>This is a basic test box</h2>
        <p>If you can see this, basic HTML/CSS is working</p>
    </div>
    
    <div class="sidebar-test">
        <h3>Sidebar</h3>
        <p>This should be on the left</p>
    </div>
    
    <div class="main-test">
        <h3>Main Content</h3>
        <p>This should be on the right with margin</p>
        
        <div class="test-box">
            <h4>Nested content</h4>
            <p>Stats cards would go here</p>
        </div>
        
        <div class="test-box">
            <h4>Another section</h4>
            <p>More dashboard content here</p>
        </div>
    </div>
    
    <script>
        console.log('Page loaded');
        console.log('Window size:', window.innerWidth, 'x', window.innerHeight);
        
        // Check if elements are visible
        const elements = ['test-box', 'sidebar-test', 'main-test'];
        elements.forEach(className => {
            const el = document.querySelector('.' + className);
            if (el) {
                const style = window.getComputedStyle(el);
                console.log(`${className}:`, {
                    display: style.display,
                    visibility: style.visibility,
                    width: style.width,
                    height: style.height
                });
            }
        });
    </script>
</body>
</html>
