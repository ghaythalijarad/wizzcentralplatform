<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Data Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Data Service Debug Page</h1>
    <div id="results"></div>
    <button onclick="runTests()">Run Tests</button>

    <!-- Scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="config.js"></script>
    <script src="data-service.js"></script>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }

        async function runTests() {
            document.getElementById('results').innerHTML = '';
            
            try {
                // Test 1: Check if AWS SDK is loaded
                log('Test 1: Checking AWS SDK...', 'info');
                if (typeof AWS === 'undefined') {
                    log('❌ AWS SDK not loaded', 'error');
                    return;
                }
                log('✅ AWS SDK loaded successfully', 'success');

                // Test 2: Check if config is loaded
                log('Test 2: Checking configuration...', 'info');
                if (!window.WIZZCENTRAL_CONFIG) {
                    log('❌ Configuration not loaded', 'error');
                    return;
                }
                log('✅ Configuration loaded successfully', 'success');
                log(`Config details: ${JSON.stringify(window.WIZZCENTRAL_CONFIG, null, 2)}`, 'info');

                // Test 3: Check if data service is available
                log('Test 3: Checking data service...', 'info');
                if (!window.dataService) {
                    log('❌ Data service not available', 'error');
                    return;
                }
                log('✅ Data service instance found', 'success');

                // Test 4: Initialize data service
                log('Test 4: Initializing data service...', 'info');
                await window.dataService.initialize();
                log('✅ Data service initialized successfully', 'success');

                // Test 5: Test table access
                log('Test 5: Testing table access...', 'info');
                const usersCount = await window.dataService.getTableStats('WizzUser_users_dev');
                log(`✅ Users table accessible: ${usersCount} records`, 'success');

                const businessesCount = await window.dataService.getTableStats('order-receiver-businesses-dev');
                log(`✅ Businesses table accessible: ${businessesCount} records`, 'success');

                // Test 6: Get all stats
                log('Test 6: Getting all statistics...', 'info');
                const stats = await window.dataService.getAllStats();
                log(`✅ All stats retrieved: ${JSON.stringify(stats, null, 2)}`, 'success');

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                log(`Stack trace: ${error.stack}`, 'error');
            }
        }

        // Auto-run tests on page load
        window.addEventListener('load', () => {
            setTimeout(runTests, 1000);
        });
    </script>
</body>
</html>
