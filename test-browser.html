<!DOCTYPE html>
<html>
<head>
    <title>Test Cognito Authentication</title>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
    <h1>Cognito Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="output"></div>

    <script>
        async function testLogin() {
            const output = document.getElementById('output');
            output.innerHTML = 'Testing...';
            
            try {
                // Load config
                const response = await fetch('./amplify_outputs.json');
                const config = await response.json();
                console.log('Config loaded:', config);
                
                const poolData = {
                    UserPoolId: config.auth.user_pool_id,
                    ClientId: config.auth.user_pool_client_id
                };
                
                const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
                
                const userData = {
                    Username: 'g87_a@yahoo.com',
                    Pool: userPool
                };
                
                const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
                
                const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails({
                    Username: 'g87_a@yahoo.com',
                    Password: 'Gha@551987'
                });
                
                cognitoUser.authenticateUser(authenticationDetails, {
                    onSuccess: function(result) {
                        console.log('Success:', result);
                        output.innerHTML = 'Login successful! Token: ' + result.getAccessToken().getJwtToken().substring(0, 50) + '...';
                    },
                    onFailure: function(err) {
                        console.error('Failure:', err);
                        output.innerHTML = 'Login failed: ' + err.message;
                    }
                });
                
            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
