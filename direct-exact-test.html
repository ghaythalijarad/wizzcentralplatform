<!DOCTYPE html>
<html>
<head>
    <title>Direct DynamoDB Test - Your Exact Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .user { border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .error { color: red; padding: 20px; border: 1px solid red; background: #ffe6e6; }
        .success { color: green; padding: 20px; border: 1px solid green; background: #e6ffe6; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Direct DynamoDB Test - Your Exact Data Structure</h1>
    <div id="status">Loading...</div>
    <div id="results"></div>

    <!-- AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <!-- App Configuration -->
    <script src="../config.js"></script>

    <script>
        async function testDirectDynamoDB() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            try {
                statusDiv.textContent = 'Configuring AWS...';
                
                // Configure AWS with your config
                const { COGNITO_REGION, COGNITO_IDENTITY_POOL_ID } = window.WIZZCENTRAL_CONFIG;
                
                AWS.config.update({ 
                    region: COGNITO_REGION,
                    maxRetries: 3
                });

                AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                    IdentityPoolId: COGNITO_IDENTITY_POOL_ID,
                });

                statusDiv.textContent = 'Refreshing credentials...';
                await AWS.config.credentials.refreshPromise();
                
                statusDiv.textContent = 'Creating DynamoDB client...';
                const dynamoDB = new AWS.DynamoDB.DocumentClient();
                
                statusDiv.textContent = 'Scanning WizzUser_users_dev table...';
                
                const params = {
                    TableName: 'WizzUser_users_dev'
                };
                
                const result = await dynamoDB.scan(params).promise();
                console.log('Direct scan result:', result);
                
                if (!result.Items || result.Items.length === 0) {
                    statusDiv.innerHTML = '<div class="error">No items found in the table</div>';
                    return;
                }
                
                statusDiv.innerHTML = `<div class="success">Successfully found ${result.Items.length} users!</div>`;
                
                // Create table showing your exact data
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Customer Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Country</th>
                                <th>Gender</th>
                                <th>Language</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                result.Items.forEach((user, index) => {
                    console.log(`User ${index + 1}:`, user);
                    
                    tableHTML += `
                        <tr>
                            <td>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <img src="https://i.pravatar.cc/40?u=${user.userId}" 
                                         width="30" height="30" style="border-radius: 50%;">
                                    <div>
                                        <div style="font-weight: bold;">${user.name || 'N/A'}</div>
                                        <div style="font-size: 0.8em; color: #666;">ID: ${user.userId}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${user.email || 'N/A'}</td>
                            <td>${user.phone || 'N/A'}</td>
                            <td>
                                <span style="padding: 4px 8px; border-radius: 4px; font-size: 0.8em; 
                                             background: ${user.isActive ? '#d4edda' : '#f8d7da'}; 
                                             color: ${user.isActive ? '#155724' : '#721c24'};">
                                    ${user.isActive ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td>${user.countryCode || 'N/A'}</td>
                            <td>${user.gender || 'N/A'}</td>
                            <td>${user.preferredLanguage || 'N/A'}</td>
                            <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</td>
                            <td>
                                <button style="padding: 4px 8px; margin: 0 2px; border: none; border-radius: 3px; background: #007bff; color: white; cursor: pointer;">View</button>
                                <button style="padding: 4px 8px; margin: 0 2px; border: none; border-radius: 3px; background: #28a745; color: white; cursor: pointer;">Edit</button>
                            </td>
                        </tr>
                    `;
                });
                
                tableHTML += `</tbody></table>`;
                
                resultsDiv.innerHTML = `
                    <h2>Customer Management View (${result.Items.length} customers)</h2>
                    ${tableHTML}
                    
                    <h3>Raw Data (for debugging):</h3>
                    <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 400px; overflow-y: auto;">
${JSON.stringify(result.Items, null, 2)}
                    </pre>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                resultsDiv.innerHTML = `<pre>${JSON.stringify(error, null, 2)}</pre>`;
            }
        }
        
        // Start test when page loads
        window.addEventListener('load', () => {
            setTimeout(testDirectDynamoDB, 1000);
        });
    </script>
</body>
</html>
