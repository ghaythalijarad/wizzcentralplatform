<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Merchant Edit Issue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .form-group { margin: 10px 0; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐛 Debug Merchant Edit Issue</h1>
        <p>This tool helps debug the "Update failed: [object Object]" and 500 server error issues.</p>

        <div class="debug-section info">
            <h3>Environment Detection</h3>
            <div id="envInfo"></div>
        </div>

        <div class="debug-section">
            <h3>Step 1: Test Configuration</h3>
            <button onclick="testConfig()">Test API Configuration</button>
            <div id="configResult" class="log"></div>
        </div>

        <div class="debug-section">
            <h3>Step 2: Test Authentication</h3>
            <button onclick="testAuth()">Test Authentication Token</button>
            <div id="authResult" class="log"></div>
        </div>

        <div class="debug-section">
            <h3>Step 3: Load Merchant Data</h3>
            <button onclick="loadMerchants()">Load Merchants from DynamoDB</button>
            <div id="merchantsResult" class="log"></div>
        </div>

        <div class="debug-section">
            <h3>Step 4: Test Merchant Update</h3>
            <div class="form-group">
                <label>Select Merchant:</label>
                <select id="merchantSelect">
                    <option value="">Select a merchant...</option>
                </select>
            </div>
            <div class="form-group">
                <label>New Business Name:</label>
                <input type="text" id="newBusinessName" placeholder="Enter new business name">
            </div>
            <button onclick="testMerchantUpdate()">Test Update Merchant</button>
            <div id="updateResult" class="log"></div>
        </div>

        <div class="debug-section">
            <h3>Step 5: Test Status Change</h3>
            <div class="form-group">
                <label>New Status:</label>
                <select id="newStatus">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="under_review">Under Review</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            <div class="form-group">
                <label>Reason:</label>
                <input type="text" id="statusReason" placeholder="Enter reason for status change">
            </div>
            <button onclick="testStatusUpdate()">Test Status Update</button>
            <div id="statusResult" class="log"></div>
        </div>

        <div class="debug-section info">
            <h3>Debug Log</h3>
            <div id="debugLog" class="log"></div>
        </div>
    </div>

    <!-- Load configuration and AWS SDK -->
    <script src="config.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>

    <script>
        let merchants = [];
        let dynamoDB = null;

        function log(message, type = 'info') {
            const debugLog = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            debugLog.textContent += `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[DEBUG] ${message}`);
        }

        function updateSection(sectionId, content, className = '') {
            const section = document.getElementById(sectionId);
            section.textContent = content;
            if (className) {
                section.className = `log ${className}`;
            }
        }

        // Initialize environment detection
        function initEnvDetection() {
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const port = window.location.port;
            
            document.getElementById('envInfo').innerHTML = `
                <strong>Current Environment:</strong><br>
                • Protocol: ${protocol}<br>
                • Hostname: ${hostname}<br>
                • Port: ${port}<br>
                • Environment: ${isLocal ? 'Local Development' : 'Production'}<br>
                • API Base URL: ${window.WIZZCENTRAL_CONFIG?.API_BASE_URL || 'Not configured'}
            `;
        }

        async function testConfig() {
            log('Testing API configuration...');
            updateSection('configResult', 'Testing configuration...');
            
            try {
                // Test if config is loaded
                if (!window.WIZZCENTRAL_CONFIG) {
                    throw new Error('WIZZCENTRAL_CONFIG not found');
                }

                const config = window.WIZZCENTRAL_CONFIG;
                const result = `Configuration loaded successfully:
• API_BASE_URL: ${config.API_BASE_URL}
• APP_NAME: ${config.APP_NAME}
• STAGE: ${config.STAGE}

Testing API endpoint accessibility...`;
                
                updateSection('configResult', result);
                
                // Test if API endpoint is accessible
                const testUrl = `${config.API_BASE_URL}/health`;
                try {
                    const response = await fetch(testUrl, { method: 'GET' });
                    updateSection('configResult', result + `\n\nAPI Endpoint Test (${testUrl}): ${response.status} ${response.statusText}`);
                } catch (apiError) {
                    updateSection('configResult', result + `\n\nAPI Endpoint Test FAILED: ${apiError.message}`);
                }
                
                log('Configuration test completed');
            } catch (error) {
                updateSection('configResult', `Configuration test FAILED: ${error.message}`, 'error');
                log(`Configuration test failed: ${error.message}`, 'error');
            }
        }

        async function testAuth() {
            log('Testing authentication...');
            updateSection('authResult', 'Testing authentication...');
            
            try {
                const idToken = sessionStorage.getItem('idToken');
                const accessToken = sessionStorage.getItem('accessToken');
                
                let result = 'Authentication tokens:\n';
                result += `• ID Token: ${idToken ? 'Present (' + idToken.length + ' chars)' : 'Missing'}\n`;
                result += `• Access Token: ${accessToken ? 'Present (' + accessToken.length + ' chars)' : 'Missing'}\n`;
                
                if (!idToken && !accessToken) {
                    result += '\n⚠️ No authentication tokens found. This may cause API calls to fail.';
                    updateSection('authResult', result, 'error');
                } else {
                    result += '\n✅ Authentication tokens are available.';
                    updateSection('authResult', result, 'success');
                }
                
                log('Authentication test completed');
            } catch (error) {
                updateSection('authResult', `Authentication test FAILED: ${error.message}`, 'error');
                log(`Authentication test failed: ${error.message}`, 'error');
            }
        }

        async function loadMerchants() {
            log('Loading merchants from DynamoDB...');
            updateSection('merchantsResult', 'Loading merchants...');
            
            try {
                // Initialize AWS if not done
                if (!dynamoDB) {
                    await initializeAWS();
                }

                const params = {
                    TableName: 'order-receiver-businesses-dev',
                    Limit: 5
                };

                const data = await dynamoDB.scan(params).promise();
                
                if (data && data.Items) {
                    merchants = data.Items;
                    const result = `Successfully loaded ${merchants.length} merchants:\n\n`;
                    let merchantList = '';
                    
                    // Populate merchant select
                    const select = document.getElementById('merchantSelect');
                    select.innerHTML = '<option value="">Select a merchant...</option>';
                    
                    merchants.forEach((merchant, index) => {
                        merchantList += `${index + 1}. ${merchant.businessName || 'Unknown'} (ID: ${merchant.businessId})\n`;
                        select.innerHTML += `<option value="${merchant.businessId}">${merchant.businessName || 'Unknown Business'}</option>`;
                    });
                    
                    updateSection('merchantsResult', result + merchantList, 'success');
                    log(`Loaded ${merchants.length} merchants successfully`);
                } else {
                    updateSection('merchantsResult', 'No merchants found in database', 'info');
                    log('No merchants found');
                }
                
            } catch (error) {
                updateSection('merchantsResult', `Failed to load merchants: ${error.message}`, 'error');
                log(`Merchant loading failed: ${error.message}`, 'error');
            }
        }

        async function testMerchantUpdate() {
            const merchantId = document.getElementById('merchantSelect').value;
            const newBusinessName = document.getElementById('newBusinessName').value;
            
            if (!merchantId) {
                updateSection('updateResult', 'Please select a merchant first', 'error');
                return;
            }
            
            if (!newBusinessName) {
                updateSection('updateResult', 'Please enter a new business name', 'error');
                return;
            }
            
            log(`Testing merchant update for ID: ${merchantId}`);
            updateSection('updateResult', 'Testing merchant update...');
            
            try {
                const accessToken = sessionStorage.getItem('accessToken') || sessionStorage.getItem('idToken');
                
                if (!accessToken) {
                    throw new Error('No authentication token available');
                }
                
                const updateData = {
                    businessName: newBusinessName,
                    updatedAt: new Date().toISOString()
                };
                
                log(`Sending PUT request to: ${window.WIZZCENTRAL_CONFIG.API_BASE_URL}/merchants/${merchantId}`);
                log(`Update data: ${JSON.stringify(updateData, null, 2)}`);
                
                const response = await fetch(`${window.WIZZCENTRAL_CONFIG.API_BASE_URL}/merchants/${merchantId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const responseText = await response.text();
                log(`Response status: ${response.status} ${response.statusText}`);
                log(`Response body: ${responseText}`);
                
                let result = `Merchant Update Test Results:\n\n`;
                result += `• URL: ${window.WIZZCENTRAL_CONFIG.API_BASE_URL}/merchants/${merchantId}\n`;
                result += `• Method: PUT\n`;
                result += `• Status: ${response.status} ${response.statusText}\n`;
                result += `• Response: ${responseText}\n`;
                
                if (response.ok) {
                    const responseData = JSON.parse(responseText);
                    result += `\n✅ Update successful!`;
                    updateSection('updateResult', result, 'success');
                    log('Merchant update successful');
                } else {
                    result += `\n❌ Update failed`;
                    updateSection('updateResult', result, 'error');
                    log(`Merchant update failed: ${response.status} ${responseText}`, 'error');
                }
                
            } catch (error) {
                const errorMsg = `Merchant update FAILED: ${error.message}`;
                updateSection('updateResult', errorMsg, 'error');
                log(`Merchant update error: ${error.message}`, 'error');
            }
        }

        async function testStatusUpdate() {
            const merchantId = document.getElementById('merchantSelect').value;
            const newStatus = document.getElementById('newStatus').value;
            const reason = document.getElementById('statusReason').value;
            
            if (!merchantId) {
                updateSection('statusResult', 'Please select a merchant first', 'error');
                return;
            }
            
            if (!reason) {
                updateSection('statusResult', 'Please enter a reason for status change', 'error');
                return;
            }
            
            log(`Testing status update for merchant ID: ${merchantId}`);
            updateSection('statusResult', 'Testing status update...');
            
            try {
                const accessToken = sessionStorage.getItem('accessToken') || sessionStorage.getItem('idToken');
                
                if (!accessToken) {
                    throw new Error('No authentication token available');
                }
                
                // Map status to action
                const statusActionMap = {
                    'approved': 'approve',
                    'rejected': 'reject',
                    'under_review': 'review',
                    'pending': 'reactivate'
                };
                
                const action = statusActionMap[newStatus];
                const requestBody = {
                    action: action,
                    reason: reason,
                    sendEmail: true
                };
                
                log(`Sending PATCH request to: ${window.WIZZCENTRAL_CONFIG.API_BASE_URL}/merchants/${merchantId}/status`);
                log(`Request body: ${JSON.stringify(requestBody, null, 2)}`);
                
                const response = await fetch(`${window.WIZZCENTRAL_CONFIG.API_BASE_URL}/merchants/${merchantId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const responseText = await response.text();
                log(`Response status: ${response.status} ${response.statusText}`);
                log(`Response body: ${responseText}`);
                
                let result = `Status Update Test Results:\n\n`;
                result += `• URL: ${window.WIZZCENTRAL_CONFIG.API_BASE_URL}/merchants/${merchantId}/status\n`;
                result += `• Method: PATCH\n`;
                result += `• Action: ${action}\n`;
                result += `• Status: ${response.status} ${response.statusText}\n`;
                result += `• Response: ${responseText}\n`;
                
                if (response.ok) {
                    result += `\n✅ Status update successful!`;
                    updateSection('statusResult', result, 'success');
                    log('Status update successful');
                } else {
                    result += `\n❌ Status update failed`;
                    updateSection('statusResult', result, 'error');
                    log(`Status update failed: ${response.status} ${responseText}`, 'error');
                }
                
            } catch (error) {
                const errorMsg = `Status update FAILED: ${error.message}`;
                updateSection('statusResult', errorMsg, 'error');
                log(`Status update error: ${error.message}`, 'error');
            }
        }

        async function initializeAWS() {
            log('Initializing AWS...');
            
            try {
                const resp = await fetch('/amplify_outputs.json');
                if (!resp.ok) {
                    throw new Error(`Failed to fetch amplify_outputs.json: ${resp.status}`);
                }
                const outputs = await resp.json();
                
                const region = outputs.data?.aws_region || 'us-east-1';
                const userPoolId = outputs.auth?.user_pool_id;
                const identityPoolId = outputs.auth?.identity_pool_id;
                
                const provider = `cognito-idp.${region}.amazonaws.com/${userPoolId}`;
                AWS.config.update({ region });
                
                const idToken = sessionStorage.getItem('idToken');
                const credParams = { IdentityPoolId: identityPoolId };
                
                if (idToken && idToken.length > 50) {
                    credParams.Logins = { [provider]: idToken };
                }
                
                AWS.config.credentials = new AWS.CognitoIdentityCredentials(credParams);
                await AWS.config.credentials.refreshPromise();
                
                dynamoDB = new AWS.DynamoDB.DocumentClient({
                    convertEmptyValues: true,
                    removeUndefinedValues: true,
                    region: region
                });
                
                log('AWS initialized successfully');
            } catch (error) {
                log(`AWS initialization failed: ${error.message}`, 'error');
                throw error;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initEnvDetection();
            log('Debug tool initialized');
        });
    </script>
</body>
</html>
