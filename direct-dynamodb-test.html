<!DOCTYPE html>
<html>
<head>
    <title>Direct DynamoDB Test</title>
</head>
<body>
    <h1>Direct DynamoDB Access Test</h1>
    <div id="status">Testing...</div>
    <div id="results"></div>

    <!-- AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <!-- App Configuration -->
    <script src="config.js"></script>
    
    <script>
        async function testDirectDynamoDB() {
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            
            try {
                statusEl.textContent = 'Initializing AWS...';
                
                // Configure AWS
                AWS.config.region = awsConfig.region;
                AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                    IdentityPoolId: awsConfig.identityPoolId
                });
                
                statusEl.textContent = 'Creating DynamoDB client...';
                const dynamoDB = new AWS.DynamoDB.DocumentClient();
                
                statusEl.textContent = 'Scanning WizzUser_users_dev table...';
                
                // Direct scan of users table
                const params = {
                    TableName: 'WizzUser_users_dev'
                };
                
                const result = await dynamoDB.scan(params).promise();
                
                statusEl.textContent = `Success! Found ${result.Items.length} users`;
                
                let output = '<h2>Users Found:</h2>';
                result.Items.forEach((user, index) => {
                    output += `<div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">`;
                    output += `<h3>User ${index + 1}</h3>`;
                    output += `<p><strong>User ID:</strong> ${user.userId || 'N/A'}</p>`;
                    output += `<p><strong>Name:</strong> ${user.name || 'N/A'}</p>`;
                    output += `<p><strong>Email:</strong> ${user.email || 'N/A'}</p>`;
                    output += `<p><strong>Phone:</strong> ${user.phone || 'N/A'}</p>`;
                    output += `<p><strong>Active:</strong> ${user.isActive}</p>`;
                    output += `<p><strong>Created:</strong> ${user.createdAt || 'N/A'}</p>`;
                    output += `<p><strong>Raw Data:</strong> <pre>${JSON.stringify(user, null, 2)}</pre></p>`;
                    output += `</div>`;
                });
                
                resultsEl.innerHTML = output;
                
            } catch (error) {
                statusEl.textContent = `Error: ${error.message}`;
                resultsEl.innerHTML = `<pre>${JSON.stringify(error, null, 2)}</pre>`;
                console.error('Direct DynamoDB test failed:', error);
            }
        }
        
        // Run test when page loads
        window.onload = testDirectDynamoDB;
    </script>
</body>
</html>
