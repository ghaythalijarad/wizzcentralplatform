<!DOCTYPE html>
<html>
<head>
    <title>Test Region Edit</title>
</head>
<body>
    <h1>Test Region Data</h1>
    <div id="output"></div>
    <script>
        fetch('https://7jqjy7gy73trrm4sywpqp4mlim0qkwxz.lambda-url.eu-north-1.on.aws/regions')
            .then(r => r.json())
            .then(data => {
                const items = data.items || data.data || data.regions || [];
                console.log('Total regions:', items.length);
                
                // Find a level 2 or 3 region with parent_id
                const testRegion = items.find(r => (r.level === 2 || r.level === 3) && r.parent_id);
                
                if (testRegion) {
                    document.getElementById('output').innerHTML = `
                        <h2>Sample Region for Testing:</h2>
                        <pre>${JSON.stringify(testRegion, null, 2)}</pre>
                        <h3>Key Fields:</h3>
                        <ul>
                            <li>regionId: ${testRegion.regionId || testRegion.id}</li>
                            <li>name: ${testRegion.name || testRegion.regionName}</li>
                            <li>level: ${testRegion.level}</li>
                            <li>parent_id: ${testRegion.parent_id}</li>
                            <li>governorate: ${testRegion.governorate || 'N/A'}</li>
                        </ul>
                    `;
                    console.log('Test region:', testRegion);
                }
            })
            .catch(err => {
                document.getElementById('output').textContent = 'Error: ' + err.message;
                console.error(err);
            });
    </script>
</body>
</html>
