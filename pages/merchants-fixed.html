<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Merchants Management (Fixed)</title>
    <link rel="stylesheet" href="../dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-rocket"></i>
                <span>WizzCentral</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="drivers.html" class="nav-link">
                        <i class="fas fa-motorcycle"></i>
                        <span>Drivers Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="customers.html" class="nav-link">
                        <i class="fas fa-users"></i>
                        <span>Customers Management</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="merchants.html" class="nav-link">
                        <i class="fas fa-store"></i>
                        <span>Merchants Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="promotions.html" class="nav-link">
                        <i class="fas fa-tags"></i>
                        <span>Promotions</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="orders.html" class="nav-link">
                        <i class="fas fa-shopping-bag"></i>
                        <span>Orders Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="support.html" class="nav-link">
                        <i class="fas fa-headset"></i>
                        <span>Support Center</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="page-title">Merchants Management</h1>
        </div>

        <!-- Page Content -->
        <div class="page-content">
             <!-- Merchants Table -->
            <div class="table-container">
                <div id="merchants-table-status"></div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Business</th>
                            <th>Owner</th>
                            <th>Status</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="merchantsTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div> <!-- end page-content -->

        <!-- Status Update Modal -->
        <div id="statusModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
            <div class="modal-content" style="background:white; padding:1rem; border-radius:8px; max-width:400px; width:90%; position:relative;">
                <button onclick="closeModal('statusModal')" style="position:absolute; top:8px; right:8px; background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
                <h3 style="margin-bottom: 1rem;">Update Merchant Status</h3>
                <div id="statusModalBody"></div>
                <div style="margin-top:1rem; text-align:right;">
                    <button class="btn-secondary" onclick="closeModal('statusModal')" style="margin-right: 0.5rem;">Cancel</button>
                    <button class="btn-primary" onclick="updateMerchantStatus()">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- View Merchant Details Modal -->
        <div id="viewMerchantModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
            <div class="modal-content" style="background:white; padding:1rem; border-radius:8px; max-width:600px; width:90%; position:relative;">
                <button onclick="closeModal('viewMerchantModal')" style="position:absolute; top:8px; right:8px; background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
                <h3 style="margin-bottom: 1rem;">Merchant Details</h3>
                <div id="merchantDetailsBody"></div>
                <div style="margin-top:1rem; text-align:right;">
                    <button class="btn-primary" onclick="closeModal('viewMerchantModal')">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('Fixed merchants page starting...');
        
        // Simple logout function
        function logout() {
            console.log('Logout function called');
            sessionStorage.clear();
            localStorage.clear();
            window.location.href = '../index.html';
        }
        
        // Basic sidebar toggle
        document.getElementById('menuToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        });
    </script>

    <!-- Load merchants.js directly without other dependencies -->
    <script>
        // Mock the required functions before loading merchants.js
        window.initializeDashboard = function() {
            console.log('Mock initializeDashboard called');
        };
        
        window.checkAuthentication = function() {
            console.log('Mock checkAuthentication - returning true');
            return true;
        };
        
        // Mock AWS SDK if not available
        if (typeof AWS === 'undefined') {
            window.AWS = {
                config: {
                    credentials: null,
                    update: function() {},
                },
                CognitoIdentityCredentials: function() {},
                DynamoDB: {
                    DocumentClient: function() {}
                }
            };
        }
        
        console.log('Mocks set up, loading merchants functionality...');
    </script>
    
    <!-- Copy the essential parts of merchants.js inline to avoid conflicts -->
    <script>
        console.log('Starting fixed merchants initialization...');
        
        // Sample merchants data
        const merchantsData = [
            {
                id: 'biz-001',
                name: 'Pizza Palace Downtown',
                email: 'contact@pizzapalace.com',
                phone: '+1-555-0123',
                status: 'approved',
                address: '123 Main St, Downtown',
                owner: 'John Smith',
                avatar: 'https://ui-avatars.com/api/?name=Pizza+Palace&size=40&background=667eea&color=fff'
            },
            {
                id: 'biz-002',
                name: 'Fresh Market Express',
                email: 'info@freshmarket.com',
                phone: '+1-555-0124',
                status: 'pending',
                address: '456 Oak Avenue',
                owner: 'Sarah Johnson',
                avatar: 'https://ui-avatars.com/api/?name=Fresh+Market&size=40&background=f093fb&color=fff'
            },
            {
                id: 'biz-003',
                name: 'Coffee Corner Cafe',
                email: 'hello@coffeecorner.com',
                phone: '+1-555-0125',
                status: 'under_review',
                address: '789 Pine Street',
                owner: 'Mike Wilson',
                avatar: 'https://ui-avatars.com/api/?name=Coffee+Corner&size=40&background=34d399&color=fff'
            },
            {
                id: 'biz-004',
                name: 'Quick Pharmacy Plus',
                email: 'support@quickpharmacy.com',
                phone: '+1-555-0126',
                status: 'rejected',
                address: '321 Health Avenue',
                owner: 'Dr. Emily Chen',
                avatar: 'https://ui-avatars.com/api/?name=Quick+Pharmacy&size=40&background=ef4444&color=fff'
            }
        ];
        
        let filteredMerchants = [...merchantsData];
        
        // Status helper functions
        function getStatusClass(status) {
            const statusMap = {
                'pending': 'pending',
                'approved': 'verified',
                'rejected': 'rejected',
                'under_review': 'under-review',
                'suspended': 'suspended'
            };
            return statusMap[status] || 'unknown';
        }

        function getStatusLabel(status) {
            const statusLabels = {
                'pending': 'Pending',
                'approved': 'Approved',
                'rejected': 'Rejected',
                'under_review': 'Under Review',
                'suspended': 'Suspended'
            };
            return statusLabels[status] || 'Unknown';
        }
        
        // Render merchants table
        function renderMerchantsTable() {
            console.log('=== RENDERING MERCHANTS TABLE ===');
            console.log('Data to render:', filteredMerchants.length, 'merchants');
            
            const tbody = document.getElementById('merchantsTableBody');
            if (!tbody) {
                console.error('Table body not found!');
                return;
            }
            
            console.log('Table body found, rendering...');
            
            try {
                const tableHTML = filteredMerchants.map(merchant => `
                    <tr>
                        <td>
                            <div class="merchant-info">
                                <div class="merchant-avatar">
                                    <img src="${merchant.avatar}" alt="${merchant.name}" onerror="this.src='https://via.placeholder.com/40x40?text=M'">
                                </div>
                                <div class="merchant-name">
                                    ${merchant.name}
                                </div>
                            </div>
                        </td>
                        <td>${merchant.owner}</td>
                        <td>
                            <span class="status-badge ${getStatusClass(merchant.status)}">
                                ${getStatusLabel(merchant.status)}
                            </span>
                        </td>
                        <td>${merchant.email}</td>
                        <td>${merchant.phone}</td>
                        <td>${merchant.address}</td>
                        <td>
                            <div class="actions">
                                <button class="btn-action" onclick="viewMerchantDetails('${merchant.id}')" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn-action" onclick="openStatusModal('${merchant.id}')" title="Edit Status">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                
                tbody.innerHTML = tableHTML;
                console.log('Table rendered successfully with', filteredMerchants.length, 'rows');
                
            } catch (error) {
                console.error('Error rendering table:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 2rem; color: #ef4444;">
                            Error rendering table: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }
        
        // Modal functions
        function openStatusModal(businessId) {
            console.log('Opening status modal for:', businessId);
            const merchant = merchantsData.find(m => m.id === businessId);
            if (!merchant) return;

            const modalBody = document.getElementById('statusModalBody');
            modalBody.innerHTML = `
                <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                    <img src="${merchant.avatar}" alt="${merchant.name}" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 1rem;">
                    <div>
                        <h4 style="margin: 0;">${merchant.name}</h4>
                        <p style="margin: 0; color: #666;">${merchant.owner}</p>
                    </div>
                </div>
                <form id="statusUpdateForm">
                    <div style="margin-bottom: 1rem;">
                        <label for="merchantStatus">Business Status</label>
                        <select id="merchantStatus" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                            <option value="pending" ${merchant.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="approved" ${merchant.status === 'approved' ? 'selected' : ''}>Approved</option>
                            <option value="under_review" ${merchant.status === 'under_review' ? 'selected' : ''}>Under Review</option>
                            <option value="rejected" ${merchant.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                            <option value="suspended" ${merchant.status === 'suspended' ? 'selected' : ''}>Suspended</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label for="statusReason">Reason for Status Change (Optional)</label>
                        <textarea id="statusReason" rows="3" placeholder="Enter reason for status change..." style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;"></textarea>
                    </div>
                </form>
            `;

            document.getElementById('statusUpdateForm').dataset.businessId = businessId;
            document.getElementById('statusModal').style.display = 'flex';
        }

        function viewMerchantDetails(businessId) {
            console.log('Viewing details for:', businessId);
            const merchant = merchantsData.find(m => m.id === businessId);
            if (!merchant) return;

            const detailsBody = document.getElementById('merchantDetailsBody');
            detailsBody.innerHTML = `
                <div style="text-align: center; margin-bottom: 1rem;">
                    <img src="${merchant.avatar}" alt="${merchant.name}" style="width: 80px; height: 80px; border-radius: 50%;">
                    <h3 style="margin: 0.5rem 0 0 0;">${merchant.name}</h3>
                    <p style="margin: 0; color: #666;">${merchant.owner}</p>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div><label style="font-weight: bold;">Business ID</label><br>${merchant.id}</div>
                    <div><label style="font-weight: bold;">Status</label><br><span class="status-badge ${getStatusClass(merchant.status)}">${getStatusLabel(merchant.status)}</span></div>
                    <div><label style="font-weight: bold;">Phone</label><br>${merchant.phone}</div>
                    <div><label style="font-weight: bold;">Email</label><br>${merchant.email}</div>
                    <div style="grid-column: 1 / -1;"><label style="font-weight: bold;">Address</label><br>${merchant.address}</div>
                </div>
            `;

            document.getElementById('viewMerchantModal').style.display = 'flex';
        }

        function updateMerchantStatus() {
            const form = document.getElementById('statusUpdateForm');
            const businessId = form.dataset.businessId;
            const status = document.getElementById('merchantStatus').value;
            const reason = document.getElementById('statusReason').value;

            console.log('Updating status for:', businessId, 'to:', status);

            // Find and update the merchant
            const merchant = merchantsData.find(m => m.id === businessId);
            if (merchant) {
                merchant.status = status;
                renderMerchantsTable(); // Re-render the table
                closeModal('statusModal');
                alert(`Status updated for ${merchant.name}: ${status}${reason ? '\nReason: ' + reason : ''}`);
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing fixed merchants page...');
            
            // Small delay to ensure everything is ready
            setTimeout(() => {
                console.log('Rendering merchants table...');
                renderMerchantsTable();
                console.log('Fixed merchants page initialized successfully');
            }, 100);
        });
        
        console.log('Fixed merchants script setup complete');
    </script>
</body>
</html>
