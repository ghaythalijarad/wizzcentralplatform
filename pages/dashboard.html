<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizzCentral Platform - Dashboard</title>
    <link rel="stylesheet" href="../dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="dashboard">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-rocket"></i>
                <span>WizzCentral</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item active">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="drivers.html" class="nav-link">
                        <i class="fas fa-motorcycle"></i>
                        <span>Drivers Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="customers.html" class="nav-link">
                        <i class="fas fa-users"></i>
                        <span>Customers Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="merchants.html" class="nav-link">
                        <i class="fas fa-store"></i>
                        <span>Merchants Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="orders.html" class="nav-link">
                        <i class="fas fa-shopping-bag"></i>
                        <span>Orders Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="promotions.html" class="nav-link">
                        <i class="fas fa-tags"></i>
                        <span>Promotions Management</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="support.html" class="nav-link">
                        <i class="fas fa-headset"></i>
                        <span>Support</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name">Admin User</span>
                    <span class="user-role">Administrator</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">Dashboard Overview</h1>
            </div>
            <div class="top-bar-right">
                <div class="notifications">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon customers"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h3 id="customersCount">0</h3>
                    <p>Customers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon merchants"><i class="fas fa-store"></i></div>
                <div class="stat-info">
                    <h3 id="merchantsCount">0</h3>
                    <p>Merchants</p>
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="page-content">
            <!-- Dashboard Content -->
            <div class="dashboard-content">


                <!-- Charts and Recent Activity -->
                <div class="dashboard-grid">








                    <!-- Recent Businesses -->
                    <div class="dashboard-card">
                        <div class="card-header">
                            <h3>Recent Businesses</h3>
                            <a href="merchants.html" class="view-all">View All</a>
                        </div>
                        <div class="card-content">
                            <div class="merchant-list" id="recentBusinessesList">
                                <!-- Recent businesses will populate here -->
                            </div>
                        </div>
                    </div>
                </div> <!-- close dashboard-grid -->
            </div>
        </div>
    </div>

    <!-- AWS SDK and Configuration Scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="../config.js"></script>
    <script src="../data-service.js"></script>
    <script src="../dashboard.js"></script>
    <script src="../assets/js/sidebar.js"></script>
</body>
</html>
