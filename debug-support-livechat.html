<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Support LiveChat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .status.connecting { background: #fff3cd; color: #856404; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .log { background: #f8f9fa; padding: 15px; border-radius: 4px; height: 400px; overflow-y: auto; }
        .debug-step { margin: 10px 0; padding: 8px; border-left: 3px solid #007bff; background: #e3f2fd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ Support LiveChat Debug</h1>
        
        <div id="status" class="status connecting">Initializing...</div>
        
        <button onclick="testLiveChatInit()">🔄 Test LiveChat Initialization</button>
        <button onclick="testWebSocketDirect()">🔌 Test Direct WebSocket</button>
        <button onclick="clearLog()">🧹 Clear Log</button>
        
        <div class="debug-step">
            <strong>Debug Steps:</strong>
            <ol>
                <li>Load configuration</li>
                <li>Initialize WebSocketManager</li>
                <li>Initialize AgentChatInterface</li>
                <li>Connect to WebSocket</li>
                <li>Send authentication</li>
            </ol>
        </div>
        
        <div id="log" class="log"></div>
    </div>

    <!-- Load the same scripts as support.html -->
    <script src="frontend/config.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="frontend/assets/js/websocket-manager.js"></script>
    <script src="frontend/assets/js/live-chat-manager.js"></script>
    <script src="frontend/assets/js/agent-chat-interface.js"></script>

    <script>
        let debugLog = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            debugLog.push(logEntry);
            
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#333';
            div.textContent = logEntry;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
            
            console.log(logEntry);
        }
        
        function updateStatus(status, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = status;
            statusEl.className = `status ${className}`;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            debugLog = [];
        }
        
        async function testLiveChatInit() {
            log('🚀 Starting LiveChat initialization test...', 'info');
            clearLog();
            
            try {
                // Step 1: Check configuration
                log('📋 Step 1: Checking configuration...', 'info');
                const config = window.WIZZCENTRAL_CONFIG;
                if (!config) {
                    throw new Error('WIZZCENTRAL_CONFIG not found');
                }
                log(`✅ Config loaded: ${config.WEBSOCKET?.LIVE_CHAT_URL}`, 'success');
                
                // Step 2: Test WebSocketManager class availability
                log('📋 Step 2: Checking WebSocketManager...', 'info');
                if (typeof WebSocketManager === 'undefined') {
                    throw new Error('WebSocketManager class not available');
                }
                log('✅ WebSocketManager class available', 'success');
                
                // Step 3: Initialize WebSocketManager
                log('📋 Step 3: Initializing WebSocketManager...', 'info');
                updateStatus('Connecting to WebSocket...', 'connecting');
                
                const wsManager = new WebSocketManager({
                    url: config.WEBSOCKET.LIVE_CHAT_URL,
                    protocols: [],
                    autoReconnect: true,
                    maxReconnectAttempts: 5,
                    reconnectDelay: 1000
                });
                
                // Setup event handlers
                wsManager.on('connected', () => {
                    log('✅ WebSocket connected successfully', 'success');
                    updateStatus('Connected to LiveChat', 'connected');
                });
                
                wsManager.on('error', (error) => {
                    log(`❌ WebSocket error: ${error.message}`, 'error');
                    updateStatus('Connection Error', 'error');
                });
                
                wsManager.on('disconnected', () => {
                    log('🔌 WebSocket disconnected', 'info');
                    updateStatus('Disconnected', 'error');
                });
                
                // Step 4: Connect
                log('📋 Step 4: Connecting to WebSocket...', 'info');
                const businessId = '7ccf646c-9594-48d4-8f63-c366d89257e5';
                const connected = await wsManager.connect(businessId);
                
                if (connected) {
                    log('✅ WebSocket connection established', 'success');
                    
                    // Step 5: Test AgentChatInterface
                    log('📋 Step 5: Testing AgentChatInterface...', 'info');
                    if (typeof AgentChatInterface === 'undefined') {
                        throw new Error('AgentChatInterface class not available');
                    }
                    
                    // Create a minimal container for the interface
                    const container = document.createElement('div');
                    container.id = 'test-chat-container';
                    container.style.display = 'none';
                    document.body.appendChild(container);
                    
                    const agentInterface = new AgentChatInterface({
                        containerId: 'test-chat-container',
                        agentId: 'debug-agent-' + Date.now(),
                        agentName: 'Debug Agent'
                    });
                    
                    await agentInterface.init();
                    log('✅ AgentChatInterface initialized successfully', 'success');
                    
                    updateStatus('LiveChat System Ready', 'connected');
                    log('🎉 All tests passed! LiveChat system working correctly.', 'success');
                    
                } else {
                    throw new Error('Failed to establish WebSocket connection');
                }
                
            } catch (error) {
                log(`❌ LiveChat initialization failed: ${error.message}`, 'error');
                log(`📍 Stack trace: ${error.stack}`, 'error');
                updateStatus('Failed to initialize LiveChat', 'error');
            }
        }
        
        async function testWebSocketDirect() {
            log('🔌 Testing direct WebSocket connection...', 'info');
            
            try {
                const wsUrl = 'wss://0fs1zdwyzf.execute-api.us-east-1.amazonaws.com/dev?businessId=7ccf646c-9594-48d4-8f63-c366d89257e5&userType=support&agentId=debug-agent&platform=web&appVersion=1.0.0';
                log(`📡 Connecting to: ${wsUrl}`, 'info');
                
                const ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('✅ Direct WebSocket connection successful', 'success');
                    ws.send(JSON.stringify({
                        type: 'chat_agent_connect',
                        agentId: 'debug-agent',
                        agentName: 'Debug Agent',
                        businessId: '7ccf646c-9594-48d4-8f63-c366d89257e5'
                    }));
                    
                    setTimeout(() => ws.close(), 3000);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`📨 Received: ${JSON.stringify(data)}`, 'success');
                };
                
                ws.onerror = (error) => {
                    log(`❌ Direct WebSocket error: ${error}`, 'error');
                };
                
                ws.onclose = (event) => {
                    log(`🔌 Direct WebSocket closed: ${event.code} ${event.reason}`, 'info');
                };
                
            } catch (error) {
                log(`❌ Direct WebSocket test failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-run basic test on page load
        document.addEventListener('DOMContentLoaded', () => {
            log('🛠️ Debug page loaded. Click "Test LiveChat Initialization" to start.', 'info');
        });
    </script>
</body>
</html>
