<!DOCTYPE html>
<html>
<head>
    <title>Authentication Test</title>
</head>
<body>
    <h1>Authentication Token Test</h1>
    <div id="results"></div>
    
    <script>
        // Test token storage and retrieval
        function testAuthentication() {
            const results = document.getElementById('results');
            let output = '<h2>Authentication Test Results:</h2>';
            
            // Test sessionStorage tokens
            const accessToken = sessionStorage.getItem('accessToken');
            const idToken = sessionStorage.getItem('idToken');
            const userEmail = sessionStorage.getItem('userEmail');
            
            output += `<p><strong>sessionStorage accessToken:</strong> ${accessToken ? 'Found ✓' : 'Not found ✗'}</p>`;
            output += `<p><strong>sessionStorage idToken:</strong> ${idToken ? 'Found ✓' : 'Not found ✗'}</p>`;
            output += `<p><strong>sessionStorage userEmail:</strong> ${userEmail ? 'Found ✓' : 'Not found ✗'}</p>`;
            
            // Test localStorage (should be empty after fix)
            const localAccessToken = localStorage.getItem('accessToken');
            output += `<p><strong>localStorage accessToken:</strong> ${localAccessToken ? 'Found (should be empty) ✗' : 'Empty ✓'}</p>`;
            
            // Authentication function test
            function testCheckAuth() {
                const token = sessionStorage.getItem('accessToken');
                return token ? true : false;
            }
            
            const authResult = testCheckAuth();
            output += `<p><strong>Authentication Check Result:</strong> ${authResult ? 'Authenticated ✓' : 'Not authenticated ✗'}</p>`;
            
            results.innerHTML = output;
        }
        
        // Run test when page loads
        window.onload = testAuthentication;
    </script>
</body>
</html>
