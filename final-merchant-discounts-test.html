<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Merchant Discounts Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .warning { background: #fff3cd; border-color: #ffeaa7; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { flex: 1; padding: 15px; background: #f8f9fa; border-radius: 5px; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 2em; color: #007cba; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; font-weight: 600; }
        .btn { padding: 8px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007cba; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 200px; }
        .loading { text-align: center; padding: 40px; }
        .loading i { font-size: 3em; color: #007cba; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-tags"></i> Final Merchant Discounts Implementation Test</h1>
        
        <div class="test-section info">
            <h3>Test Status</h3>
            <div id="test-status">Initializing tests...</div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3 id="total-discounts">0</h3>
                <p>Total Discounts</p>
            </div>
            <div class="stat-card">
                <h3 id="active-discounts">0</h3>
                <p>Active Discounts</p>
            </div>
            <div class="stat-card">
                <h3 id="total-businesses">0</h3>
                <p>Total Businesses</p>
            </div>
            <div class="stat-card">
                <h3 id="matched-businesses">0</h3>
                <p>Matched Businesses</p>
            </div>
        </div>
        
        <div class="test-section">
            <h3>Expected Discounts from DynamoDB</h3>
            <div id="expected-data"></div>
        </div>
        
        <div class="test-section">
            <h3>Actions</h3>
            <button class="btn btn-primary" onclick="runTest()">
                <i class="fas fa-play"></i> Run Test
            </button>
            <button class="btn btn-success" onclick="openPromotionsPage()">
                <i class="fas fa-external-link-alt"></i> Open Promotions Page
            </button>
            <button class="btn btn-danger" onclick="clearResults()">
                <i class="fas fa-trash"></i> Clear Results
            </button>
        </div>
        
        <div class="test-section">
            <h3>Test Results</h3>
            <div id="test-results"></div>
        </div>
        
        <div class="test-section">
            <h3>Discount Table Preview</h3>
            <div id="discount-table"></div>
        </div>
        
        <div class="test-section">
            <h3>Debug Information</h3>
            <div id="debug-info"></div>
        </div>
    </div>
    
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="../config.js"></script>
    <script src="../data-service.js"></script>
    
    <script>
        // Expected data from DynamoDB
        const expectedDiscounts = [
            {
                discountId: 'b78762d0-4283-42a9-a3c7-442f6d77b744',
                businessId: '723a276a-ad62-482c-898c-076d1f8d5c0e',
                title: 'win win',
                description: 'win winwin winwin win',
                type: 'percentage',
                value: 10,
                status: 'active'
            },
            {
                discountId: '2a9ab66c-cbc1-4839-88ba-8ea1e6dd0f76',
                businessId: 'ef8366d7-e311-4a48-bf73-dcf1069cebe6',
                title: 'hhhhh',
                description: 'hhhhh',
                type: 'percentage',
                value: 50,
                status: 'active'
            }
        ];
        
        let testResults = [];
        let fetchedDiscounts = [];
        let fetchedBusinesses = [];
        
        function addResult(type, title, content) {
            const result = { type, title, content, timestamp: new Date().toLocaleTimeString() };
            testResults.push(result);
            updateTestDisplay();
        }
        
        function updateTestDisplay() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = testResults.map(result => `
                <div class="test-section ${result.type}">
                    <h4>${result.title} <small>(${result.timestamp})</small></h4>
                    <pre>${result.content}</pre>
                </div>
            `).join('');
        }
        
        function updateStats() {
            document.getElementById('total-discounts').textContent = fetchedDiscounts.length;
            document.getElementById('active-discounts').textContent = 
                fetchedDiscounts.filter(d => d.status === 'active').length;
            document.getElementById('total-businesses').textContent = fetchedBusinesses.length;
            
            const discountBusinessIds = fetchedDiscounts.map(d => d.businessId);
            const matched = fetchedBusinesses.filter(b => discountBusinessIds.includes(b.id));
            document.getElementById('matched-businesses').textContent = matched.length;
        }
        
        function displayExpectedData() {
            document.getElementById('expected-data').innerHTML = `
                <p><strong>We expect to find these 2 discount records:</strong></p>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Business ID</th><th>Title</th><th>Type</th><th>Value</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        ${expectedDiscounts.map(d => `
                            <tr>
                                <td>${d.discountId.substring(0,8)}...</td>
                                <td>${d.businessId.substring(0,8)}...</td>
                                <td>${d.title}</td>
                                <td>${d.type}</td>
                                <td>${d.value}${d.type === 'percentage' ? '%' : ''}</td>
                                <td>${d.status}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function displayDiscountTable() {
            if (fetchedDiscounts.length === 0) {
                document.getElementById('discount-table').innerHTML = 
                    '<p class="warning">No discounts fetched yet. Run the test first.</p>';
                return;
            }
            
            const businessLookup = {};
            fetchedBusinesses.forEach(b => businessLookup[b.id] = b);
            
            document.getElementById('discount-table').innerHTML = `
                <table>
                    <thead>
                        <tr><th>Title</th><th>Business</th><th>Type</th><th>Value</th><th>Status</th><th>Description</th></tr>
                    </thead>
                    <tbody>
                        ${fetchedDiscounts.map(d => {
                            const business = businessLookup[d.businessId];
                            const businessName = business ? 
                                (business.name || business.businessName || 'Unknown') : 
                                `Business ${d.businessId.substring(0,8)}...`;
                            
                            return `
                                <tr>
                                    <td><strong>${d.title}</strong></td>
                                    <td>${businessName}</td>
                                    <td>${d.type}</td>
                                    <td>${d.value}${d.type === 'percentage' ? '% OFF' : ''}</td>
                                    <td><span style="padding: 4px 8px; background: ${d.status === 'active' ? '#28a745' : '#6c757d'}; color: white; border-radius: 3px;">${d.status}</span></td>
                                    <td>${d.description}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }
        
        async function runTest() {
            document.getElementById('test-status').innerHTML = 
                '<div class="loading"><i class="fas fa-spinner fa-spin"></i><br>Running comprehensive test...</div>';
            
            testResults = [];
            fetchedDiscounts = [];
            fetchedBusinesses = [];
            updateStats();
            
            try {
                addResult('info', 'Test Started', 'Beginning comprehensive merchant discounts test');
                
                // Test 1: Check if data service is available
                if (!window.dataService) {
                    addResult('error', 'Data Service Missing', 'window.dataService is not available');
                    document.getElementById('test-status').innerHTML = 
                        '<div class="error">❌ Test Failed - Data Service Missing</div>';
                    return;
                }
                addResult('success', 'Data Service Found', 'window.dataService is available');
                
                // Test 2: Initialize data service
                await window.dataService.initialize();
                addResult('success', 'Data Service Initialized', 'Successfully initialized data service');
                
                // Test 3: Fetch merchant discounts
                fetchedDiscounts = await window.dataService.getMerchantDiscounts();
                addResult('success', 'Discounts Fetched', 
                    `Successfully fetched ${fetchedDiscounts.length} discounts:\n${JSON.stringify(fetchedDiscounts, null, 2)}`);
                
                // Test 4: Fetch businesses
                fetchedBusinesses = await window.dataService.getBusinesses();
                addResult('success', 'Businesses Fetched', 
                    `Successfully fetched ${fetchedBusinesses.length} businesses:\n${JSON.stringify(fetchedBusinesses, null, 2)}`);
                
                // Test 5: Verify expected data
                const expectedIds = expectedDiscounts.map(d => d.discountId);
                const fetchedIds = fetchedDiscounts.map(d => d.id || d.discountId);
                const matchingDiscounts = expectedIds.filter(id => fetchedIds.includes(id));
                
                if (matchingDiscounts.length === expectedDiscounts.length) {
                    addResult('success', 'Data Verification Passed', 
                        `All ${expectedDiscounts.length} expected discounts were found`);
                } else {
                    addResult('warning', 'Data Verification Partial', 
                        `Found ${matchingDiscounts.length}/${expectedDiscounts.length} expected discounts.\nExpected: ${expectedIds.join(', ')}\nFetched: ${fetchedIds.join(', ')}`);
                }
                
                // Test 6: Business lookup test
                const discountBusinessIds = fetchedDiscounts.map(d => d.businessId);
                const businessIds = fetchedBusinesses.map(b => b.id);
                const matchingBusinesses = discountBusinessIds.filter(id => businessIds.includes(id));
                
                addResult('info', 'Business Lookup Analysis', 
                    `Discount business IDs: ${discountBusinessIds.join(', ')}\nAvailable business IDs: ${businessIds.join(', ')}\nMatches: ${matchingBusinesses.length}/${discountBusinessIds.length}`);
                
                updateStats();
                displayDiscountTable();
                
                document.getElementById('test-status').innerHTML = 
                    '<div class="success">✅ Test Completed Successfully</div>';
                
                // Add debug info
                document.getElementById('debug-info').innerHTML = `
                    <h4>Raw Data Structures</h4>
                    <details>
                        <summary>Fetched Discounts (${fetchedDiscounts.length})</summary>
                        <pre>${JSON.stringify(fetchedDiscounts, null, 2)}</pre>
                    </details>
                    <details>
                        <summary>Fetched Businesses (${fetchedBusinesses.length})</summary>
                        <pre>${JSON.stringify(fetchedBusinesses, null, 2)}</pre>
                    </details>
                    <details>
                        <summary>Data Service Configuration</summary>
                        <pre>${JSON.stringify(window.dataService?.tables || {}, null, 2)}</pre>
                    </details>
                `;
                
            } catch (error) {
                addResult('error', 'Test Failed', `Error: ${error.message}\nStack: ${error.stack}`);
                document.getElementById('test-status').innerHTML = 
                    '<div class="error">❌ Test Failed - See results for details</div>';
            }
        }
        
        function openPromotionsPage() {
            window.open('/pages/promotions.html', '_blank');
        }
        
        function clearResults() {
            testResults = [];
            fetchedDiscounts = [];
            fetchedBusinesses = [];
            updateTestDisplay();
            updateStats();
            document.getElementById('discount-table').innerHTML = '';
            document.getElementById('debug-info').innerHTML = '';
            document.getElementById('test-status').textContent = 'Results cleared. Ready to run test.';
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            displayExpectedData();
            document.getElementById('test-status').textContent = 'Ready to run test. Click "Run Test" button.';
        });
    </script>
</body>
</html>
