<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Data Service Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .status { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .loading { background: #fff3cd; border: 1px solid #ffeaa7; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .data { background: #f8f9fa; padding: 10px; margin: 10px 0; border: 1px solid #dee2e6; border-radius: 4px; }
        pre { white-space: pre-wrap; word-wrap: break-word; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Simple Data Service Test</h1>
    <div id="status"></div>
    <div id="discountData"></div>
    <div id="businessData"></div>
    
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="config.js"></script>
    <script src="data-service.js"></script>
    
    <script>
        const statusDiv = document.getElementById('status');
        const discountDiv = document.getElementById('discountData');
        const businessDiv = document.getElementById('businessData');
        
        function updateStatus(message, type = 'loading') {
            statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function showData(title, data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <h3>${title}</h3>
                <div class="data">
                    <strong>Count:</strong> ${Array.isArray(data) ? data.length : 'Not an array'}<br>
                    <strong>Data:</strong>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }
        
        async function testDataService() {
            try {
                updateStatus('Checking if data service is available...', 'loading');
                
                if (!window.dataService) {
                    updateStatus('❌ Data service not found!', 'error');
                    return;
                }
                
                updateStatus('✅ Data service found. Initializing...', 'loading');
                await window.dataService.initialize();
                
                updateStatus('✅ Data service initialized. Loading discount data...', 'loading');
                const discounts = await window.dataService.getMerchantDiscounts();
                showData('Merchant Discounts', discounts, 'discountData');
                
                updateStatus('✅ Discounts loaded. Loading business data...', 'loading');
                const businesses = await window.dataService.getBusinesses();
                showData('Businesses', businesses, 'businessData');
                
                updateStatus(`✅ All data loaded successfully! Found ${discounts.length} discounts and ${businesses.length} businesses.`, 'success');
                
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
        
        // Start test after a short delay
        setTimeout(testDataService, 1000);
    </script>
</body>
</html>
