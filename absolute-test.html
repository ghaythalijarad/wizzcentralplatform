<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolutely Minimal Test</title>
</head>
<body style="margin: 0; padding: 20px; font-family: Arial, sans-serif; background: lightgray;">
    <h1 style="color: red; font-size: 3rem;">HELLO WORLD</h1>
    <p style="font-size: 2rem; color: blue;">This is a basic test page.</p>
    
    <div style="width: 100%; height: 200px; background: yellow; border: 5px solid black; margin: 20px 0;">
        <h2 style="padding: 20px; color: red;">BIG YELLOW BOX</h2>
        <p style="padding: 0 20px; font-size: 1.5rem;">If you can see this, HTML works</p>
    </div>
    
    <div style="background: green; color: white; padding: 20px; font-size: 1.5rem;">
        GREEN BOX WITH WHITE TEXT
    </div>
    
    <!-- Test Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <div style="padding: 20px; font-size: 2rem;">
        <i class="fas fa-rocket" style="color: orange;"></i> Rocket Icon Test
        <i class="fas fa-shopping-bag" style="color: blue;"></i> Shopping Bag Icon Test
    </div>
    
    <!-- Test the main CSS file -->
    <link rel="stylesheet" href="../dashboard.css">
    <div class="stat-card" style="margin: 20px; display: inline-block;">
        <div class="stat-icon orders">
            <i class="fas fa-shopping-bag"></i>
        </div>
        <div class="stat-info">
            <h3>1,247</h3>
            <p>CSS Test</p>
        </div>
    </div>
    
    <script>
        console.log('Page loaded successfully');
        console.log('Document ready state:', document.readyState);
        console.log('Window size:', window.innerWidth, 'x', window.innerHeight);
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM Content Loaded');
            
            // Add a big visible element via JavaScript
            const jsDiv = document.createElement('div');
            jsDiv.style.cssText = 'background: purple; color: white; padding: 30px; margin: 20px; font-size: 2rem; border: 5px solid orange;';
            jsDiv.innerHTML = 'JAVASCRIPT WORKS! This was added by JS.';
            document.body.appendChild(jsDiv);
            
            // Test CSS classes
            const statCard = document.querySelector('.stat-card');
            if (statCard) {
                console.log('Stat card found:', statCard);
                const style = window.getComputedStyle(statCard);
                console.log('Stat card styles:', {
                    display: style.display,
                    background: style.background,
                    padding: style.padding
                });
            } else {
                console.log('Stat card NOT found');
            }
        });
    </script>
</body>
</html>
