<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchants Data Test - Final Verification</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .merchant-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .merchant-table th, .merchant-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .merchant-table th { background-color: #f2f2f2; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow: auto; max-height: 300px; }
    </style>
</head>
<body>
    <h1>🔍 Merchants Data - Final Verification Test</h1>
    <p>This test will verify that the merchants page is properly loading real data from DynamoDB.</p>
    
    <div id="status">Checking merchants data...</div>
    
    <button onclick="testMerchantsData()">🔄 Test Merchants Data Loading</button>
    <button onclick="testAddressExtraction()">🏠 Test Address Extraction</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    
    <div id="results"></div>

    <!-- Load required scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1454.0.min.js"></script>
    <script src="config.js"></script>

    <script>
        function addResult(title, content, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<h3>${title}</h3><div>${content}</div>`;
            document.getElementById('results').appendChild(div);
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testMerchantsData() {
            updateStatus('🔄 Testing merchants data loading...', 'info');
            clearResults();

            try {
                // Check authentication
                const idToken = sessionStorage.getItem('idToken');
                const accessToken = sessionStorage.getItem('accessToken');
                
                addResult('1. Authentication Check', 
                    `ID Token: ${idToken ? '✅ Present' : '❌ Missing'}<br>` +
                    `Access Token: ${accessToken ? '✅ Present' : '❌ Missing'}`,
                    (idToken && accessToken) ? 'success' : 'warning');

                // Initialize AWS
                if (!window.amplifyConfig) {
                    throw new Error('Amplify configuration not loaded');
                }

                const region = window.amplifyConfig.data?.aws_region || 'us-east-1';
                const userPoolId = window.amplifyConfig.auth.user_pool_id;
                const identityPoolId = window.amplifyConfig.auth.identity_pool_id;

                AWS.config.update({ region });

                // Set up credentials
                const credParams = { IdentityPoolId: identityPoolId };
                if (idToken && idToken.length > 50) {
                    const provider = `cognito-idp.${region}.amazonaws.com/${userPoolId}`;
                    credParams.Logins = { [provider]: idToken };
                }

                AWS.config.credentials = new AWS.CognitoIdentityCredentials(credParams);
                await AWS.config.credentials.refreshPromise();

                addResult('2. AWS Configuration', 
                    `Region: ${region}<br>` +
                    `Identity Pool: ${identityPoolId}<br>` +
                    `Identity ID: ${AWS.config.credentials.identityId}<br>` +
                    `Authenticated: ${AWS.config.credentials.authenticated}`,
                    'success');

                // Test DynamoDB access
                const dynamoDB = new AWS.DynamoDB.DocumentClient({
                    convertEmptyValues: true,
                    removeUndefinedValues: true,
                    region: region
                });

                const params = {
                    TableName: 'order-receiver-businesses-dev',
                    Limit: 10
                };

                addResult('3. DynamoDB Scan Started', 
                    `Table: ${params.TableName}<br>Limit: ${params.Limit}`, 
                    'info');

                const result = await dynamoDB.scan(params).promise();

                if (result.Items && result.Items.length > 0) {
                    updateStatus(`✅ Success! Found ${result.Items.length} merchants in database`, 'success');
                    
                    addResult('4. DynamoDB Data Retrieved', 
                        `Found: ${result.Items.length} merchants<br>` +
                        `Scanned Count: ${result.ScannedCount}<br>` +
                        `Sample merchant: ${result.Items[0].businessName || result.Items[0].name || 'Unknown'}`,
                        'success');

                    // Test address extraction
                    const sampleMerchant = result.Items[0];
                    let addressTest = 'No address found';
                    if (sampleMerchant.address) {
                        if (typeof sampleMerchant.address === 'object') {
                            // Check if it's AttributeValue format
                            if (sampleMerchant.address.country && sampleMerchant.address.country.S) {
                                const parts = [];
                                if (sampleMerchant.address.street && sampleMerchant.address.street.S) parts.push(sampleMerchant.address.street.S);
                                if (sampleMerchant.address.district && sampleMerchant.address.district.S) parts.push(sampleMerchant.address.district.S);
                                if (sampleMerchant.address.city && sampleMerchant.address.city.S) parts.push(sampleMerchant.address.city.S);
                                if (sampleMerchant.address.country && sampleMerchant.address.country.S) parts.push(sampleMerchant.address.country.S);
                                addressTest = parts.join(', ') || 'Could not extract address';
                            } else {
                                // Regular object format
                                const parts = [];
                                if (sampleMerchant.address.street) parts.push(sampleMerchant.address.street);
                                if (sampleMerchant.address.district) parts.push(sampleMerchant.address.district);
                                if (sampleMerchant.address.city) parts.push(sampleMerchant.address.city);
                                if (sampleMerchant.address.country) parts.push(sampleMerchant.address.country);
                                addressTest = parts.join(', ') || 'Could not extract address';
                            }
                        } else {
                            addressTest = sampleMerchant.address;
                        }
                    }

                    addResult('5. Address Extraction Test', 
                        `Raw address object: <pre>${JSON.stringify(sampleMerchant.address, null, 2)}</pre>` +
                        `Extracted address: <strong>${addressTest}</strong>`,
                        addressTest !== 'No address found' ? 'success' : 'warning');

                    // Show merchant data in table format
                    let tableHTML = `
                        <table class="merchant-table">
                            <thead>
                                <tr><th>Name</th><th>ID</th><th>Phone</th><th>Address</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                    `;

                    result.Items.slice(0, 5).forEach(item => {
                        let address = 'N/A';
                        if (item.address && typeof item.address === 'object') {
                            if (item.address.country && item.address.country.S) {
                                const parts = [];
                                if (item.address.street && item.address.street.S) parts.push(item.address.street.S);
                                if (item.address.district && item.address.district.S) parts.push(item.address.district.S);
                                if (item.address.city && item.address.city.S) parts.push(item.address.city.S);
                                if (item.address.country && item.address.country.S) parts.push(item.address.country.S);
                                address = parts.join(', ') || 'Address extraction failed';
                            }
                        }

                        tableHTML += `
                            <tr>
                                <td>${item.businessName || item.name || 'Unknown'}</td>
                                <td>${item.businessId || item.id || 'N/A'}</td>
                                <td>${item.phoneNumber || item.phone || 'N/A'}</td>
                                <td>${address}</td>
                                <td>${item.isActive ? '✅ Active' : '❌ Inactive'}</td>
                            </tr>
                        `;
                    });

                    tableHTML += '</tbody></table>';

                    addResult('6. Merchants Data Preview', tableHTML, 'success');

                } else {
                    updateStatus('⚠️ Database table exists but is empty', 'warning');
                    addResult('4. Empty Database', 'The merchants table exists but contains no data.', 'warning');
                }

            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, 'error');
                addResult('❌ Error Details', 
                    `Message: ${error.message}<br>` +
                    `Code: ${error.code || 'Unknown'}<br>` +
                    `Stack: <pre>${error.stack}</pre>`,
                    'error');
            }
        }

        function testAddressExtraction() {
            addResult('Address Extraction Function Test', 
                'Testing the address extraction function with sample data...', 
                'info');

            // Test with AttributeValue format
            const testAddress1 = {
                "country": { "S": "Iraq" },
                "city": { "S": "النجف" },
                "street": { "S": "شارع الصناعة" },
                "district": { "S": "المناذرة" }
            };

            // Test with regular object format
            const testAddress2 = {
                "country": "Iraq",
                "city": "النجف",
                "street": "شارع الصناعة",
                "district": "المناذرة"
            };

            addResult('Address Test Results', 
                `AttributeValue format: ${JSON.stringify(testAddress1)}<br>` +
                `Regular object format: ${JSON.stringify(testAddress2)}`,
                'info');
        }

        // Auto-run test after a short delay
        setTimeout(() => {
            testMerchantsData();
        }, 1000);
    </script>
</body>
</html>
