<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dashboard Test</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Override any potential issues */
        body { margin: 0; padding: 0; }
        .debug-box { 
            background: red; 
            color: white; 
            padding: 20px; 
            margin: 10px;
            border: 2px solid yellow;
        }
    </style>
</head>
<body>
    <div class="debug-box">
        <h1>DEBUG: This should be visible</h1>
        <p>If you can see this red box, HTML and basic CSS are working</p>
    </div>

    <!-- Simplified Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-rocket"></i>
                <span>WizzCentral</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item active">
                    <a href="#" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Simplified Main Content -->
    <div class="main-content" id="mainContent">
        <div class="debug-box">
            <h2>DEBUG: Main Content Area</h2>
            <p>This should appear to the right of the sidebar</p>
        </div>
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <h1 class="page-title">Dashboard Test</h1>
            </div>
        </div>

        <!-- Simple Stats -->
        <div class="dashboard-content">
            <div class="debug-box">
                <h3>Dashboard Content</h3>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon orders">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div class="stat-info">
                        <h3>1,247</h3>
                        <p>Total Orders Today</p>
                        <span class="stat-change positive">+12.5%</span>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon drivers">
                        <i class="fas fa-motorcycle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>89</h3>
                        <p>Active Drivers</p>
                        <span class="stat-change positive">+5.2%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('Simple dashboard loaded');
        
        // Log element visibility
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            console.log('Sidebar:', sidebar ? 'Found' : 'Not found');
            console.log('Main Content:', mainContent ? 'Found' : 'Not found');
            
            if (sidebar) {
                const sidebarStyle = window.getComputedStyle(sidebar);
                console.log('Sidebar display:', sidebarStyle.display);
                console.log('Sidebar visibility:', sidebarStyle.visibility);
                console.log('Sidebar position:', sidebarStyle.position);
            }
            
            if (mainContent) {
                const mainStyle = window.getComputedStyle(mainContent);
                console.log('Main content display:', mainStyle.display);
                console.log('Main content margin-left:', mainStyle.marginLeft);
            }
        }, 1000);
    </script>
</body>
</html>
