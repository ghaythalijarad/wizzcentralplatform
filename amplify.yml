version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - echo "Building Amplify Gen 2 backend"
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
            - echo "Static site ready for deployment"
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
        exclude:
          - node_modules/**/*
          - .amplify/**/*
          - amplify/backend/**/*
          - backend/**/*
          - .git/**/*
          - '*.log'
