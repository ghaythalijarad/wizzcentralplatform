<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DynamoDB Test</title>
</head>
<body>
    <h1>Simple DynamoDB Access Test</h1>
    <div id="results"></div>
    
    <!-- AWS SDK -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1471.0.min.js"></script>
    
    <script>
        async function testDirectAccess() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing direct DynamoDB access...</p>';
            
            try {
                // Configure AWS directly
                AWS.config.update({ 
                    region: 'us-east-1',
                    maxRetries: 3
                });

                // Set up unauthenticated credentials
                AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                    IdentityPoolId: 'us-east-1:38954d71-6b61-431d-942b-406c6a200f7c',
                });

                console.log('Refreshing credentials...');
                await AWS.config.credentials.refreshPromise();
                console.log('Credentials refreshed');

                const dynamodb = new AWS.DynamoDB.DocumentClient({
                    convertEmptyValues: true,
                    removeUndefinedValues: true
                });

                console.log('Scanning WizzUser_users_dev table...');
                const params = {
                    TableName: 'WizzUser_users_dev',
                    Limit: 10
                };

                const result = await dynamodb.scan(params).promise();
                console.log('Scan successful:', result);

                resultsDiv.innerHTML = `
                    <h3>✅ Success!</h3>
                    <p><strong>Items found:</strong> ${result.Items ? result.Items.length : 0}</p>
                    <p><strong>Scanned count:</strong> ${result.ScannedCount || 0}</p>
                    <h4>Items:</h4>
                    <pre>${JSON.stringify(result.Items, null, 2)}</pre>
                `;

            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <pre>${error.stack || JSON.stringify(error, null, 2)}</pre>
                `;
            }
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            setTimeout(testDirectAccess, 1000);
        });
    </script>
</body>
</html>
