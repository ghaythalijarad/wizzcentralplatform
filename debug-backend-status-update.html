<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Backend Status Update</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 1200px; }
        .section { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .warning { background: #fff3e0; border-left: 4px solid #ff9800; }
        .info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f1f1f1; padding: 10px; border-radius: 4px; overflow-x: auto; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 150px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🐛 Backend Status Update Debugging</h1>
    
    <div class="section info">
        <h3>Test Parameters</h3>
        <div class="form-group">
            <label>Merchant ID:</label>
            <input type="text" id="merchantId" placeholder="Enter businessId from DynamoDB" value="biz_008">
        </div>
        <div class="form-group">
            <label>Action:</label>
            <select id="action">
                <option value="approve">Approve</option>
                <option value="reject">Reject</option>
                <option value="suspend">Suspend</option>
                <option value="review">Review</option>
                <option value="reactivate">Reactivate</option>
            </select>
        </div>
        <div class="form-group">
            <label>Reason:</label>
            <input type="text" id="reason" placeholder="Reason for status change" value="Testing status update via debug tool">
        </div>
        <button onclick="testStatusUpdate()">🧪 Test Status Update</button>
        <button onclick="testMerchantLookup()">🔍 Test Merchant Lookup</button>
        <button onclick="checkAuthentication()">🔐 Check Authentication</button>
    </div>

    <div class="section">
        <h3>Debug Results</h3>
        <div id="results"></div>
    </div>

    <div class="section">
        <h3>Request/Response Details</h3>
        <div id="details"></div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE_URL = window.WIZZCENTRAL_CONFIG.API_BASE_URL;
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const resultDiv = document.getElementById('results');
            resultDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function showDetails(title, data) {
            const detailsDiv = document.getElementById('details');
            detailsDiv.innerHTML += `
                <h4>${title}</h4>
                <pre>${typeof data === 'object' ? JSON.stringify(data, null, 2) : data}</pre>
            `;
        }

        async function checkAuthentication() {
            log('🔐 Checking authentication tokens...', 'info');
            
            const accessToken = sessionStorage.getItem('accessToken');
            const idToken = sessionStorage.getItem('idToken');
            
            if (!accessToken && !idToken) {
                log('❌ No authentication tokens found', 'error');
                return false;
            }
            
            log('✅ Authentication tokens found', 'success');
            showDetails('Authentication Tokens', {
                accessToken: accessToken ? `${accessToken.substring(0, 20)}...` : 'None',
                idToken: idToken ? `${idToken.substring(0, 20)}...` : 'None'
            });
            
            return true;
        }

        async function testMerchantLookup() {
            const merchantId = document.getElementById('merchantId').value.trim();
            
            if (!merchantId) {
                log('❌ Please enter a merchant ID', 'error');
                return;
            }
            
            log(`🔍 Testing merchant lookup for ID: ${merchantId}`, 'info');
            
            const hasAuth = await checkAuthentication();
            if (!hasAuth) return;
            
            try {
                const accessToken = sessionStorage.getItem('accessToken') || sessionStorage.getItem('idToken');
                
                const response = await fetch(`${API_BASE_URL}/merchants/${merchantId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const responseText = await response.text();
                log(`📥 Response Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                showDetails('Merchant Lookup Request', {
                    url: `${API_BASE_URL}/merchants/${merchantId}`,
                    method: 'GET',
                    status: response.status,
                    statusText: response.statusText
                });
                
                if (response.ok) {
                    const data = JSON.parse(responseText);
                    log('✅ Merchant found successfully', 'success');
                    showDetails('Merchant Data', data);
                } else {
                    log(`❌ Merchant lookup failed: ${responseText}`, 'error');
                    showDetails('Error Response', responseText);
                }
                
            } catch (error) {
                log(`❌ Merchant lookup error: ${error.message}`, 'error');
                showDetails('Exception Details', error);
            }
        }

        async function testStatusUpdate() {
            const merchantId = document.getElementById('merchantId').value.trim();
            const action = document.getElementById('action').value;
            const reason = document.getElementById('reason').value.trim();
            
            if (!merchantId || !reason) {
                log('❌ Please fill in all required fields', 'error');
                return;
            }
            
            log(`🧪 Testing status update for merchant: ${merchantId}`, 'info');
            log(`📝 Action: ${action}, Reason: ${reason}`, 'info');
            
            const hasAuth = await checkAuthentication();
            if (!hasAuth) return;
            
            try {
                const accessToken = sessionStorage.getItem('accessToken') || sessionStorage.getItem('idToken');
                
                const requestBody = {
                    action: action,
                    reason: reason,
                    sendEmail: true
                };
                
                showDetails('Status Update Request', {
                    url: `${API_BASE_URL}/merchants/${merchantId}/status`,
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken.substring(0, 20)}...`,
                        'Content-Type': 'application/json'
                    },
                    body: requestBody
                });
                
                log('📤 Sending status update request...', 'info');
                
                const response = await fetch(`${API_BASE_URL}/merchants/${merchantId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const responseText = await response.text();
                log(`📥 Response Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                showDetails('Status Update Response', {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries([...response.headers.entries()]),
                    body: responseText
                });
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        log('✅ Status update successful!', 'success');
                        showDetails('Success Response Data', data);
                    } catch (parseError) {
                        log('✅ Status update successful (non-JSON response)', 'success');
                    }
                } else {
                    log(`❌ Status update failed: ${responseText}`, 'error');
                    
                    // Try to parse error details
                    try {
                        const errorData = JSON.parse(responseText);
                        showDetails('Error Response Data', errorData);
                    } catch (parseError) {
                        log('Could not parse error response as JSON', 'warning');
                    }
                }
                
            } catch (error) {
                log(`❌ Status update error: ${error.message}`, 'error');
                showDetails('Exception Details', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack
                });
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Backend Status Update Debugger initialized', 'info');
            log(`🌐 API Base URL: ${API_BASE_URL}`, 'info');
        });
    </script>
</body>
</html>
