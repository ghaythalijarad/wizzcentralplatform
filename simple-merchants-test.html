<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Merchants Test</title>
    <link rel="stylesheet" href="../dashboard.css">
    <style>
        body { padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Simple Merchants Test</h1>
    <div id="test-results"></div>
    
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Business</th>
                    <th>Owner</th>
                    <th>Status</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="merchantsTableBody">
                <tr>
                    <td colspan="7" style="text-align: center;">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function showResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            document.getElementById('test-results').appendChild(div);
        }

        // Sample data
        const sampleMerchants = [
            {
                id: 'biz-001',
                name: 'Pizza Palace Downtown',
                email: 'contact@pizzapalace.com',
                phone: '+1-555-0123',
                status: 'approved',
                address: '123 Main St, Downtown',
                owner: 'John Smith',
                avatar: 'https://ui-avatars.com/api/?name=Pizza+Palace&size=40&background=random&color=fff'
            },
            {
                id: 'biz-002',
                name: 'Fresh Market Express',
                email: 'info@freshmarket.com',
                phone: '+1-555-0124',
                status: 'pending',
                address: '456 Oak Avenue',
                owner: 'Sarah Johnson',
                avatar: 'https://ui-avatars.com/api/?name=Fresh+Market&size=40&background=random&color=fff'
            },
            {
                id: 'biz-003',
                name: 'Coffee Corner Cafe',
                email: 'hello@coffeecorner.com',
                phone: '+1-555-0125',
                status: 'under_review',
                address: '789 Pine Street',
                owner: 'Mike Wilson',
                avatar: 'https://ui-avatars.com/api/?name=Coffee+Corner&size=40&background=random&color=fff'
            }
        ];

        function getStatusClass(status) {
            const statusMap = {
                'pending': 'pending',
                'approved': 'verified',
                'rejected': 'rejected',
                'under_review': 'under-review',
                'suspended': 'suspended'
            };
            return statusMap[status] || 'unknown';
        }

        function getStatusLabel(status) {
            const statusLabels = {
                'pending': 'Pending',
                'approved': 'Approved',
                'rejected': 'Rejected',
                'under_review': 'Under Review',
                'suspended': 'Suspended'
            };
            return statusLabels[status] || 'Unknown';
        }

        function renderTable() {
            showResult('Starting table render...', 'info');
            
            const tbody = document.getElementById('merchantsTableBody');
            if (!tbody) {
                showResult('Table body not found!', 'error');
                return;
            }

            try {
                tbody.innerHTML = sampleMerchants.map(merchant => `
                    <tr>
                        <td>
                            <div class="merchant-info">
                                <div class="merchant-avatar">
                                    <img src="${merchant.avatar}" alt="${merchant.name}" onerror="this.src='https://via.placeholder.com/40x40?text=M'">
                                </div>
                                <div class="merchant-name">
                                    ${merchant.name}
                                </div>
                            </div>
                        </td>
                        <td>${merchant.owner}</td>
                        <td>
                            <span class="status-badge ${getStatusClass(merchant.status)}">
                                ${getStatusLabel(merchant.status)}
                            </span>
                        </td>
                        <td>${merchant.email}</td>
                        <td>${merchant.phone}</td>
                        <td>${merchant.address}</td>
                        <td>
                            <div class="actions">
                                <button class="btn-action" onclick="alert('View ${merchant.name}')" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn-action" onclick="alert('Edit ${merchant.name}')" title="Edit Status">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                
                showResult(`Table rendered successfully with ${sampleMerchants.length} merchants`, 'success');
                
            } catch (error) {
                showResult(`Error rendering table: ${error.message}`, 'error');
                console.error('Render error:', error);
            }
        }

        // Run the test
        document.addEventListener('DOMContentLoaded', function() {
            showResult('DOM loaded, starting test...', 'info');
            setTimeout(renderTable, 500); // Small delay to simulate loading
        });
    </script>
</body>
</html>
